  { k:"Technical", s:"In your quiz project, how does the two-digit seven-segment countdown work?",
    s_ms:"Dalam projek kuiz anda, bagaimanakah kira detik seven-segment dua digit itu berfungsi?",
    kw_ms:"Multiplexing 7-Segmen",
    m_ms:["Digit kongsi 7 pin segmen", "Satu digit setiap kali, 4 ms", "Mata nampak dua-dua menyala", "Common anode: LOW = menyala", "Jadual carian 0-9", "9 pin, bukan 14"],
    a_ms:"Dua digit itu **berkongsi tujuh pin segmen yang sama**, dan setiap digit mempunyai **pin common** sendiri. Saya menggunakan **multiplexing**: saya menghidupkan satu digit, memaparkan nombornya selama **kira-kira 4 milisaat**, kemudian bertukar ke digit yang satu lagi. Ia berlaku begitu pantas sehingga mata melihat **kedua-dua digit menyala serentak**. Paparan ini jenis **common anode**, jadi segmen menyala apabila pinnya **LOW**. Corak nombor disimpan dalam **jadual carian (lookup table)** sepuluh entri, satu bagi setiap digit 0 hingga 9. Dengan cara ini saya hanya perlukan **9 pin, bukan 14**.",
    t_ms:"Mereka mungkin bertanya tentang arus: bersedia menyatakan sama ada anda memasang perintang pada segmen, dan bahawa transistor pada pin common setiap digit ialah reka bentuk yang lebih selamat.",
    a:"The two digits **share the same seven segment pins**, and each digit has its own **common pin**. I use **multiplexing**: I switch on one digit, show its number for **about 4 milliseconds**, then switch to the other digit. It happens so fast that the eye sees **both digits lit together**. The display is **common anode**, so a segment lights when its pin is **LOW**. The number patterns are kept in a **lookup table** of ten entries, one for each digit from 0 to 9. This way I need only **9 pins instead of 14**.",
    e:"⏲️",
    kw:"7-Segment Multiplexing",
    m:[["🔗", "Digits share 7 segment pins"], ["🔀", "One digit at a time, 4 ms each"], ["👁️", "Eye sees both lit"], ["⬇️", "Common anode: LOW = on"], ["📋", "Lookup table 0-9"], ["📌", "9 pins instead of 14"]],
    j:["Digits share 7 segment pins", "One digit at a time, 4 ms each", "Eye sees both lit", "Common anode: LOW = on", "Lookup table 0-9", "9 pins instead of 14"],
    t:"They may ask about current: be ready to say whether you used resistors on the segments, and that a transistor on each digit's common pin is the safer design." },

  { k:"Technical", s:"In your quiz project, how are the buttons and the LCD connected and read?",
    s_ms:"Dalam projek kuiz anda, bagaimanakah butang dan LCD disambung dan dibaca?",
    kw_ms:"Butang & LCD",
    m_ms:["Pull-up dalaman", "Active low: tekan = LOW", "Polling dalam gelung paparan", "LCD dengan penyesuai I2C", "SDA + SCL sahaja", "Pustaka LCD + alamat I2C"],
    a_ms:"Setiap butang disambung ke pin input dengan **pull-up dalaman** dihidupkan, jadi pin itu membaca **HIGH pada keadaan biasa dan LOW apabila ditekan**. Ini dipanggil **active low**, dan ia tidak memerlukan perintang luaran. Program **menyemak (polling)** empat butang itu di dalam gelung paparan, setiap beberapa milisaat, jadi tekanan dikesan dengan cepat. LCD ialah paparan aksara 20x4 dengan **penyesuai I2C**, jadi ia hanya perlukan **dua wayar isyarat, SDA dan SCL**, bukannya banyak pin selari. Saya menggunakan **pustaka LCD** sedia ada dan menetapkan **alamat I2C** paparan itu dalam kod.",
    t_ms:"Projek anda menggunakan polling, bukan interrupt. Nyatakan dengan jujur, dan tambah bahawa interrupt ialah penambahbaikan seterusnya.",
    a:"Each button is connected to an input pin with the **internal pull-up** switched on, so the pin reads **HIGH normally and LOW when pressed**. That is called **active low**, and it needs no external resistor. The program **polls** the four buttons inside the display loop, every few milliseconds, so a press is detected quickly. The LCD is a 20x4 character display with an **I2C adapter**, so it needs only **two signal wires, SDA and SCL**, instead of many parallel pins. I used a ready-made **LCD library** and set the display's **I2C address** in the code.",
    e:"🔘",
    kw:"Buttons & LCD",
    m:[["⬆️", "Internal pull-up"], ["⬇️", "Active low: pressed = LOW"], ["🔁", "Polled in the display loop"], ["📟", "LCD with I2C adapter"], ["🔌", "Only SDA + SCL"], ["📚", "LCD library + I2C address"]],
    j:["Internal pull-up", "Active low: pressed = LOW", "Polled in the display loop", "LCD with I2C adapter", "Only SDA + SCL", "LCD library + I2C address"],
    t:"Your project uses polling, not interrupts. Say so honestly, and add that interrupts would be the next improvement." },

  { k:"Technical", s:"What would you improve in your quiz project if you did it again?",
    s_ms:"Apakah yang anda akan tambah baik dalam projek kuiz anda jika dibuat semula?",
    kw_ms:"Tambah Baik Projek",
    m_ms:["Kira detik laju di bawah 10", "Guna pemasa perkakasan", "Interrupt + debounce", "Benih rawak lebih baik", "Breadboard ke PCB"],
    a_ms:"Pertama, **pemasaan**. Kira detik menggunakan delay di dalam gelung paparan, dan apabila hanya satu digit dipaparkan, setiap gelung menjadi lebih pendek, jadi **saat-saat terakhir berjalan lebih laju** daripada sepatutnya. Saya akan menggunakan **pemasa perkakasan (hardware timer)** untuk mengira saat sebenar. Kedua, saya akan membaca butang dengan **interrupt** dan menambah **debounce**, bukannya polling. Ketiga, soalan dirawak menggunakan **benih rawak (random seed)** daripada masa permulaan, yang hampir sama setiap kali dihidupkan, jadi saya akan **mengambil benih daripada saat pemain mula-mula menekan butang**. Akhir sekali, saya akan memindahkan pendawaian daripada breadboard ke **PCB**.",
    t_ms:"Semak kira detik pada papan sebenar dengan jam randik sebelum temu duga, supaya anda boleh menerangkan dengan tepat apa yang anda lihat.",
    a:"First, the **timing**. The countdown uses delays inside the display loop, and when only one digit is showing, each loop is shorter, so the **last seconds run faster** than they should. I would use a **hardware timer** to count real seconds. Second, I would read the buttons with **interrupts** and add **debouncing**, instead of polling. Third, the questions are shuffled using a **random seed** taken from the start-up time, which is almost the same at every power-on, so I would **take the seed from the moment the player first presses a button**. Finally, I would move the wiring from the breadboard to a **PCB**.",
    e:"🛠️",
    kw:"Project Improvements",
    m:[["⏱️", "Countdown runs fast below 10"], ["⏲️", "Use a hardware timer"], ["🔔", "Interrupts + debounce"], ["🎲", "Better random seed"], ["🟩", "Breadboard to PCB"]],
    j:["Countdown runs fast below 10", "Use a hardware timer", "Interrupts + debounce", "Better random seed", "Breadboard to PCB"],
    t:"Check the countdown on the real board with a stopwatch before the interview, so that you can describe exactly what you saw." },
  { k:"Technical", s:"What is the difference between a microprocessor and a microcontroller?",
    s_ms:"Apakah perbezaan antara mikropemproses dan mikropengawal?",
    kw_ms:"MPU vs MCU",
    m_ms:["MPU: CPU sahaja", "MCU: semua dalam satu cip", "MPU: prestasi tinggi, OS", "MCU: kos & kuasa rendah", "Saya guna STM32 & Arduino"],
    a_ms:"**Mikropemproses (microprocessor)** pada asasnya ialah **CPU** sahaja; ia memerlukan memori dan peranti luaran, dan digunakan dalam PC serta pelayan untuk **prestasi tinggi**. **Mikropengawal (microcontroller)** mempunyai CPU, memori dan peranti **dalam satu cip**, dan direka untuk tugas kawalan yang **kos rendah dan jimat kuasa** dalam produk embedded. Contohnya, Intel Core ialah mikropemproses, manakala **STM32 dan Arduino**, yang saya gunakan dalam projek, ialah mikropengawal.",
    t_ms:"Kaitkan teori dengan projek STM32 dan Arduino anda sendiri.",
    a:"A **microprocessor** is mainly a **CPU**; it needs external memory and peripherals and is used in PCs and servers for **high performance**. A **microcontroller** has the CPU, memory and peripherals **on one chip**, and is designed for **low-cost, low-power** control tasks in embedded products. For example, Intel Core is a microprocessor, while **STM32 and Arduino**, which I used in my projects, are microcontrollers.",
    e:"🧠",
    kw:"MPU vs MCU",
    m:[["🧠", "MPU: CPU only"], ["🧩", "MCU: all on one chip"], ["🚀", "MPU: performance, OS"], ["🔋", "MCU: low cost & power"], ["📎", "I used STM32 & Arduino"]],
    j:["Microprocessor: mainly a CPU; needs external memory and peripherals; used in PCs and servers.",
       "Microcontroller: CPU, memory and peripherals (timers, ADC, GPIO, serial ports) on one chip.",
       "Microprocessors focus on high performance and run a full operating system.",
       "Microcontrollers focus on low cost, low power and control tasks in embedded products.",
       "Examples: Intel Core is a microprocessor; Arduino (AVR), STM32 or ESP32 are microcontrollers.",
       "My experience: STM32 Nucleo-F401RE in the quiz system and Arduino in Algae-X."],
    t:"Link the theory to your own STM32 and Arduino projects." },

  { k:"Technical", s:"Which programming languages are you comfortable with, and what have you built with them?",
    s_ms:"Bahasa pengaturcaraan apakah yang anda selesa gunakan, dan apa yang pernah anda bina dengannya?",
    kw_ms:"Bahasa Program",
    m_ms:["C: permainan Blackjack", "C++: kuiz STM32, Digital Twin", "C# + React: tempahan tiket", "Python, Verilog, SQL, MATLAB", "GitHub, Ubuntu", "Tahap sebenar setiap satu"],
    a_ms:"Saya paling selesa dengan **C, C++, C# dan Python**. Dengan **C**, saya membina permainan Blackjack di Ubuntu. Saya menggunakan **C++ dengan Mbed OS** untuk sistem kuiz STM32, serta **C++ dan Python** untuk meneroka projek Digital Twin. Saya menggunakan **C# dengan ASP.NET Core serta React** untuk sistem tempahan tiket acara. Saya juga tahu **Verilog, SQL dan MATLAB**, dan menggunakan **GitHub**. Saya jujur tentang tahap saya bagi setiap satu, dan saya boleh **mempelajari bahasa baharu** apabila kerja memerlukannya.",
    t_ms:"Bersedia menyatakan bahasa yang digunakan dalam projek Arduino. Jangan mengaku tahu bahasa yang anda tidak boleh jawab soalan asasnya.",
    a:"I am most comfortable with **C, C++, C# and Python**. In **C** I built a Blackjack game on Ubuntu. I used **C++ with Mbed OS** for my STM32 quiz system, and **C++ and Python** to explore a Digital Twin project. I used **C# with ASP.NET Core and React** for an event ticket booking system. I also know **Verilog, SQL and MATLAB**, and I use **GitHub**. I am honest about my level in each, and I can **pick up a new language** when the job needs it.",
    e:"⌨️",
    kw:"Languages",
    m:[["🎚️", "C: Blackjack game"], ["🐍", "C++: STM32 quiz, Digital Twin"], ["🌐", "C# + React: ticket booking"], ["🔢", "Python, Verilog, SQL, MATLAB"], ["🌳", "GitHub, Ubuntu"], ["📋", "Honest level for each"]],
    j:["C: Blackjack game", "C++: STM32 quiz, Digital Twin", "C# + React: ticket booking", "Python, Verilog, SQL, MATLAB", "GitHub, Ubuntu", "Honest level for each"],
    t:"Be ready to say which language you used on the Arduino project. Never claim a language you cannot answer basic questions on." },

  { k:"Technical", s:"Explain the difference between combinational and sequential logic.",
    s_ms:"Terangkan perbezaan antara logik kombinasi dan logik jujukan.",
    kw_ms:"Kombinasi vs Jujukan",
    m_ms:["Kombinasi: input sahaja", "Adder, mux, decoder", "Jujukan: keadaan + clock", "Flip-flop, counter, FSM", "Latch aras, FF pinggir"],
    a_ms:"Dalam **logik kombinasi (combinational)**, output bergantung **hanya pada input semasa**, tanpa memori; contohnya **adder, multiplexer dan decoder**. Dalam **logik jujukan (sequential)**, output juga bergantung pada **keadaan yang disimpan**, biasanya dengan **clock**; contohnya **flip-flop, counter dan state machine**. Latch peka kepada aras (level), manakala flip-flop dipicu oleh pinggir (edge).",
    t_ms:"Verilog ada dalam resume anda, jadi bersedia menerangkan apa yang anda bina dengannya.",
    a:"In **combinational logic**, the output depends **only on the current inputs**, with no memory; examples are **adders, multiplexers and decoders**. In **sequential logic**, the output also depends on a **stored state**, usually with a **clock**; examples are **flip-flops, counters and state machines**. A latch is level-sensitive, while a flip-flop is edge-triggered.",
    e:"🔀",
    kw:"Comb. vs Seq.",
    m:[["➡️", "Comb: inputs only"], ["➕", "Adder, mux, decoder"], ["💾", "Seq: state + clock"], ["🔢", "Flip-flop, counter, FSM"], ["⏱️", "Latch level, FF edge"]],
    j:["Combinational: output depends only on the current inputs; no memory.",
       "Examples: adders, multiplexers, decoders, basic gates.",
       "Sequential: output depends on current inputs and stored state; has memory and usually a clock.",
       "Examples: flip-flops, registers, counters, state machines.",
       "A latch is level-sensitive, a flip-flop is edge-triggered."],
    t:"Verilog is on your resume, so be ready to explain what you built with it." },

  { k:"Technical", s:"What is an interrupt, and how is it different from polling?",
    s_ms:"Apakah itu interrupt, dan apakah bezanya dengan polling?",
    kw_ms:"Interrupt vs Polling",
    m_ms:["Interrupt: isyarat ke ISR", "Polling: semak dalam gelung", "Interrupt: cekap, pantas", "Polling: mudah, membazir", "ISR mesti pendek"],
    a_ms:"**Interrupt** ialah isyarat yang membuatkan pemproses berhenti seketika daripada kerja semasa dan menjalankan satu rutin khas yang dipanggil **ISR**. Dengan **polling**, program **menyemak peranti berulang kali** dalam gelung. Interrupt **lebih cekap dan bertindak balas lebih pantas** bagi peristiwa yang jarang berlaku, manakala polling **lebih mudah tetapi membazirkan** masa pemproses. Amalan yang baik ialah **memastikan ISR pendek**. Dalam projek kuiz saya, saya menggunakan **polling** untuk butang.",
    t_ms:"Projek kuiz anda menyemak butang (polling) di dalam gelung paparan. Guna ia sebagai contoh polling, dan nyatakan bahawa interrupt ialah penambahbaikannya.",
    a:"An **interrupt** is a signal that makes the processor pause its current work and run a handler, called an **ISR**. With **polling**, the program **checks the device again and again** in a loop. Interrupts are **more efficient and respond faster** for events that happen rarely, while polling is **simpler but wastes** processor time. A good practice is to **keep the ISR short**. In my quiz project I used **polling** for the buttons.",
    e:"🔔",
    kw:"Interrupt vs Polling",
    m:[["🔔", "Interrupt: signal to ISR"], ["🔁", "Polling: check in loop"], ["⚡", "Interrupt: efficient, fast"], ["🐢", "Polling: simple, wasteful"], ["✂️", "Keep ISR short"]],
    j:["Interrupt: a signal that makes the processor pause its current work and run a handler (ISR).",
       "Polling: the program checks the device again and again in a loop.",
       "Interrupts are more efficient and respond faster for events that happen rarely.",
       "Polling is simpler but wastes processor time.",
       "Keep an ISR short; do the heavy work in the main loop."],
    t:"Your quiz project polls the buttons inside the display loop. Use it as your polling example, and say that an interrupt would be the improvement." },

  { k:"Technical", s:"Compare UART, SPI and I2C.",
    s_ms:"Bandingkan UART, SPI dan I2C.",
    kw_ms:"UART / SPI / I2C",
    m_ms:["UART: 2 wayar, tiada clock", "SPI: 4 wayar, laju", "I2C: 2 wayar, alamat", "Pilih ikut kelajuan / pin"],
    a_ms:"**UART** ialah komunikasi tak segerak yang menggunakan **dua wayar tanpa clock**, untuk sambungan titik ke titik. **SPI** ialah komunikasi segerak dengan **empat wayar** dan merupakan yang **paling laju**, dengan satu chip-select bagi setiap peranti. **I2C** juga segerak dengan **dua wayar** dan menyokong banyak peranti pada satu bas menggunakan **alamat**. Saya akan memilih SPI untuk kelajuan, I2C untuk banyak peranti dengan pin yang sedikit, dan UART untuk sambungan mudah serta debugging. Dalam projek kuiz saya, saya menggunakan **I2C** untuk LCD.",
    t_ms:"Anda menggunakan I2C untuk LCD 20x4: dua wayar, SDA dan SCL, dengan alamat I2C LCD ditetapkan dalam kod.",
    a:"**UART** is asynchronous and uses **two wires with no clock**, for point-to-point links. **SPI** is synchronous with **four wires** and is the **fastest**, using one chip-select per device. **I2C** is synchronous with **two wires** and supports many devices on one bus using **addresses**. I would choose SPI for speed, I2C for many devices with few pins, and UART for simple links and debugging. In my quiz project I used **I2C** for the LCD.",
    e:"🔗",
    kw:"UART / SPI / I2C",
    m:[["📡", "UART: 2 wires, no clock"], ["🏎️", "SPI: 4 wires, fast"], ["🏠", "I2C: 2 wires, addresses"], ["🎯", "Choose by speed / pins"]],
    j:["UART: asynchronous, 2 wires (TX, RX), no clock, point to point; both sides must agree on baud rate.",
       "SPI: synchronous, 4 wires (MOSI, MISO, SCK, CS), fast, one chip-select per device.",
       "I2C: synchronous, 2 wires (SDA, SCL), many devices on one bus using addresses, slower than SPI.",
       "Choose SPI for speed, I2C for many devices with few pins, UART for simple links and debugging."],
    t:"You used I2C for the 20x4 LCD: two wires, SDA and SCL, with the LCD's I2C address set in the code." },

  { k:"Technical", s:"Explain the main concepts of object-oriented programming.",
    s_ms:"Terangkan konsep utama pengaturcaraan berorientasikan objek (OOP).",
    kw_ms:"OOP",
    m_ms:["Encapsulation", "Abstraction", "Inheritance", "Polymorphism", "Guna semula & mudah selenggara"],
    a_ms:"OOP mempunyai empat konsep utama. **Encapsulation** menyimpan data bersama fungsinya dan menyembunyikan butiran dalaman. **Abstraction** menunjukkan hanya apa yang diperlukan oleh pengguna sesuatu class. **Inheritance** membolehkan class baharu mengguna semula dan mengembangkan class sedia ada. **Polymorphism** membolehkan panggilan yang sama berkelakuan berbeza mengikut objek. Semua ini menjadikan kod lebih mudah **diguna semula dan diselenggara**.",
    t_ms:"Guna sistem tempahan tiket acara (C# ASP.NET Core) sebagai contoh; resume anda menyatakan ia menggunakan konsep OOP.",
    a:"Object-oriented programming has four main concepts. **Encapsulation** keeps data and its functions together and hides the internal details. **Abstraction** shows only what the user of a class needs. **Inheritance** lets a new class reuse and extend an existing one. **Polymorphism** lets the same call behave differently depending on the object. Together they make code easier to **reuse and maintain**.",
    e:"🧱",
    kw:"OOP",
    m:[["📦", "Encapsulation"], ["🎭", "Abstraction"], ["🧬", "Inheritance"], ["🦎", "Polymorphism"], ["♻️", "Reuse & maintain"]],
    j:["Encapsulation: keep data and the functions that use it together, hide the internal details.",
       "Abstraction: show only what the user of the class needs.",
       "Inheritance: a new class reuses and extends an existing class.",
       "Polymorphism: the same call behaves differently depending on the object type.",
       "Benefit: code that is easier to reuse, test and maintain."],
    t:"Use your event ticket booking system (C# ASP.NET Core) as the example; your resume says it applied OOP concepts." },

  { k:"Technical", s:"What is the difference between an array and a linked list? When would you use each?",
    s_ms:"Apakah perbezaan antara array dan linked list? Bilakah anda menggunakan setiap satu?",
    kw_ms:"Array vs Linked List",
    m_ms:["Array: bersebelahan", "Array: laju ikut indeks", "List: nod + pointer", "List: mudah tambah / buang", "Baca: array, ubah: list"],
    a_ms:"**Array** menyimpan elemen **bersebelahan**, jadi capaian **mengikut indeks adalah laju**, tetapi menambah atau membuang di tengah adalah perlahan. **Linked list** menyimpan **nod yang dihubungkan dengan pointer**, jadi **mudah untuk menambah dan membuang**, tetapi perlahan untuk sampai ke item ke-n dan menggunakan memori tambahan. Saya menggunakan **array apabila banyak membaca mengikut indeks**, dan **linked list apabila kerap menambah dan membuang**.",
    t_ms:"Jika ditanya, bersedia menyebut stack dan queue juga.",
    a:"An **array** stores elements **next to each other**, so access **by index is fast**, but inserting or deleting in the middle is slow. A **linked list** stores **nodes linked by pointers**, so it is **easy to insert and delete**, but slow to reach the n-th item, and it uses extra memory. I would use an **array when reading by index** a lot, and a **linked list when inserting and removing** often.",
    e:"📚",
    kw:"Array vs Linked List",
    m:[["📏", "Array: side by side"], ["⚡", "Array: fast by index"], ["🔗", "List: nodes + pointers"], ["✂️", "List: easy insert / delete"], ["🎯", "Read: array, edit: list"]],
    j:["Array: elements stored next to each other; fast access by index.",
       "Array: inserting or deleting in the middle is slow; size is usually fixed.",
       "Linked list: nodes linked by pointers; easy to insert and delete.",
       "Linked list: slow to reach the n-th item; uses extra memory for pointers.",
       "Use an array when you read by index a lot; a linked list when you insert and remove often."],
    t:"If asked, be ready to mention stack and queue as well." },

  { k:"Technical", s:"What is the difference between a process and a thread?",
    s_ms:"Apakah perbezaan antara process dan thread?",
    kw_ms:"Process vs Thread",
    m_ms:["Process: memori sendiri", "Thread: kongsi memori", "Thread lebih ringan", "Race: lock / mutex", "Thread rosak, process tumbang"],
    a_ms:"**Process** ialah program yang sedang berjalan dengan **ruang memori sendiri**. **Thread** ialah unit pelaksanaan di dalam process, dan thread **berkongsi memori process** itu. Thread **lebih ringan dan lebih cepat** dicipta, tetapi memori yang dikongsi boleh menyebabkan **race condition**, jadi **lock atau mutex** diperlukan. Jika satu process ranap, process lain biasanya tidak terjejas, tetapi satu thread yang bermasalah boleh menjatuhkan seluruh process.",
    t_ms:"Kaitkan dengan projek anda: kod kuiz anda berjalan di atas Mbed OS, iaitu sebuah RTOS, dan ThisThread::sleep_for menghentikan seketika thread utama.",
    a:"A **process** is a running program with **its own memory space**. A **thread** is a unit of execution inside a process, and threads **share the process memory**. Threads are **lighter and faster** to create, but shared memory can cause **race conditions**, so **locks or mutexes** are needed. A crash in one process usually does not affect another, but a bad thread can bring down its whole process.",
    e:"🧵",
    kw:"Process vs Thread",
    m:[["🏠", "Process: own memory"], ["🧵", "Thread: shares memory"], ["🪶", "Threads are lighter"], ["🔒", "Races: locks / mutex"], ["💥", "Bad thread kills process"]],
    j:["Process: a running program with its own memory space.",
       "Thread: a unit of execution inside a process; threads share the process memory.",
       "Threads are lighter and faster to create and switch.",
       "Shared memory means threads need care: race conditions, use of locks or mutexes.",
       "A crash in one process usually does not affect another; a bad thread can bring down its whole process."],
    t:"Link it to your project: your quiz code runs on Mbed OS, which is an RTOS, and ThisThread::sleep_for pauses the main thread." },

  { k:"Technical", s:"Your code or circuit is not working. How do you debug it?",
    s_ms:"Kod atau litar anda tidak berfungsi. Bagaimana anda mencari puncanya (debug)?",
    kw_ms:"Debugging",
    m_ms:["Ulang masalah", "Semak perkara asas", "Bahagi & asingkan", "Debugger, skop, print", "Satu perubahan setiap kali", "Punca sebenar & uji semula"],
    a_ms:"Mula-mula saya **mengulang masalah itu** dan menerangkan dengan tepat apa yang salah. Kemudian saya **menyemak perkara asas**: bekalan kuasa, pendawaian, sambungan dan kesilapan menaip. Saya **membahagikan masalah** dan menguji satu bahagian pada satu masa, menggunakan alat seperti **print statement, debugger, multimeter atau osiloskop**. Saya **mengubah satu perkara pada satu masa** dan mencatat apa yang telah dicuba. Selepas dibaiki, saya mencari **punca sebenar** dan menguji semula.",
    t_ms:"Ceritakan pengalaman debugging yang sebenar. Penemu duga mahu melihat kaedah anda, bukan nasib.",
    a:"First I **reproduce the problem** and describe exactly what is wrong. Then I **check the basics**: power, wiring, connections and typing mistakes. I **divide the problem** and test one part at a time, using tools such as **print statements, a debugger, a multimeter or an oscilloscope**. I **change one thing at a time** and record what I tried. After the fix, I look for the **root cause** and test again.",
    e:"🐞",
    kw:"Debugging",
    m:[["🔁", "Reproduce"], ["🔌", "Check the basics"], ["✂️", "Divide & isolate"], ["🧰", "Debugger, scope, prints"], ["1️⃣", "One change at a time"], ["🌳", "Root cause & retest"]],
    j:["Reproduce the problem and describe exactly what is wrong.",
       "Check the simple things first: power, wiring, connections, typing mistakes.",
       "Divide the problem: test one part at a time to find where it fails.",
       "Use tools: print statements, debugger and breakpoints, multimeter, oscilloscope or logic analyser.",
       "Change one thing at a time and record what you tried.",
       "After the fix, find the root cause and test again so it does not come back."],
    t:"Tell a real debugging story. Interviewers want to see your method, not luck." },

  { k:"Technical", s:"What is version control and why is it important?",
    s_ms:"Apakah itu version control dan mengapa ia penting?",
    kw_ms:"Version Control",
    m_ms:["Rekod setiap perubahan", "Boleh undur bila-bila", "Branch & merge", "Siapa ubah apa", "Semakan kod & ujian"],
    a_ms:"**Version control**, seperti Git, ialah sistem yang **merekod setiap perubahan** pada kod dari semasa ke semasa. Ia membolehkan saya **kembali ke versi terdahulu** jika ada yang rosak, dan membolehkan beberapa orang bekerja pada kod yang sama menggunakan **branch dan merge**. Ia juga menunjukkan **siapa yang mengubah apa dan mengapa**. Dalam industri, ia menjadi asas kepada **semakan kod dan ujian automatik**.",
    t_ms:"GitHub ada dalam resume anda; bersedia menyatakan cara anda menggunakannya dalam projek berkumpulan.",
    a:"**Version control**, such as Git, is a system that **records every change** to the code over time. It lets me **go back to an earlier version** if something breaks, and lets several people work on the same code using **branches and merges**. It also shows **who changed what and why**. In industry, it is the base for **code review and automated testing**.",
    e:"🌳",
    kw:"Version Control",
    m:[["📜", "Records every change"], ["⏪", "Go back anytime"], ["🌿", "Branch & merge"], ["👤", "Who changed what"], ["✅", "Code review & testing"]],
    j:["A system (such as Git) that records every change to code over time.",
       "You can go back to an earlier version if something breaks.",
       "Several people can work on the same code using branches and merges.",
       "Shows who changed what and why (commit messages).",
       "In industry it is the base for code review and automated testing."],
    t:"GitHub is on your resume; be ready to say how you used it in a team project." },

  { k:"Technical", s:"What do you know about how a semiconductor chip is made?",
    s_ms:"Apakah yang anda tahu tentang cara cip semikonduktor dihasilkan?",
    kw_ms:"Cara Cip Dibuat",
    m_ms:["Reka bentuk & pengesahan", "Front-end: fabrikasi wafer", "Back-end: pemasangan & ujian", "Substrat / PCB", "Pulau Pinang & Kulim kukuh"],
    a_ms:"Cip bermula dengan **reka bentuk**, iaitu litar direka dan disahkan menggunakan perisian. Pada peringkat **front-end**, atau **fabrikasi wafer**, litar dibina di atas wafer silikon di dalam cleanroom melalui langkah seperti litografi, etching dan deposition. Pada peringkat **back-end**, wafer dipotong, **dibungkus dan diuji**. **Substrat dan PCB** kemudian menyambungkan cip kepada produk. Malaysia, terutamanya **Pulau Pinang dan Kulim**, kukuh dalam rantaian ini.",
    t_ms:"Ketahui bahagian rantaian yang diceburi oleh syarikat yang anda mohon.",
    a:"A chip starts with **design**, where the circuit is designed and verified with software. In the **front-end**, or **wafer fabrication**, the circuits are built on silicon wafers in a cleanroom through steps such as lithography, etching and deposition. In the **back-end**, the wafers are cut, **packaged and tested**. **Substrates and PCBs** then connect the chip to the product. Malaysia, especially **Penang and Kulim**, is strong in this chain.",
    e:"🏭",
    kw:"How Chips Are Made",
    m:[["✏️", "Design & verify"], ["🏭", "Front-end: wafer fab"], ["📦", "Back-end: assembly & test"], ["🟩", "Substrate / PCB"], ["📍", "Penang & Kulim strong"]],
    j:["Design: the circuit is designed and verified with software tools.",
       "Front-end (wafer fabrication): circuits are built on silicon wafers through steps like lithography, etching and deposition, in a cleanroom.",
       "Back-end (assembly and test): wafers are cut into dies, packaged, then tested.",
       "Substrates and PCBs connect the chip to the rest of the product.",
       "Malaysia, especially Penang and Kulim, is strong in assembly, test and increasingly in fabrication and design."],
    t:"Know which part of the chain the company you are applying to works in." },

  { k:"Technical", s:"How could programming or data skills be useful in a manufacturing plant?",
    s_ms:"Bagaimanakah kemahiran pengaturcaraan atau data boleh berguna di kilang pembuatan?",
    kw_ms:"Kod di Kilang",
    m_ms:["Automasi kerja manual", "Dashboard", "Automasi ujian", "Data mesin & sensor", "Pemeriksaan visi / AI", "Saya: Python, SQL, Power BI"],
    a_ms:"Kemahiran pengaturcaraan dan data membantu kilang dengan **mengautomasikan kerja manual**, seperti mengumpul dan melaporkan data. **Dashboard** boleh memantau output, yield dan downtime, dan **automasi ujian** boleh menjalankan ujian serta merekod keputusan. **Data mesin dan sensor** memberi amaran awal tentang masalah, dan **pemprosesan imej atau AI** boleh memeriksa produk. Saya boleh menyumbang dengan **Python, SQL dan Power BI**.",
    t_ms:"Berguna untuk semua syarikat dalam senarai, kerana semuanya mengendalikan kilang.",
    a:"Programming and data skills help a plant by **automating manual work**, such as collecting and reporting data. **Dashboards** can monitor output, yield and downtime, and **test automation** can run tests and log results. **Machine and sensor data** give early warning of problems, and **image processing or AI** can inspect products. I can contribute with **Python, SQL and Power BI**.",
    e:"📊",
    kw:"Code in a Factory",
    m:[["🤖", "Automate manual work"], ["📊", "Dashboards"], ["🧪", "Test automation"], ["📡", "Machine & sensor data"], ["👁️", "Vision / AI inspection"], ["💼", "Mine: Python, SQL, Power BI"]],
    j:["Automating manual work: scripts to collect, clean and report data.",
       "Dashboards to monitor output, yield, downtime and quality.",
       "Test automation: programs that run tests and log results.",
       "Machine and sensor data (IoT) for early warning of problems.",
       "Image processing or AI for inspection.",
       "My related skills: Python, SQL, Excel and Power BI, plus Digital Twin exploration with Grafana."],
    t:"Useful for every company on the list, since all of them run factories." },

  /* ---------- Digital & smart factory: general knowledge, not tied to any company ---------- */
  { k:"Digital & Smart Factory", s:"What digital systems does a typical manufacturing plant use?",
    s_ms:"Apakah sistem digital yang biasanya digunakan di kilang pembuatan?",
    kw_ms:"Sistem Kilang",
    m_ms:["ERP: perniagaan & bahan", "MES: lantai pengeluaran", "QMS: kualiti & dokumen", "Alat pejabat: borang, aliran kerja, laporan", "Pangkalan data & aplikasi web", "Nilai datang daripada integrasi"],
    a_ms:"Kilang biasanya mempunyai sistem **ERP**, seperti SAP, untuk mengurus pesanan, bahan, inventori dan kewangan. **MES** menjejak pengeluaran di **lantai pengeluaran**, dan **sistem pengurusan kualiti (QMS)** mengawal dokumen, penyimpangan dan latihan. Kerja harian berjalan atas **alat pejabat dan kolaborasi**, contohnya Microsoft 365 dengan Power BI untuk laporan dan Power Apps untuk borang. Terdapat juga **pangkalan data dan aplikasi web** yang dibina untuk keperluan setempat. Nilai sebenar datang apabila semua sistem ini **dihubungkan**, supaya data dimasukkan sekali dan digunakan di semua tempat.",
    t_ms:"Ini pengetahuan am; jangan meneka apa yang digunakan oleh syarikat. Akhiri dengan bertanya: 'Yang mana satu digunakan di sini?'",
    a:"A plant usually has an **ERP** system, such as SAP, to manage orders, materials, inventory and finance. An **MES** tracks production on the **shop floor**, and a **quality management system** controls documents, deviations and training. Day-to-day work runs on **office and collaboration tools**, for example Microsoft 365 with Power BI for reports and Power Apps for forms. There are also **databases and web applications** built for local needs. The real value comes when these systems are **connected**, so that data is entered once and used everywhere.",
    e:"🏭",
    kw:"Plant Systems",
    m:[["🏢", "ERP: business & materials"], ["⚙️", "MES: shop floor"], ["📋", "QMS: quality & documents"], ["🪟", "Office tools: forms, workflow, reports"], ["🗄️", "Databases & web apps"], ["🔗", "Value comes from linking them"]],
    j:["ERP: business & materials", "MES: shop floor", "QMS: quality & documents", "Office tools: forms, workflow, reports", "Databases & web apps", "Value comes from linking them"],
    t:"This is general knowledge; do not guess what the company uses. End by asking: 'Which of these do you use here?'" },

  { k:"Digital & Smart Factory", s:"What is the difference between an ERP system and an MES?",
    s_ms:"Apakah perbezaan antara sistem ERP dan MES?",
    kw_ms:"ERP vs MES",
    m_ms:["ERP: rancang perniagaan", "Pesanan, bahan, kewangan", "MES: kendali lantai pengeluaran", "Masa nyata: order, mesin, kualiti", "Terbaik jika berintegrasi", "Tidak berhubung: data dua kali"],
    a_ms:"**ERP** merancang dan merekod **urusan perniagaan**: pesanan pelanggan, bahan, inventori, production order dan kewangan. **MES** mengendalikan **lantai pengeluaran dalam masa nyata**: ia menjejak setiap production order, mesin, operator dan semakan kualiti, serta menyimpan rekod **kebolehkesanan (traceability)**. ERP menentukan **apa yang perlu dibuat dan bila**; MES merekod **bagaimana ia sebenarnya dibuat**. Kedua-duanya paling berkesan apabila **berintegrasi**. Jika tidak berhubung, orang perlu **memasukkan data yang sama dua kali**, yang mengambil masa dan berisiko silap.",
    t_ms:"Versi satu ayat untuk diingat: ERP untuk perancangan, MES untuk pelaksanaan.",
    a:"An **ERP** plans and records the **business**: customer orders, materials, inventory, production orders and finance. An **MES** runs the **shop floor in real time**: it tracks each production order, machine, operator and quality check, and keeps the **traceability** records. The ERP says **what to make and when**; the MES records **how it was actually made**. They work best when **integrated**. If they are not linked, people have to **enter the same data twice**, which takes time and risks errors.",
    e:"⚙️",
    kw:"ERP vs MES",
    m:[["🏢", "ERP: plans the business"], ["📦", "Orders, materials, finance"], ["⚙️", "MES: runs the shop floor"], ["⏱️", "Real time: order, machine, quality"], ["🔗", "Best when integrated"], ["⌨️", "Not linked: double entry"]],
    j:["ERP: plans the business", "Orders, materials, finance", "MES: runs the shop floor", "Real time: order, machine, quality", "Best when integrated", "Not linked: double entry"],
    t:"A one-line version to remember: ERP is for planning, MES is for execution." },

  { k:"Digital & Smart Factory", s:"What do you understand by a smart factory, or Industry 4.0?",
    s_ms:"Apakah yang anda faham tentang kilang pintar (smart factory) atau Industri 4.0?",
    kw_ms:"Kilang Pintar",
    m_ms:["Mesin & sensor bersambung", "Data masa nyata", "Sistem berintegrasi", "Analitik & AI", "Berautomasi, tanpa kertas", "Matlamat: kualiti, kos, kepantasan"],
    a_ms:"**Kilang pintar** ialah kilang yang mesin, pekerja dan sistemnya **bersambung dan berkongsi data**. **Sensor dan mesin** menghantar data dalam **masa nyata**, dan sistem dari lantai pengeluaran hingga ke ERP **berintegrasi**. Data itu digunakan untuk **analitik dan AI**, seperti meramal kerosakan mesin atau mengesan kecacatan. Kerja menjadi lebih **berautomasi dan tanpa kertas**. Teknologi bukan matlamatnya; matlamatnya ialah **kualiti lebih baik, kos lebih rendah dan keputusan lebih pantas**. **Industri 4.0** ialah nama bagi peralihan kepada pembuatan yang bersambung dan dipacu data ini.",
    t_ms:"Kaitkan dengan diri sendiri: penerokaan Digital Twin dan projek sensor anda ialah sebahagian kecil daripada kilang pintar. Dasar negara Malaysia untuk ini dinamakan Industry4WRD.",
    a:"A **smart factory** is a plant where machines, people and systems are **connected and share data**. **Sensors and machines** send data in **real time**, and the systems, from the shop floor up to the ERP, are **integrated**. That data is used for **analytics and AI**, such as predicting a machine failure or detecting defects. Work becomes more **automated and paperless**. The technology is not the goal; the goal is **better quality, lower cost and faster decisions**. **Industry 4.0** is the name for this move to connected, data-driven manufacturing.",
    e:"🤖",
    kw:"Smart Factory",
    m:[["📡", "Connected machines & sensors"], ["⏱️", "Real-time data"], ["🔗", "Integrated systems"], ["🧠", "Analytics & AI"], ["🦾", "Automated, paperless"], ["🎯", "Goal: quality, cost, speed"]],
    j:["Connected machines & sensors", "Real-time data", "Integrated systems", "Analytics & AI", "Automated, paperless", "Goal: quality, cost, speed"],
    t:"Link it to yourself: your Digital Twin exploration and sensor projects are small pieces of a smart factory. Malaysia's national policy for this is called Industry4WRD." },

  { k:"Digital & Smart Factory", s:"What is a digital roadmap, and how would a factory start one?",
    s_ms:"Apakah itu pelan hala tuju digital (digital roadmap), dan bagaimana sesebuah kilang memulakannya?",
    kw_ms:"Hala Tuju Digital",
    m_ms:["Pelan beberapa tahun, ikut matlamat", "Nilai keadaan semasa", "Utamakan: nilai vs usaha", "Asas data dahulu", "Rintis, kemudian kembangkan", "Orang, latihan, tadbir urus"],
    a_ms:"**Pelan hala tuju digital** ialah rancangan projek digital untuk **beberapa tahun**, yang dikaitkan dengan **matlamat perniagaan** kilang. Saya akan bermula dengan **menilai keadaan semasa**: proses mana yang masih atas kertas, di mana data dimasukkan secara manual, dan sistem mana yang belum berhubung. Kemudian saya **menyusun keutamaan** idea mengikut **nilai berbanding usaha**, bermula dengan kejayaan cepat (quick win). Pelan yang baik membina **asas data** dahulu, kerana dashboard dan AI bergantung pada data yang bersih. Setiap projek dijalankan sebagai **rintis**, kemudian **dikembangkan** jika berjaya. Ia juga memerlukan **orang, latihan dan tadbir urus**, termasuk keselamatan siber.",
    t_ms:"Sebagai pelatih anda tidak akan menulis pelan itu, tetapi anda mungkin membantu satu langkah, seperti memetakan proses manual. Nyatakan begitu.",
    a:"A **digital roadmap** is a plan of digital projects over **several years**, tied to the **business goals** of the plant. I would start by **assessing the current state**: which processes are still on paper, where data is entered by hand, and which systems are not connected. Then I would **prioritise** the ideas by **value against effort**, starting with quick wins. A good roadmap builds the **data foundation** first, because dashboards and AI depend on clean data. Each project is run as a **pilot**, then **scaled** if it works. It also needs **people, training and governance**, including cybersecurity.",
    e:"🧭",
    kw:"Digital Roadmap",
    m:[["🗺️", "Multi-year plan tied to goals"], ["🔎", "Assess the current state"], ["🎯", "Prioritise: value vs effort"], ["🧱", "Data foundation first"], ["🧪", "Pilot, then scale"], ["👥", "People, training, governance"]],
    j:["Multi-year plan tied to goals", "Assess the current state", "Prioritise: value vs effort", "Data foundation first", "Pilot, then scale", "People, training, governance"],
    t:"As an intern you will not write the roadmap, but you may help with one step, such as mapping manual processes. Say that." },

  { k:"Digital & Smart Factory", s:"How would you collect data from a machine and show it on a dashboard?",
    s_ms:"Bagaimanakah anda mengumpul data daripada mesin dan memaparkannya pada dashboard?",
    kw_ms:"Data Mesin (IoT)",
    m_ms:["Sensor atau pengawal mesin (PLC)", "Gateway & rangkaian", "Protokol: OPC UA, MQTT", "Simpan dalam pangkalan data", "Dashboard & amaran", "Selamat, baca sahaja"],
    a_ms:"Data bermula daripada **sensor** atau **pengawal mesin (PLC)**. Sebuah **gateway** membacanya dan menghantarnya melalui **rangkaian**, menggunakan protokol industri seperti **OPC UA atau MQTT**. Data disimpan dalam **pangkalan data** bersama cap masa. Dari situ, **dashboard** boleh memaparkan status, trend dan **amaran** apabila sesuatu nilai di luar julat. Saya akan memastikan sambungan itu **selamat dan baca sahaja**, supaya ia tidak mengganggu mesin. Saya pernah membuat versi kecilnya dengan **sensor pada Arduino** dalam projek Algae-X.",
    t_ms:"Guna Algae-X sebagai contoh: pengesanan paras air dan kekeruhan dengan Arduino.",
    a:"The data starts at a **sensor** or at the machine's **controller (PLC)**. A **gateway** reads it and sends it over the **network**, using an industrial protocol such as **OPC UA or MQTT**. The data is stored in a **database** with a time stamp. From there, a **dashboard** can show the status, trends and **alerts** when a value goes out of range. I would make sure the connection is **secure and read-only**, so that it cannot disturb the machine. I have done a small-scale version of this with **sensors on an Arduino** in my Algae-X project.",
    e:"📡",
    kw:"Machine Data (IoT)",
    m:[["🌡️", "Sensor or machine controller (PLC)"], ["📶", "Gateway & network"], ["📨", "Protocol: OPC UA, MQTT"], ["🗄️", "Store in a database"], ["📊", "Dashboard & alerts"], ["🔒", "Secure, read-only"]],
    j:["Sensor or machine controller (PLC)", "Gateway & network", "Protocol: OPC UA, MQTT", "Store in a database", "Dashboard & alerts", "Secure, read-only"],
    t:"Use Algae-X as your example: water-level and turbidity sensing with an Arduino." },

  { k:"Digital & Smart Factory", s:"What is a digital twin?",
    s_ms:"Apakah itu digital twin?",
    kw_ms:"Digital Twin",
    m_ms:["Salinan maya aset sebenar", "Disuap data sebenar", "Pantau", "Simulasi sebelum ubah", "Ramal masalah", "Saya: C++, Python, Grafana, Omniverse"],
    a_ms:"**Digital twin** ialah **model maya** bagi mesin, barisan atau proses sebenar yang **disuap dengan data sebenar**. Ia membolehkan jurutera **memantau** keadaan sebenar, **mensimulasikan perubahan** sebelum melaksanakannya, dan **meramal masalah** seperti kerosakan. Saya meneroka perkara ini dalam **projek Digital Twin** saya, menggunakan **C++ dan Python**, dengan **Grafana** untuk visualisasi dan **NVIDIA Omniverse** untuk simulasi. Ia satu penerokaan, jadi saya faham konsep dan alatnya pada tahap asas.",
    t_ms:"Jujur bahawa ia satu penerokaan. Bersedia menyatakan data yang digunakan dan apa yang dipaparkan dalam Grafana.",
    a:"A **digital twin** is a **virtual model** of a real machine, line or process that is **fed with real data**. It lets engineers **monitor** the real thing, **simulate a change** before doing it for real, and **predict problems** such as a failure. I explored this in my **Digital Twin project**, using **C++ and Python**, with **Grafana** for visualisation and **NVIDIA Omniverse** for simulation. It was an exploration, so I understand the concept and the tools at a basic level.",
    e:"🧬",
    kw:"Digital Twin",
    m:[["🪞", "Virtual copy of a real asset"], ["📡", "Fed by real data"], ["👀", "Monitor"], ["🧪", "Simulate before changing"], ["🔮", "Predict problems"], ["🛠️", "Mine: C++, Python, Grafana, Omniverse"]],
    j:["Virtual copy of a real asset", "Fed by real data", "Monitor", "Simulate before changing", "Predict problems", "Mine: C++, Python, Grafana, Omniverse"],
    t:"Be honest that it was an exploration. Be ready to say what data you used and what you displayed in Grafana." },

  { k:"Digital & Smart Factory", s:"How can AI be used in a factory, and what are the risks?",
    s_ms:"Bagaimanakah AI boleh digunakan di kilang, dan apakah risikonya?",
    kw_ms:"AI di Kilang",
    m_ms:["Pemeriksaan visi", "Penyelenggaraan ramalan", "Ramalan permintaan / yield", "Pembantu untuk dokumen", "Risiko: data lemah, jawapan salah", "Data sulit, validasi"],
    a_ms:"AI boleh digunakan untuk **pemeriksaan visi** bagi mengesan kecacatan, **penyelenggaraan ramalan** bagi memberi amaran sebelum mesin rosak, dan **ramalan** permintaan atau yield. **Pembantu AI** juga boleh membantu staf mencari prosedur dan menulis laporan. Risikonya ialah AI bergantung pada **data yang baik**, dan ia boleh memberi **jawapan yang salah dengan yakin**, jadi manusia mesti menyemak hasilnya. Dalam syarikat yang dikawal selia, **data sulit** tidak boleh dimasukkan ke dalam alat AI awam, dan AI yang digunakan untuk keputusan kualiti mesti **disahkan (validated)**. Saya pernah menggunakan **Gemini AI** dalam hackathon, jadi saya telah melihat kekuatan dan hadnya.",
    t_ms:"Sebut risikonya tanpa ditanya; ia menunjukkan kematangan.",
    a:"AI can be used for **vision inspection** to detect defects, for **predictive maintenance** to warn before a machine fails, and for **forecasting** demand or yield. **AI assistants** can also help staff search procedures and write reports. The risks are that AI depends on **good data**, and it can give **wrong answers with confidence**, so a person must check the result. In a regulated company, **confidential data** must not go into public AI tools, and an AI used for quality decisions must be **validated**. I used **Gemini AI** in a hackathon, so I have seen both its strength and its limits.",
    e:"🧠",
    kw:"AI in a Factory",
    m:[["👁️", "Vision inspection"], ["🔧", "Predictive maintenance"], ["📈", "Forecasting"], ["💬", "Assistants for documents"], ["⚠️", "Risk: weak data, wrong answers"], ["🔒", "Confidential data, validation"]],
    j:["Vision inspection", "Predictive maintenance", "Forecasting", "Assistants for documents", "Risk: weak data, wrong answers", "Confidential data, validation"],
    t:"Mention the risks without being asked; it shows maturity." },

  { k:"Digital & Smart Factory", s:"What is visual management on a production floor?",
    s_ms:"Apakah itu pengurusan visual (visual management) di lantai pengeluaran?",
    kw_ms:"Pengurusan Visual",
    m_ms:["Status sepintas lalu", "Sasaran vs sebenar", "Warna: hijau, kuning, merah", "Andon: panggil bantuan", "Pasukan bertindak pantas", "Papan atau skrin digital"],
    a_ms:"**Pengurusan visual** ialah amalan lean yang menjadikan **status pengeluaran kelihatan sepintas lalu**. Papan atau skrin menunjukkan **sasaran berbanding pencapaian sebenar** bagi output, kualiti dan downtime, selalunya menggunakan **warna** seperti hijau, kuning dan merah. Isyarat **andon** membolehkan operator **memanggil bantuan** apabila ada masalah. Tujuannya supaya pasukan **nampak masalah dengan cepat dan bertindak**, tanpa menunggu laporan. Ia boleh berupa papan putih yang ringkas, atau **skrin digital** yang disuap data pengeluaran.",
    t_ms:"Paparan hanya berguna jika data di belakangnya betul dan terkini.",
    a:"**Visual management** is a lean practice that makes the **status of production visible at a glance**. Boards or screens show the **target against the actual** output, quality and downtime, often using **colours** such as green, yellow and red. An **andon** signal lets an operator **call for help** when there is a problem. The purpose is for the team to **see a problem quickly and react**, without waiting for a report. It can be a simple whiteboard, or a **digital screen** fed by production data.",
    e:"📺",
    kw:"Visual Management",
    m:[["👀", "Status at a glance"], ["🎯", "Target vs actual"], ["🚦", "Colours: green, yellow, red"], ["🚨", "Andon: call for help"], ["⚡", "Team reacts fast"], ["📺", "Board or digital screen"]],
    j:["Status at a glance", "Target vs actual", "Colours: green, yellow, red", "Andon: call for help", "Team reacts fast", "Board or digital screen"],
    t:"A display is only useful if the data behind it is correct and up to date." },

  { k:"Digital & Smart Factory", s:"What experience do you have in building a web application or an online form?",
    s_ms:"Apakah pengalaman anda membina aplikasi web atau borang dalam talian?",
    kw_ms:"Pengalaman Aplikasi Web",
    m_ms:["Tempahan tiket: React + C# ASP.NET", "Borang, sahkan, simpan", "Pangkalan data SQL", "Kelulusan & laporan", "Pelayan menjadi hos", "Ikut standard syarikat"],
    a_ms:"Saya pernah membina **sistem tempahan tiket acara** dengan **React** untuk front end dan **C# ASP.NET Core** untuk back end, menggunakan **[Visual Studio atau VS Code, nyatakan yang sebenar]**. Saya faham aliran borang dalam talian: pengguna **mengisi borang**, pelayan **mengesahkan data** dan menyimpannya ke **pangkalan data menggunakan SQL**, kemudian ia boleh **dihantar untuk kelulusan** dan dilaporkan. Saya belum pernah memasang aplikasi pada **pelayan** syarikat, tetapi saya faham ia menjadi hos aplikasi dan menghubungkannya dengan pangkalan data. Saya mahu belajar **standard dan templat syarikat**.",
    t_ms:"Bersedia menerangkan satu halaman sistem tempahan tiket anda dari hujung ke hujung: borang, kod C# di belakangnya, dan jadual pangkalan data.",
    a:"I built an **event ticket booking system** with **React** for the front end and **C# ASP.NET Core** for the back end, using **[Visual Studio or VS Code, say which one]**. I understand the flow of an online form: the user **fills in the form**, the server **validates the data** and saves it to a **database using SQL**, then it can be **routed for approval** and reported. I have not deployed to a company **server** yet, but I understand that it hosts the application and connects it to the database. I am keen to learn the **company's standards and templates**.",
    e:"🌐",
    kw:"Web App Experience",
    m:[["🎫", "Ticket booking: React + C# ASP.NET"], ["📝", "Form, validate, save"], ["🗄️", "SQL database"], ["✅", "Approval & report"], ["🖥️", "Server hosts the app"], ["📐", "Follow company standards"]],
    j:["Ticket booking: React + C# ASP.NET", "Form, validate, save", "SQL database", "Approval & report", "Server hosts the app", "Follow company standards"],
    t:"Be ready to explain one page of your ticket booking system from end to end: the form, the C# code behind it, and the database table." },

  { k:"Digital & Smart Factory", s:"How would you turn a paper form into an online form?",
    s_ms:"Bagaimanakah anda menukar borang kertas kepada borang dalam talian?",
    kw_ms:"Borang Kertas ke Dalam Talian",
    m_ms:["Fahami borang semasa", "Medan & pengesahan", "Aliran kelulusan", "Guna alat yang diluluskan", "Uji, kawalan perubahan", "Latih pengguna, laporkan data"],
    a_ms:"Saya akan bermula dengan **memahami borang sedia ada**: siapa yang mengisi, siapa yang meluluskan dan di mana ia disimpan. Kemudian saya menetapkan **medan dan peraturan pengesahan**, serta **aliran kelulusan**. Saya membinanya dengan **alat yang diluluskan oleh syarikat**, contohnya Power Apps dengan SharePoint list, atau borang web dengan pangkalan data. Saya akan **mengujinya bersama pengguna sebenar**, mengikut langkah **kawalan perubahan** syarikat, kemudian **melatih pengguna**. Akhir sekali, datanya boleh digunakan untuk **laporan atau dashboard**.",
    t_ms:"Nyatakan bahawa anda akan menggunakan alat yang diluluskan oleh syarikat; dalam syarikat yang dikawal selia, anda tidak memilih perisian sendiri.",
    a:"I would start by **understanding the current form**: who fills it in, who approves it and where it is kept. Then I would define the **fields and validation rules**, and the **approval workflow**. I would build it with the **tool the company has approved**, for example Power Apps with a SharePoint list, or a web form with a database. I would **test it with real users**, follow the company's **change control** steps, then **train the users**. Finally, the data can feed a **report or dashboard**.",
    e:"📝",
    kw:"Paper to Online Form",
    m:[["🔎", "Understand the current form"], ["🧾", "Fields & validation"], ["✅", "Approval workflow"], ["🛠️", "Use the approved tool"], ["🧪", "Test, change control"], ["📊", "Train users, report the data"]],
    j:["Understand the current form", "Fields & validation", "Approval workflow", "Use the approved tool", "Test, change control", "Train users, report the data"],
    t:"Say that you would use whatever tool the company has approved; in a regulated company you do not pick your own software." },

  { k:"Digital & Smart Factory", s:"How would you build a production dashboard in Power BI?",
    s_ms:"Bagaimanakah anda membina dashboard pengeluaran dalam Power BI?",
    kw_ms:"Dashboard Power BI",
    m_ms:["Setuju KPI dengan pengguna", "Sambung ke sumber data", "Bersihkan dalam Power Query", "Model + jadual kalendar", "Measure DAX", "Sahkan, terbit, refresh"],
    a_ms:"Mula-mula saya bersetuju dengan pengguna tentang **soalan yang perlu dijawab oleh dashboard** dan KPI-nya, seperti output, yield dan downtime. Kemudian saya **menyambung kepada sumber data**, contohnya data ERP, pangkalan data SQL, Excel atau SharePoint list, dan **membersihkannya dalam Power Query**. Saya membina **model data yang ringkas dengan jadual kalendar**, dan menulis **measure DAX** untuk KPI. Selepas itu saya mereka bentuk **visual yang jelas**, menyemak angka **dengan sumber asal**, kemudian menerbitkannya dengan **refresh berjadual**.",
    t_ms:"Power BI ada dalam resume anda. Bersedia menerangkan satu laporan yang anda bina: sumber datanya, satu measure dan satu carta.",
    a:"First I would agree with the users on the **questions the dashboard must answer** and the KPIs, such as output, yield and downtime. Then I would **connect to the data source**, for example ERP data, a SQL database, Excel or a SharePoint list, and **clean it in Power Query**. I would build a simple **data model with a calendar table**, and write **DAX measures** for the KPIs. After that I would design **clear visuals**, check the numbers **against the source**, then publish it with a **scheduled refresh**.",
    e:"📊",
    kw:"Power BI Dashboard",
    m:[["🎯", "Agree KPIs with users"], ["🔌", "Connect to the data"], ["🧹", "Clean in Power Query"], ["📅", "Model + calendar table"], ["🧮", "DAX measures"], ["✅", "Verify, publish, refresh"]],
    j:["Agree KPIs with users", "Connect to the data", "Clean in Power Query", "Model + calendar table", "DAX measures", "Verify, publish, refresh"],
    t:"Power BI is on your resume. Be ready to describe one report you built: its data source, one measure and one chart." },

  { k:"Digital & Smart Factory", s:"You notice the same data is being keyed into two systems. What would you do?",
    s_ms:"Anda mendapati data yang sama ditaip ke dalam dua sistem. Apakah yang anda akan lakukan?",
    kw_ms:"Data Ditaip Dua Kali",
    m_ms:["Fahami proses", "Petakan aliran data", "Ukur masa & kesilapan", "Pindah automatik, satu sumber", "Pemilik, IT, kualiti luluskan", "Rintis & dokumenkan"],
    a_ms:"Mula-mula saya akan **memahami prosesnya**: siapa yang menaip data, berapa kerap, dan mengapa ia dibuat dua kali. Saya akan **memetakan aliran data** antara dua sistem itu dan mengukur **masa yang digunakan serta kesilapan**. Kemudian saya mencadangkan pilihan, seperti **eksport dan import berjadual**, atau alat kecil yang **membaca data sekali daripada sumber**, supaya satu sistem kekal sebagai **satu sumber data yang sahih**. Saya **tidak akan mengubah mana-mana sistem sendiri**; saya akan berbincang dengan **pemilik sistem, IT dan kualiti**, mengujinya sebagai **projek rintis**, dan mendokumenkan hasilnya.",
    t_ms:"Sampaikan sebagai hasrat untuk membantu, bukan kritikan. Sistem kadangkala diasingkan atas sebab yang baik, seperti validasi atau had lesen.",
    a:"First I would **understand the process**: who keys in the data, how often, and why it is done twice. I would **map the data flow** between the two systems and measure the **time spent and the errors**. Then I would propose options, such as a **scheduled export and import**, or a small tool that **reads the data once from the source**, so that one system stays the **single source of truth**. I would **not change any system on my own**; I would discuss it with the **system owner, IT and quality**, test it as a **pilot**, and document the result.",
    e:"⌨️",
    kw:"Double Data Entry",
    m:[["🔎", "Understand the process"], ["🗺️", "Map the data flow"], ["⏱️", "Measure time & errors"], ["🔄", "Transfer automatically, one source"], ["🤝", "Owner, IT, quality approve"], ["🧪", "Pilot & document"]],
    j:["Understand the process", "Map the data flow", "Measure time & errors", "Transfer automatically, one source", "Owner, IT, quality approve", "Pilot & document"],
    t:"Say it as a wish to help, not as criticism. Systems are sometimes kept separate for good reasons, such as validation or licence limits." },

  { k:"Digital & Smart Factory", s:"How would you work with an older system or database that you have never used before?",
    s_ms:"Bagaimanakah anda bekerja dengan sistem atau pangkalan data lama yang anda tidak pernah guna?",
    kw_ms:"Sistem Yang Asing",
    m_ms:["Baca dokumentasi", "Tanya pemilik sistem", "Baca sahaja dahulu", "Fahami jadual & hubungan", "Uji, bukan production", "Dokumenkan & tanya"],
    a_ms:"Mula-mula saya akan **membaca dokumentasi yang ada** dan bertanya kepada **pemilik sistem** tentang cara ia digunakan. Saya bermula dengan **capaian baca sahaja**, untuk memahami **jadual dan hubungan datanya**, tanpa mengubah apa-apa. Saya mencuba sesuatu dalam **persekitaran ujian**, bukan dalam production. Saya **mencatat apa yang saya pelajari**, kerana sistem lama selalunya kurang dokumentasi, dan saya **bertanya sebelum membuat sebarang perubahan**.",
    t_ms:"Anda tidak dijangka tahu setiap sistem; tunjukkan kaedah yang berhati-hati.",
    a:"I would first **read the available documentation** and ask the **system owner** how it is used. I would start with **read-only access**, to understand the **tables and how the data links**, without changing anything. I would try things in a **test environment**, not in production. I would **write down what I learn**, because older systems often have little documentation, and I would **ask before making any change**.",
    e:"🗄️",
    kw:"Unfamiliar System",
    m:[["📖", "Read the documentation"], ["🙋", "Ask the system owner"], ["👀", "Read-only first"], ["🧬", "Understand tables & links"], ["🧪", "Test, not production"], ["📝", "Document & ask"]],
    j:["Read the documentation", "Ask the system owner", "Read-only first", "Understand tables & links", "Test, not production", "Document & ask"],
    t:"You are not expected to know every system; show a careful method." },

  { k:"Digital & Smart Factory", s:"Why do data integrity and cybersecurity matter when a regulated factory goes digital?",
    s_ms:"Mengapakah integriti data dan keselamatan siber penting apabila kilang yang dikawal selia beralih kepada digital?",
    kw_ms:"Integriti Data & Keselamatan",
    m_ms:["Rekod bukti keselamatan produk", "ALCOA", "Login sendiri, capaian ikut peranan", "Jejak audit", "Sandaran & pemulihan", "Rangkaian, kata laluan, phishing"],
    a_ms:"Dalam kilang yang dikawal selia, rekod ialah **bukti bahawa produk selamat**, jadi ia mesti boleh dipercayai. Panduan yang biasa digunakan ialah **ALCOA**: data mesti **boleh dikaitkan dengan pembuatnya, mudah dibaca, direkod pada masa kejadian, asli dan tepat**. Dari segi amalan, setiap orang menggunakan **login sendiri**, capaian **dikawal mengikut peranan**, dan sistem menyimpan **jejak audit** tentang siapa mengubah apa dan bila. Data mesti **dibuat sandaran** dan boleh dipulihkan. **Keselamatan siber** penting kerana kilang yang bersambung boleh terhenti akibat serangan, jadi rangkaian, kata laluan dan **kewaspadaan terhadap phishing** semuanya penting.",
    t_ms:"ALCOA berbaloi dihafal untuk mana-mana temu duga peranti perubatan atau farmaseutikal.",
    a:"In a regulated factory, the records are the **proof that the product is safe**, so they must be trustworthy. A common guide is **ALCOA**: data should be **attributable, legible, contemporaneous, original and accurate**. In practice, everyone uses their **own login**, access is **controlled by role**, and the system keeps an **audit trail** of who changed what and when. Data must be **backed up** and recoverable. **Cybersecurity** matters because a connected factory can be stopped by an attack, so the network, passwords and **phishing awareness** all matter.",
    e:"🔐",
    kw:"Data Integrity & Security",
    m:[["❤️", "Records prove product safety"], ["🧾", "ALCOA"], ["👤", "Own login, access by role"], ["🕵️", "Audit trail"], ["💾", "Backup & recovery"], ["🛡️", "Network, passwords, phishing"]],
    j:["Records prove product safety", "ALCOA", "Own login, access by role", "Audit trail", "Backup & recovery", "Network, passwords, phishing"],
    t:"ALCOA is worth memorising for any medical device or pharmaceutical interview." },

  /* ---------- C. Behavioural ---------- */
  { k:"Behavioural", s:"Tell me about a time you worked in a team. What was your role?",

    kw:"Teamwork (STAR)",
    m:[["📍", "Hackathon team project"], ["🙋", "I coordinated the team"], ["💬", "Split tasks, limited time"], ["🧗", "Real challenge & action"], ["🏁", "Top 6 + lesson"]],

  { k:"Behavioural", s:"Tell me about a time a team member was not contributing. What did you do?",

    a_ms:"Saya akan **berpegang pada fakta** dan tidak menyerang peribadi. Mula-mula saya **bercakap dengannya secara tertutup** untuk memahami sebabnya. Kemudian saya menawarkan bantuan atau bersetuju tentang **tugas yang lebih kecil dan jelas dengan tarikh akhir**. Jika tiada perubahan, saya **merujuk kepada ketua pasukan atau pensyarah**. Dalam pengalaman saya sendiri, **[contoh sebenar]**, dan projek itu **tetap disiapkan**.",

    kw:"Member Not Contributing",
    m:[["📋", "Stay factual"], ["🚪", "Talk privately"], ["🎯", "Clear small task"], ["⬆️", "Escalate if no change"], ["🏁", "Still delivered"]],
    j:["Stay factual; do not attack the person.",
       "You spoke to them privately first to understand the reason.",
       "You offered help or agreed on a smaller, clear task with a deadline.",

  { k:"Behavioural", s:"Describe a time you failed or made a mistake. What did you learn?",

  { k:"Behavioural", s:"How do you manage several deadlines at the same time?",
    s_ms:"Bagaimanakah anda menguruskan beberapa tarikh akhir pada masa yang sama?",
    kw_ms:"Tarikh Akhir",

    a_ms:"Saya **menyenaraikan semua tugas** dan tarikh akhirnya, kemudian **menetapkan keutamaan** mengikut kesegeraan dan kepentingan. Saya **memecahkan tugas besar kepada langkah kecil** dan menetapkan tarikh akhir sendiri yang lebih awal, menggunakan **planner atau kalendar** supaya saya bermula awal. Jika saya tidak dapat menepati tarikh akhir, saya **memaklumkan lebih awal** dan bukannya menghantar lewat tanpa notis.",

    kw:"Deadlines",
    m:[["📋", "List everything"], ["🚦", "Prioritise"], ["✂️", "Break into steps"], ["🗓️", "Planner, start early"], ["📣", "Warn early"]],
    j:["List all the tasks and deadlines.",
       "Prioritise by urgency and importance.",
       "Break big tasks into small steps and set your own earlier deadlines.",
       "Use a planner or calendar, and avoid last-minute work.",
       "If you cannot make it, tell the person early instead of delivering late without notice."],
    t:"Give an example from a busy semester." },

  /* ---------- D. Internship & workplace ---------- */
  { k:"Internship & Workplace", s:"Your supervisor gives you a task you have never done before. What do you do?",
    s_ms:"Penyelia memberi tugas yang anda tidak pernah buat. Apakah yang anda lakukan?",
    kw_ms:"Tugas Baharu",
    m_ms:["Jelaskan matlamat & tarikh akhir", "Cuba sendiri dahulu", "Tanya soalan khusus", "Kemas kini berkala", "Catat apa yang dipelajari"],
    a_ms:"Mula-mula saya memastikan saya **faham matlamat**, hasil yang dijangka dan tarikh akhir. Kemudian saya **cuba mencari jawapan sendiri** daripada dokumen, kerja terdahulu dan sumber dalam talian. Selepas mencuba, saya **bertanya soalan yang khusus**. Saya memberi **kemas kini secara berkala** supaya tiada kejutan, dan **mencatat apa yang saya pelajari** untuk masa hadapan.",
    t_ms:"Tunjukkan keseimbangan: berdikari, tetapi tidak takut bertanya.",
    a:"First I would make sure I **understand the goal**, the expected output and the deadline. Then I would **try to find the answer myself** from documents, past work and online resources. After trying, I would **ask specific questions**. I would give **regular updates** so there are no surprises, and **write down what I learned** for next time.",
    e:"❓",
    kw:"New Task",
    m:[["🎯", "Clarify goal & deadline"], ["🔎", "Try myself first"], ["❓", "Ask specific questions"], ["📣", "Regular updates"], ["📝", "Note what I learned"]],
    j:["Make sure you understand the goal, the expected output and the deadline.",
       "Try to find the answer yourself first: documents, past work, online resources.",
       "Ask specific questions after you have tried, not before.",
       "Give regular updates so there are no surprises.",
       "Write down what you learned for next time."],
    t:"Show a balance: independent, but not afraid to ask." },

  { k:"Internship & Workplace", s:"A factory has strict rules on safety, cleanroom practice and confidentiality. How do you feel about that?",
    s_ms:"Kilang mempunyai peraturan ketat tentang keselamatan, amalan cleanroom dan kerahsiaan. Apakah pandangan anda?",

    kw:"Rules & Safety",
    m:[["🛡️", "Protect people & product"], ["🥽", "Follow PPE & cleanroom"], ["📵", "No photos / copying"], ["❓", "Unsure: ask first"], ["🚨", "Report unsafe"]],
    j:["You understand the rules protect people, the product and the customer.",
       "You will follow all training, PPE and cleanroom procedures.",
       "You will not take photos, copy files or share company information outside.",
       "If you are unsure whether something is allowed, you ask first.",
       "If you see something unsafe, you report it."],
    t:"Very relevant for semiconductor and medical device companies." },

  { c:"Intel", k:"Company-Specific", s:"How could a computer engineering intern contribute at Intel?",

  { c:"Intel", k:"Company-Specific", s:"Explain in simple terms what a CPU does and what affects its performance.",
    s_ms:"Terangkan secara ringkas apa yang dilakukan oleh CPU dan apa yang mempengaruhi prestasinya.",
    kw_ms:"CPU",
    m_ms:["Fetch, decode, execute", "CU, ALU, register, cache", "Clock, teras, cache", "Transistor lebih kecil", "Had haba: berbilang teras"],
    a_ms:"**CPU mengambil (fetch), menyahkod (decode) dan melaksanakan (execute)** arahan. Bahagian utamanya ialah **unit kawalan, ALU, register dan cache**. Prestasi bergantung pada **kelajuan clock, bilangan teras dan saiz cache**, serta seni binanya. **Proses pembuatan** juga penting, kerana transistor yang lebih kecil membolehkan lebih banyak transistor dengan kuasa yang lebih rendah. **Had haba dan kuasa** ialah sebab reka bentuk berbilang teras menjadi kebiasaan.",
    t_ms:"Asas seni bina komputer memang wajar ditanya di syarikat pemproses.",
    a:"A **CPU fetches, decodes and executes** instructions. Its main parts are the **control unit, the ALU, registers and cache**. Performance depends on **clock speed, the number of cores and cache size**, as well as the architecture. The **manufacturing process** matters too, because smaller transistors allow more of them at lower power. **Heat and power limits** are why multi-core designs became common.",
    e:"⚙️",
    kw:"CPU",
    m:[["🔄", "Fetch, decode, execute"], ["🧩", "CU, ALU, registers, cache"], ["⏱️", "Clock, cores, cache"], ["🔬", "Smaller transistors"], ["🌡️", "Heat limit: multi-core"]],
    j:["A CPU fetches instructions, decodes them and executes them.",
       "Main parts: control unit, arithmetic logic unit, registers, cache.",
       "Performance factors: clock speed, number of cores, cache size, architecture design.",
       "Also the manufacturing process: smaller transistors allow more of them and lower power.",
       "Heat and power limits are why multi-core designs became common."],
    t:"Basic computer architecture is fair game at a processor company." },

  { c:"Infineon", k:"Company-Specific", s:"How could a computer engineering intern contribute at Infineon?",

  { c:"Infineon", k:"Company-Specific", s:"What is a power semiconductor and where is it used?",
    s_ms:"Apakah itu semikonduktor kuasa dan di manakah ia digunakan?",
    kw_ms:"Peranti Kuasa",
    m_ms:["Suis voltan & arus tinggi", "MOSFET, IGBT, diod", "Pengecas, pemacu, EV", "SiC & GaN", "Kurang kehilangan, lebih sejuk"],
    a_ms:"**Semikonduktor kuasa** ialah peranti yang **mensuis atau mengawal voltan dan arus yang tinggi** dengan cekap. Contohnya **power MOSFET, IGBT dan diod**. Ia digunakan dalam **pengecas, pemacu motor, inverter solar dan kenderaan elektrik**. Bahan baharu seperti **silikon karbida (SiC) dan galium nitrida (GaN)** kehilangan kurang tenaga berbanding silikon, lalu menghasilkan produk yang **lebih kecil, lebih sejuk dan lebih cekap**.",
    t_ms:"Asas sahaja sudah cukup, tetapi mengetahui SiC dan GaN menunjukkan anda membuat persediaan.",
    a:"A **power semiconductor** is a device that **switches or controls high voltage and current** efficiently. Examples are the **power MOSFET, IGBT and diode**. They are used in **chargers, motor drives, solar inverters and electric vehicles**. Newer materials such as **silicon carbide (SiC) and gallium nitride (GaN)** lose less energy than silicon, giving **smaller, cooler and more efficient** products.",
    e:"⚡",
    kw:"Power Devices",
    m:[["🔀", "Switches high V & I"], ["🧱", "MOSFET, IGBT, diode"], ["🔌", "Chargers, drives, EVs"], ["💎", "SiC & GaN"], ["❄️", "Less loss, cooler"]],
    j:["A device that switches or controls high voltage and current efficiently.",
       "Examples: power MOSFET, IGBT, diode.",
       "Used in chargers, power supplies, motor drives, solar inverters and electric vehicles.",
       "Newer materials such as silicon carbide (SiC) and gallium nitride (GaN) lose less energy than silicon.",
       "Less energy loss means smaller, cooler and more efficient products."],
    t:"You only need the basics, but knowing SiC and GaN shows you did your homework." },

  { c:"AT&S", k:"Company-Specific", s:"What do you know about AT&S, and why do you want to intern here?",

    j:["Austrian company (Austria Technologie & Systemtechnik), headquartered in Leoben, Austria.",

  { c:"AT&S", k:"Company-Specific", s:"How could a computer engineering intern contribute at AT&S?",

  { c:"AT&S", k:"Company-Specific", s:"What is a PCB, and what do you know about how it is made?",
    s_ms:"Apakah itu PCB, dan apakah yang anda tahu tentang cara ia dibuat?",
    kw_ms:"PCB",
    m_ms:["Pegang & sambung komponen", "Lapisan kuprum + penebat", "Imej, etch, laminasi, gerudi, sadur", "Garisan halus: kecil, laju", "AOI & ujian elektrik"],
    a_ms:"**PCB**, atau papan litar bercetak, **memegang komponen dan menyambungkannya** dengan laluan kuprum. Ia diperbuat daripada **lapisan kuprum dan bahan penebat**. Langkah utamanya ialah **mengimej corak, etching, laminasi, menggerudi dan menyadur** lubang, kemudian kemasan permukaan. **Garisan yang lebih halus** dan via yang lebih kecil membolehkan produk yang lebih kecil dan laju. Kualiti disemak melalui **pemeriksaan optik dan ujian elektrik**.",
    t_ms:"Jika anda pernah menggunakan perisian reka bentuk PCB (KiCad, Altium, EasyEDA), nyatakan.",
    a:"A **PCB**, or printed circuit board, **holds components and connects them** with copper tracks. It is made of **layers of copper and insulating material**. The main steps are **imaging the pattern, etching, laminating, drilling and plating** the holes, then the surface finish. **Finer lines** and smaller vias allow smaller, faster products. Quality is checked by **optical inspection and electrical test**.",
    e:"🥪",
    kw:"PCB",
    m:[["🟩", "Holds & connects parts"], ["🥪", "Copper + insulation layers"], ["🛠️", "Image, etch, laminate, drill, plate"], ["🔬", "Finer lines: smaller, faster"], ["✅", "AOI & electrical test"]],
    j:["A printed circuit board holds components and connects them with copper tracks.",
       "Made of layers of copper and insulating material; complex boards have many layers.",
       "Main steps: imaging the circuit pattern, etching copper, laminating layers, drilling and plating holes (vias), surface finish, testing.",
       "Finer lines and smaller vias allow smaller and faster products.",
       "Quality is checked by optical inspection and electrical test."],
    t:"If you have used PCB design software (KiCad, Altium, EasyEDA), say so." },

  { c:"SCHOTT", k:"Company-Specific", s:"What do you know about SCHOTT, and why do you want to intern here?",
    s_ms:"Apakah yang anda tahu tentang SCHOTT, dan mengapa anda mahu menjalani latihan industri di sini?",

    a:"**SCHOTT** is a **German** technology group headquartered in **Mainz**, owned by the Carl Zeiss Foundation. It makes **specialty glass** and glass-ceramics for electronics, optics and pharmaceutical packaging. **SCHOTT Kulim** is a **new facility completed in 2024** that makes **optical components**, for example for **augmented reality** devices. I want to intern here to experience **precision manufacturing** in a cleanroom.",

    j:["German technology group, headquartered in Mainz, owned by the Carl Zeiss Foundation.",

  { c:"SCHOTT", k:"Company-Specific", s:"Your degree is computer engineering. How is it relevant to a glass manufacturer?",

    a:"My degree is relevant because modern glass production is **highly automated** and controlled by software and sensors. **Process data** can be collected and analysed to improve quality and yield, and **machine vision** is used to inspect for defects. Production **systems, databases and dashboards** need people who can code. I bring **programming and electronics skills**, and I am keen to learn the process side.",

    j:["Modern glass production is highly automated and controlled by software and sensors.",
       "Process data can be collected and analysed to improve quality and yield.",
       "Machine vision is used to inspect glass for defects.",
       "Production systems, databases and dashboards need people who can code.",
       "You bring programming, electronics and problem-solving skills, and you are keen to learn the process side."],

  { c:"SCHOTT", k:"Company-Specific", s:"How would you approach building a system to detect defects on a product automatically?",
    s_ms:"Bagaimanakah anda akan membina sistem untuk mengesan kecacatan produk secara automatik?",
    kw_ms:"Pengesanan Kecacatan",
    m_ms:["Takrif kecacatan", "Kamera + pencahayaan", "Pemprosesan imej / model", "Lulus, gagal, semak, log", "Sahkan dengan manusia", "Terus tambah baik"],
    a_ms:"Mula-mula saya **mentakrifkan jenis kecacatan** dan apa yang dikira lulus atau gagal. Kemudian saya menyediakan **kamera dan pencahayaan** yang sesuai supaya kecacatan kelihatan. Imej dianalisis melalui **pemprosesan imej atau model terlatih**. Sistem akan **memutuskan lulus, gagal atau semakan manual** dan merekod setiap keputusan. Saya akan **mengesahkannya dengan pemeriksaan manusia**, dan **terus menambah baik** menggunakan keputusan yang salah.",
    t_ms:"Anda tidak dijangka tahu semuanya; tunjukkan cara berfikir langkah demi langkah yang jelas.",
    a:"First I would **define the defect types** and what counts as pass or fail. Then I would set up a suitable **camera and lighting** so that the defects are visible. The images would be analysed by **image processing or a trained model**. The system would **decide pass, fail or manual review** and log every result. I would **validate it against human inspection**, and **keep improving** it using the wrong calls.",
    e:"📷",
    kw:"Defect Detection",
    m:[["📋", "Define defects"], ["📷", "Camera + lighting"], ["🧠", "Image processing / model"], ["🚦", "Pass, fail, review, log"], ["✅", "Validate vs human"], ["🔁", "Keep improving"]],
    j:["Understand the defect types and what counts as pass or fail.",
       "Capture: suitable camera and lighting to make defects visible.",
       "Process: image processing or a trained model to detect and classify defects.",
       "Decide: pass, fail or send for manual review; log every result.",
       "Validate against human inspection before trusting it.",
       "Keep improving using the wrong calls as new training data."],
    t:"You are not expected to know everything; show a clear step-by-step way of thinking." },

  { c:"Celestica", k:"Company-Specific", s:"What do you know about Celestica, and why do you want to intern here?",
    s_ms:"Apakah yang anda tahu tentang Celestica, dan mengapa anda mahu menjalani latihan industri di sini?",
