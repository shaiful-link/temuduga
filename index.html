<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Interview / Latihan Temuduga</title>
<style>
  :root{
    --bg:#f4f1ea; --card:#ffffff; --ink:#1d2a2e; --muted:#5d6b70;
    --main:#0f5c63; --main-dark:#0a4348; --soft:#e3efef;
    --ok:#2e7d4f; --ok-soft:#e4f3ea; --bad:#b3372b; --bad-soft:#fbe9e7; --line:#d9d4c8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  header{background:var(--main);color:#fff;padding:18px 16px}
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
  header h1{margin:0;font-size:1.15rem;letter-spacing:.2px}
  header small{opacity:.85;display:block;font-weight:400;font-size:.8rem}
  .wrap{max-width:760px;margin:0 auto}
  main{padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  h2{font-size:1.05rem;margin:0 0 10px}
  .label{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 8px}
  .jobs{display:grid;gap:10px}
  .job{border:2px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit;width:100%;display:flex;gap:14px;align-items:center}
  .job:hover{border-color:var(--main);background:var(--soft)}
  .job .ico{flex:0 0 46px;height:46px;border-radius:12px;background:var(--main);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
  .job b{display:block}
  .job span.d{font-size:.85rem;color:var(--muted);display:block}
  .job .go{margin-left:auto;color:var(--main);font-size:1.3rem}
  .picked{font-weight:600;font-size:1.05rem}
  .picked small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:.85rem;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--main);border-color:var(--main);color:#fff}
  button.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--main);color:#fff}
  button.btn:hover{background:var(--main-dark)}
  button.btn.ghost{background:#fff;color:var(--main);border:1px solid var(--main)}
  button.btn.small{padding:7px 12px;font-size:.85rem;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4)}
  .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);margin-bottom:10px}
  .badge{background:var(--soft);color:var(--main-dark);border-radius:999px;padding:4px 11px;font-weight:600;font-size:.8rem}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
  .bar i{display:block;height:100%;background:var(--main);width:0;transition:width .3s}
  .question{font-size:1.25rem;font-weight:600;margin:6px 0 14px}

  /* A / B answer options */
  .opts{display:grid;gap:10px}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
  .opt:hover:not(:disabled){border-color:var(--main);background:var(--soft)}
  .opt .let{flex:0 0 34px;height:34px;border-radius:50%;background:var(--main);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
  .opt:disabled{cursor:default}
  .opt.right{border-color:var(--ok);background:var(--ok-soft)}
  .opt.right .let{background:var(--ok)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrong .let{background:var(--bad)}
  .opt.dim{opacity:.55}

  .ansp{margin:0 0 4px;font-size:1.02rem;line-height:1.7}
  .ansp b{color:var(--main-dark);background:#fff3bf;border-radius:4px;padding:0 3px}
  .verdict{font-weight:700;font-size:1.1rem;margin:16px 0 0}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
  .answer{border-left:5px solid var(--main);background:var(--soft);border-radius:0 12px 12px 0;padding:14px 16px;margin-top:10px}
  .answer .short{font-weight:600;margin:0 0 8px}
  .answer ul{margin:6px 0 0;padding-left:20px}
  .answer li{margin-bottom:6px}
  .tip{margin-top:12px;background:#fff7e6;border:1px solid #f0dcae;border-radius:10px;padding:10px 12px;font-size:.9rem}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
  .stats div{background:var(--soft);border-radius:12px;padding:12px 6px}
  .stats b{display:block;font-size:1.5rem;color:var(--main-dark)}
  .stats span{font-size:.8rem;color:var(--muted)}
  ol.review{padding-left:20px;margin:8px 0 0}
  ol.review li{margin-bottom:6px}
  /* Tabs + notes */
  .tabs{display:flex;gap:6px;background:#e6e1d6;border-radius:12px;padding:5px;margin-bottom:14px}
  .tab{flex:1;border:0;background:transparent;border-radius:9px;padding:10px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
  .tab.on{background:#fff;color:var(--main-dark);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .notehead{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--main-dark);margin:18px 4px 8px}
  .note{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .note .em{flex:0 0 44px;height:44px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:1.5rem}
  .note .nq{font-size:.82rem;color:var(--muted);margin:0 0 3px}
  .note .na{font-weight:600;margin:0}
  .note details{margin-top:6px;font-size:.9rem}
  .note summary{cursor:pointer;color:var(--main);font-size:.82rem}
  .note ul{margin:6px 0 0;padding-left:18px}
  /* Mind map: keyword in the middle, coloured branches with icons */
  .mm{position:relative;display:grid;grid-template-columns:minmax(104px,30%) minmax(0,1fr);column-gap:26px;align-items:center;margin:10px 0 6px}
  .mm svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .mmc{position:relative;z-index:1;background:var(--cc,#0f5c63);color:#fff;border-radius:18px;padding:12px 5px;text-align:center;font-weight:700;font-size:.85rem;line-height:1.25;box-shadow:0 2px 6px rgba(0,0,0,.2);overflow-wrap:break-word}
  .mmc .e{display:block;font-size:1.8rem;line-height:1.2;margin-bottom:3px}
  .mmb{display:grid;gap:7px;position:relative;z-index:1;min-width:0}
  .mmn span:last-child{min-width:0;overflow-wrap:anywhere}
  .mmn{display:flex;gap:8px;align-items:center;background:var(--b);border:1.5px solid var(--c);border-radius:12px;padding:6px 10px;font-size:.88rem;font-weight:600;line-height:1.25}
  .mmn .e{font-size:1.2rem;flex:0 0 auto}
  .mcard{background:#fff;border:1px solid var(--line);border-left:6px solid var(--cc,#0f5c63);border-radius:12px;padding:12px;margin-bottom:10px}
  .mcard .nq{font-size:.84rem;color:var(--muted);margin:0}
  .mcard details{margin-top:6px;font-size:.9rem}
  .mcard summary{cursor:pointer;color:var(--main);font-size:.82rem}
  .mcard ul{margin:6px 0 0;padding-left:18px}
  .mcard .okline{font-weight:600;margin:6px 0 0}
  .find{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:#fff;margin-bottom:4px}
  .find:focus{outline:2px solid var(--main);border-color:transparent}
  .nohit{color:var(--muted);font-size:.9rem;padding:10px 4px}
  .kwline{margin:-6px 0 14px;font-size:.88rem;color:var(--muted)}
  .kwline b{display:inline-block;background:var(--cc,#0f5c63);color:#fff;border-radius:999px;padding:2px 10px;margin-left:4px;font-size:.82rem}
  .notehead{display:flex;align-items:center;gap:7px}
  .notehead i{width:12px;height:12px;border-radius:50%;background:var(--cc);display:inline-block}
  textarea.qnote{width:100%;min-height:74px;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;font-size:.92rem;resize:vertical;background:#fcfbf8;margin-top:6px}
  textarea.qnote:focus{outline:2px solid var(--main);border-color:transparent}
  .note .body{flex:1;min-width:0}
  .qsaved{font-size:.78rem;color:var(--ok);font-weight:600;min-height:1.1em;margin:2px 0 0}
  .mynote{background:#eaf1fb;border:1px solid #c5d6ee;border-radius:10px;padding:9px 11px;margin-top:8px;font-size:.9rem;white-space:pre-wrap}
  .mynote b{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.6px;color:#2f5387;margin-bottom:2px}
  textarea.mine{width:100%;min-height:160px;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;resize:vertical;background:#fcfbf8}
  textarea.mine:focus{outline:2px solid var(--main);border-color:transparent}
  .saved{font-size:.83rem;color:var(--ok);font-weight:600;margin-top:6px;min-height:1.2em}
  .hint{font-size:.83rem;color:var(--muted);margin-top:6px}
  .hidden{display:none}
  footer{text-align:center;font-size:.78rem;color:var(--muted);padding:6px 16px 26px}
  @media (max-width:480px){.question{font-size:1.1rem}.row .btn{flex:1 1 100%}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1><span id="hTitle">Mock Interview</span><small id="hSub"></small></h1>
    <button class="btn small hidden" id="btnHome">Menu</button>
  </div>
</header>

<main class="wrap">

  <!-- ========== SCREEN 0: MAIN MENU (select job) ========== -->
  <section id="scrMenu">
    <div class="card">
      <p class="label">Menu &mdash; Pilih jawatan / Select a role</p>
      <div class="jobs" id="jobList"></div>
    </div>
  </section>

  <!-- ========== SCREEN 1: SETUP (company + category) ========== -->
  <section id="scrSetup" class="hidden">
    <div class="card">
      <p class="label" id="lblPicked"></p>
      <div class="picked" id="pickedJob"></div>
    </div>
    <div class="card hidden" id="langCard">
      <p class="label">Bahasa / Language</p>
      <div class="chips" id="langList"></div>
    </div>
    <div class="tabs">
      <button class="tab on" id="tabQuiz"></button>
      <button class="tab" id="tabNotes"></button>
      <button class="tab" id="tabMine"></button>
    </div>
    <div class="card" id="companyCard">
      <p class="label" id="lblCompany"></p>
      <div class="chips" id="companyList"></div>
    </div>
    <div class="card" id="catCard">
      <p class="label" id="lblCat"></p>
      <div class="chips" id="catList"></div>
      <p class="hint" id="countInfo"></p>
      <div class="row">
        <button class="btn" id="btnStart"></button>
        <button class="btn ghost" id="btnBack"></button>
      </div>
    </div>
    <!-- Notes tab: correct answers only -->
    <div id="notesBox" class="hidden"></div>
    <!-- My Notes tab: user's own notes, saved on this phone/browser -->
    <div id="mineList" class="hidden"></div>
    <div class="card hidden" id="mineBox">
      <p class="label" id="lblMine"></p>
      <textarea class="mine" id="mineText"></textarea>
      <p class="saved" id="mineSaved"></p>
      <p class="hint" id="mineHint"></p>
      <div class="row">
        <button class="btn" id="btnMineCopy"></button>
        <button class="btn ghost" id="btnMineFile"></button>
      </div>
    </div>
  </section>

  <!-- ========== SCREEN 2: QUESTION, then answer + mind map ========== -->
  <section id="scrQuiz" class="hidden">
    <div class="card">
      <div class="meta">
        <span class="badge" id="qCat"></span>
        <span style="white-space:nowrap"><button class="chip hidden" id="btnLang" style="padding:3px 10px;margin-right:8px"></button><span id="qNum"></span></span>
      </div>
      <div class="bar"><i id="qBar"></i></div>
      <p class="label" id="lblPanel"></p>
      <div class="question" id="qText"></div>
      <p class="kwline" id="qKw"></p>

      <div class="row" id="rowShow">
        <button class="btn" id="btnShow"></button>
      </div>

      <div id="ansBox" class="hidden">
        <div class="answer">
          <p class="label" id="lblAns"></p>
          <p class="ansp" id="ansText"></p>
          <div id="ansMM"></div>
          <div class="tip" id="ansTip"></div>
          <div class="mynote hidden" id="ansMine"></div>
        </div>
      </div>

      <div class="row">
        <button class="btn ghost" id="btnPrev"></button>
        <button class="btn" id="btnNext"></button>
      </div>
    </div>
  </section>

  <!-- ========== SCREEN 3: END ========== -->
  <section id="scrEnd" class="hidden">
    <div class="card">
      <h2 id="endTitle"></h2>
      <p class="hint" id="endInfo"></p>
      <div class="row">
        <button class="btn" id="btnRetry"></button>
        <button class="btn ghost" id="btnRestart"></button>
      </div>
    </div>
  </section>

</main>

<footer id="footText"></footer>

<script>

var TEXT = {

  { k:"Pengenalan Diri", s:"Apakah perbezaan peranan antara Gred U7 dan Gred U8 pada pandangan anda?",

  { k:"Pengenalan Diri", s:"Ceritakan pengalaman anda dalam pengurusan dan pentadbiran.",
    a:"Pengalaman pengurusan saya terbina di beberapa peringkat. Semasa di **klinik kesihatan dan PKD**, saya terlibat dalam **[contoh: pengurusan makmal klinik, stok reagen, laporan bulanan]**. Di **hospital**, saya terlibat dalam **[contoh: jadual tugas, penyeliaan staf, audit]**. Di **MKAK** sekarang, walaupun bukan untuk keseluruhan organisasi, saya terlibat dalam **pengurusan makmal tibi**, termasuk **[contoh: agihan tugas, pemantauan kualiti, latihan staf]**, serta **pengurusan aset** seperti pendaftaran, pemeriksaan dan pelupusan. Pengalaman ini memberi saya asas yang kukuh untuk tugas pengurusan dan pentadbiran di Gred U8.",
    e:"🗂️",
    kw:"Pengalaman Pengurusan",
    m:[["🏠", "KK & PKD: makmal kesihatan primer"], ["🏥", "Hospital: penyeliaan"], ["🧫", "MKAK: urus makmal tibi"], ["🏷️", "Pengurusan aset"], ["📈", "Asas kukuh untuk U8"]],

    t:"U8 hampir sepenuhnya tugas pengurusan. Untuk setiap tempat kerja, sediakan satu contoh pengurusan yang sebenar, dengan angka jika ada." },

  { k:"Pengenalan Diri", s:"Apakah kelebihan dan tekad anda jika diberi peluang naik ke Gred U8?",
    a:"Kelebihan saya ialah **pengalaman yang luas**: saya pernah berkhidmat di klinik kesihatan, PKD, hospital, IMR dan MKAK, jadi saya memahami keperluan setiap peringkat perkhidmatan makmal. Saya juga mempunyai **ijazah**, pengalaman **pengurusan aset dan makmal tibi**, serta rekod **inovasi KIK** di peringkat negeri dan kebangsaan. Tekad saya ialah **memperkukuh kualiti dan tadbir urus** makmal di bawah jagaan saya, **membangunkan pelapis** yang kompeten, **mengurus sumber dengan cekap**, dan terus **belajar perkara baharu** walau di mana saya ditempatkan.",

  { k:"Pengenalan Diri", s:"Tugas U8 di hospital atau JKN berbeza daripada tugas anda sekarang. Bagaimanakah anda akan menyesuaikan diri?",
    a:"Saya sedar tugas U8 hampir sepenuhnya **pengurusan dan pentadbiran**, dan skopnya berbeza antara hospital, tabung darah dan JKN. Saya **bersedia mempelajari perkara baharu**: dalam tiga bulan pertama saya akan **memahami senarai tugas, pekeliling dan SOP** yang berkaitan, serta **belajar daripada pegawai yang berpengalaman**. Saya sudah biasa menyesuaikan diri kerana pernah berpindah antara **klinik kesihatan, PKD, hospital, IMR dan MKAK**, yang setiap satunya mempunyai cara kerja tersendiri. Asas pengurusan seperti **merancang, menyelia, memantau dan melapor** tetap sama di mana-mana.",

  { k:"Pengenalan Diri", s:"Ceritakan tentang sijil, kursus dan penglibatan anda dalam program jabatan.",
    a:"Antara kursus dan sijil utama saya ialah **[senaraikan tiga atau empat yang paling relevan, dengan tahun]**. Saya terlibat dalam **[jawatankuasa atau program, contoh: audit dalaman, KIK, keselamatan, aset]** sebagai **[peranan]**. Bagi setiap penglibatan, saya memastikan **komitmen sehingga selesai**, contohnya projek KIK saya yang dibawa hingga ke **peringkat kebangsaan**. Saya juga memastikan **mata CPD** saya mencukupi setiap tahun melalui **MyCPD**.",

  { k:"Tugas Gred U8", s:"Apakah tugas JTMP Gred U8 di Jabatan Patologi hospital?",
    a:"Di Jabatan Patologi, JTMP U8 ialah **ketua kepada JTMP** dan pembantu utama Ketua Jabatan dalam hal pengurusan. Tugasnya meliputi **pengurusan sumber manusia**: agihan staf antara unit, jadual syif, penilaian prestasi dan latihan. Kedua, **pengurusan kewangan dan logistik**: bajet, perolehan reagen dan peralatan, aset serta stor. Ketiga, **pengurusan kualiti dan keselamatan**: MS ISO 15189, audit, EQA dan pelaporan insiden. Keempat, **pemantauan prestasi** seperti TAT, beban kerja dan aduan pelanggan. U8 juga menjadi **penasihat teknikal** dan mewakili jabatan dalam jawatankuasa hospital.",
    e:"🏥",
    kw:"U8 di Patologi",
    m:[["👥", "Staf: agihan, syif, prestasi, latihan"], ["💰", "Bajet, perolehan, aset, stor"], ["🏅", "Kualiti: ISO 15189, audit, EQA"], ["🦺", "Keselamatan & insiden"], ["📊", "Pantau TAT, beban kerja, aduan"], ["🗣️", "Penasihat teknikal & jawatankuasa"]],

    t:"Ini gambaran umum. Dapatkan senarai tugas (JD) sebenar U8 daripada rakan di hospital dan sesuaikan." },

  { k:"Tugas Gred U8", s:"Apakah tugas JTMP Gred U8 di tabung darah atau unit perubatan transfusi hospital?",
    a:"Di tabung darah, keutamaan U8 ialah memastikan **bekalan darah yang selamat dan mencukupi**. Tugasnya termasuk **mengurus stok darah dan komponen** supaya bekalan tidak putus dan tidak membazir, serta menyelaras **kempen derma darah**. U8 memantau **ujian saringan dan ujian keserasian**, **rantaian sejuk** penyimpanan, serta **kebolehkesanan** setiap unit darah daripada penderma hingga penerima. U8 juga mengurus **staf syif 24 jam**, kualiti dan audit, serta pelaporan kejadian transfusi bersama pakar.",

    j:["Bekalan selamat & cukup", "Stok darah, kurang pembaziran", "Kempen derma darah", "Saringan & ujian keserasian", "Rantaian sejuk & kebolehkesanan", "Staf 24 jam, kualiti, audit"],

  { k:"Tugas Gred U8", s:"Apakah tugas JTMP Gred U8 di Jabatan Kesihatan Negeri bagi program kesihatan primer dan kesihatan awam?",
    a:"Di JKN, U8 berperanan sebagai **penyelaras perkhidmatan makmal** bagi klinik kesihatan di seluruh negeri. Tugasnya ialah **memantau dan mengaudit makmal klinik kesihatan**, termasuk kualiti, EQA dan persediaan akreditasi **PHLAS**. U8 merancang **penempatan, latihan dan kompetensi JTMP** di daerah, serta menyelaras **perolehan reagen dan peralatan** dan pengurusan aset. U8 mengumpul **data dan laporan** makmal untuk JKN dan kementerian, menyokong **program kesihatan awam** seperti tibi, malaria, denggi dan saringan NCD, serta menjadi **penasihat teknikal** kepada pengurusan JKN.",

    kw:"U8 di JKN",
    m:[["🗺️", "Penyelaras makmal klinik senegeri"], ["🔍", "Pantau & audit: kualiti, EQA, PHLAS"], ["👥", "Penempatan & latihan JTMP"], ["🛒", "Perolehan & aset"], ["📊", "Data & laporan"], ["🦠", "Sokong program: tibi, denggi, NCD"]],

  { k:"Tugas Gred U8", s:"Apakah yang anda tahu tentang Pusat Darah Wilayah Utara, dan apakah peranan JTMP U8 di sana?",
    a:"**Pusat Darah Wilayah Utara** terletak di **Sungai Petani, Kedah**, dengan kos kira-kira **RM49.9 juta**. Pembinaannya bermula pada 2021 dan projek itu **diserahkan kepada KKM pada Julai 2026**. Ia mempunyai **ruang menderma darah, makmal pemprosesan dan penyimpanan darah, serta makmal saringan penderma**, dan dijangka memperkukuh bekalan darah bagi **Kedah, Perlis, Pulau Pinang dan utara Perak**. Sebelum ini, perkhidmatan seumpamanya berpusat di **Pusat Darah Negara, Kuala Lumpur**, dan darah di wilayah utara disimpan di hospital yang kapasitinya terhad. Jika ditempatkan di sana, peranan saya sebagai U8 ialah **mengurus stok dan pengagihan darah**, **kualiti dan saringan**, **staf dan jadual**, serta menyelaras **kempen derma darah** bersama hospital di wilayah ini.",
    e:"🩸",
    kw:"Pusat Darah Wilayah Utara",
    m:[["📍", "Sungai Petani, Kedah"], ["💰", "Kira-kira RM49.9 juta"], ["🤝", "Diserah kepada KKM, Julai 2026"], ["🗺️", "Kedah, Perlis, P. Pinang, Perak utara"], ["🔬", "Derma, proses, simpan, saringan"], ["🗂️", "U8: stok, kualiti, staf, kempen"]],
    j:["Sungai Petani, Kedah", "Kira-kira RM49.9 juta", "Diserah kepada KKM, Julai 2026", "Kedah, Perlis, P. Pinang, Perak utara", "Derma, proses, simpan, saringan", "U8: stok, kualiti, staf, kempen"],
    t:"Semak sama ada pusat ini sudah mula beroperasi, nama rasminya dan siapa pengarahnya sebelum temuduga." },

  /* ---------- B. Teknikal makmal ---------- */
  { k:"Teknikal Makmal", s:"Terangkan perbezaan antara Kawalan Kualiti Dalaman (IQC) dan Penilaian Kualiti Luaran (EQA).",
    a:"**IQC** dijalankan oleh **makmal sendiri** setiap hari atau setiap kelompok ujian menggunakan bahan kawalan, untuk memastikan keputusan tepat sebelum dikeluarkan kepada pesakit. **EQA** pula dianjurkan oleh **pihak luar**; makmal menguji sampel yang dihantar dan keputusan **dibandingkan dengan makmal lain**. IQC memantau prestasi harian, manakala EQA mengesan ralat jangka panjang. Kedua-duanya saling melengkapi dan merupakan keperluan **MS ISO 15189**.",
    e:"🎯",
    kw:"IQC vs EQA",
    m:[["🏠", "IQC: makmal sendiri"], ["📅", "Setiap hari / kelompok"], ["🌍", "EQA: penganjur luar"], ["⚖️", "Banding makmal lain"], ["📜", "Keperluan ISO 15189"]],
    j:["IQC: dijalankan oleh makmal sendiri setiap hari atau setiap kelompok ujian menggunakan bahan kawalan.",
       "Tujuan IQC: memantau ketepatan dan kejituan harian sebelum keputusan pesakit dikeluarkan.",
       "EQA: sampel dihantar oleh penganjur luar, makmal uji dan hantar keputusan untuk dibandingkan dengan makmal lain.",
       "Tujuan EQA: menilai prestasi makmal secara bebas dan mengesan ralat sistematik jangka panjang.",
       "Kedua-duanya saling melengkapi dan menjadi keperluan MS ISO 15189."],
    t:"Tambah contoh program EQA yang makmal anda sertai." },

  { k:"Teknikal Makmal", s:"Apakah tindakan anda jika keputusan IQC berada di luar had kawalan?",
    a:"Saya akan **menahan keputusan pesakit** bagi ujian tersebut, kemudian **mencari punca** dengan menyemak bahan kawalan, reagen, kalibrasi dan penyelenggaraan alat. Saya merujuk **peraturan Westgard** untuk menentukan sama ada ralat itu rawak atau sistematik. Selepas tindakan pembetulan, saya **mengulang IQC**; jika lulus, saya **menilai semula sampel pesakit** yang diuji sejak IQC terakhir yang lulus. Semua tindakan **direkodkan**.",
    e:"🛑",
    kw:"IQC Gagal",
    m:[["✋", "Tahan keputusan"], ["🔎", "Cari punca"], ["📐", "Peraturan Westgard"], ["🔁", "Betulkan, ulang IQC"], ["🧪", "Nilai semula sampel"], ["📝", "Rekod"]],
    j:["Hentikan pengeluaran keputusan pesakit bagi ujian tersebut.",
       "Semak punca mudah: bahan kawalan (luput, cara simpan, cara bancuh), reagen, kalibrasi, penyelenggaraan alat.",
       "Rujuk peraturan Westgard: 1-3s dan R-4s menunjukkan ralat rawak; 2-2s, 4-1s dan 10x menunjukkan ralat sistematik.",
       "Ulang IQC selepas tindakan pembetulan; jika masih gagal, kalibrasi semula atau hubungi jurutera.",
       "Nilai semula sampel pesakit yang diuji sejak IQC terakhir yang lulus.",
       "Rekod kejadian dan tindakan pembetulan dalam log IQC."],
    t:"Tekankan: jangan ulang IQC berkali-kali sehingga lulus tanpa mencari punca." },

  { k:"Teknikal Makmal", s:"Terangkan tiga fasa dalam proses ujian makmal. Fasa manakah paling banyak berlaku kesilapan?",
    a:"Proses ujian makmal ada tiga fasa. **Pra-analitikal** meliputi permintaan ujian, pengambilan, pelabelan dan penghantaran spesimen. **Analitikal** ialah proses menguji, termasuk IQC dan kalibrasi. **Pasca-analitikal** meliputi pengesahan dan pelaporan keputusan. Kesilapan paling banyak berlaku pada fasa **pra-analitikal** kerana melibatkan ramai pihak di luar makmal, dan ia dikawal melalui **kriteria penolakan** serta **latihan kepada wad**.",
    e:"3️⃣",
    kw:"3 Fasa Ujian",
    m:[["📥", "Pra-analitikal"], ["⚙️", "Analitikal"], ["📤", "Pasca-analitikal"], ["⚠️", "Paling banyak silap: PRA"], ["🛡️", "Kawal: kriteria & latihan"]],
    j:["Pra-analitikal: permintaan ujian, pengenalan pesakit, pengambilan, pelabelan, pengangkutan dan penerimaan spesimen.",
       "Analitikal: proses menguji termasuk IQC, kalibrasi dan prestasi alat.",
       "Pasca-analitikal: semakan dan pengesahan keputusan, pelaporan, makluman nilai kritikal, penyimpanan spesimen.",
       "Kebanyakan kesilapan berlaku pada fasa pra-analitikal kerana melibatkan ramai pihak di luar makmal.",
       "Kawalan: kriteria penolakan spesimen, latihan kepada wad, pemantauan petunjuk kualiti."],
    t:"Beri contoh kesilapan pra-analitikal di tempat anda dan cara anda mengurangkannya." },

  { k:"Teknikal Makmal", s:"Bagaimanakah anda menguruskan keputusan nilai kritikal (critical value)?",
    a:"Saya akan **mengesahkan keputusan** dahulu dengan menyemak IQC dan keadaan spesimen. Kemudian saya **memaklumkan segera** kepada doktor atau jururawat yang merawat dalam tempoh yang ditetapkan SOP, menggunakan kaedah **read-back** supaya maklumat diterima dengan betul. Saya **merekod** nama pesakit, keputusan, masa serta nama pemberi dan penerima maklumat, dan **memantau pematuhan** sebagai petunjuk kualiti.",
    e:"📞",
    kw:"Nilai Kritikal",
    m:[["✅", "Sahkan dahulu"], ["📞", "Maklum doktor segera"], ["🔁", "Read-back"], ["📝", "Rekod siapa & masa"], ["📊", "Pantau pematuhan"]],
    j:["Sahkan keputusan dahulu: semak IQC, keadaan spesimen (hemolisis, beku), ulang ujian jika perlu.",
       "Maklumkan segera kepada doktor atau jururawat yang merawat dalam tempoh yang ditetapkan dalam SOP.",
       "Guna kaedah baca semula (read-back) untuk memastikan maklumat diterima dengan betul.",
       "Rekod: nama pesakit, keputusan, masa, nama pemberi dan penerima maklumat.",
       "Pantau pematuhan makluman nilai kritikal sebagai petunjuk kualiti."],
    t:"Sebut contoh ujian, misalnya kalium, glukosa, hemoglobin atau platelet yang sangat rendah." },

  { k:"Teknikal Makmal", s:"Apakah kriteria penolakan spesimen dan bagaimana anda mengurangkan kadar penolakan?",
    a:"Spesimen ditolak jika **label** tiada atau tidak sepadan, **bekas** salah, **isipadu** tidak cukup, atau spesimen **hemolisis, beku atau lewat sampai**. Saya akan **memaklumkan wad** segera, merekod penolakan dan meminta spesimen baharu. Untuk mengurangkan kadar penolakan, saya **menganalisis data** mengikut wad dan punca, kemudian memberi maklum balas dan **latihan kepada wad**.",
    e:"🧪",
    kw:"Tolak Spesimen",
    m:[["🏷️", "Label / bekas / isipadu"], ["🩸", "Hemolisis, beku, lewat"], ["📞", "Maklum wad & rekod"], ["📊", "Analisis ikut wad"], ["🎓", "Latih wad"]],
    j:["Kriteria biasa: tiada label atau label tidak sepadan dengan borang, bekas salah, isipadu tidak cukup.",
       "Juga: spesimen hemolisis, beku, tumpah, lewat sampai atau suhu pengangkutan tidak betul.",
       "Tindakan: maklum kepada wad dengan segera, rekod penolakan dan minta spesimen baharu.",
       "Pencegahan: analisis data penolakan mengikut wad dan punca.",
       "Beri maklum balas dan latihan kepada wad, sediakan panduan pengambilan spesimen."],
    t:"Spesimen yang sukar diulang (contoh CSF) dikendalikan mengikut budi bicara dan SOP, bukan terus ditolak." },

  { k:"Teknikal Makmal", s:"Bagaimanakah anda memantau dan menambah baik masa pusingan ujian (TAT)?",
    a:"Saya menetapkan **sasaran TAT** bagi ujian segera dan rutin, dan **memantaunya melalui LIS** setiap bulan. Saya **menganalisis punca kelewatan** seperti penghantaran spesimen, kerosakan alat dan kekurangan staf. Tindakan saya ialah **menyusun semula aliran kerja**, mengagih staf mengikut waktu puncak, menyediakan **alat sandaran**, dan **membentangkan prestasi** TAT dalam mesyuarat jabatan.",
    e:"⏱️",
    kw:"TAT",
    m:[["🎯", "Sasaran & pantau LIS"], ["🔎", "Punca kelewatan"], ["🔀", "Susun aliran kerja"], ["🛟", "Alat sandaran"], ["📣", "Bentang prestasi"]],
    j:["Tetapkan sasaran TAT bagi ujian segera dan rutin, dan pantau melalui LIS setiap bulan.",
       "Analisis punca kelewatan: penghantaran spesimen, pendaftaran, kerosakan alat, kekurangan staf, pengesahan lewat.",
       "Tindakan: susun semula aliran kerja, agih staf mengikut waktu puncak, penyelenggaraan berjadual.",
       "Sediakan alat sandaran atau makmal rujukan sandaran.",
       "Bentang prestasi TAT dalam mesyuarat jabatan dan kepada pelanggan."],
    t:"Jika ada, kongsi data TAT sebenar unit anda." },

  { k:"Teknikal Makmal", s:"Apakah MS ISO 15189 dan mengapa ia penting kepada makmal perubatan?",
    a:"**MS ISO 15189** ialah piawaian antarabangsa khusus untuk **makmal perubatan** yang menetapkan keperluan **kualiti dan kecekapan**, merangkumi aspek **pengurusan dan teknikal**. Di Malaysia, akreditasi diberi oleh **Jabatan Standard Malaysia** melalui skim **SAMM**. Ia penting kerana menjamin **keputusan yang boleh dipercayai** dan keselamatan pesakit. Sebagai penyelia, saya memastikan **SOP dipatuhi**, rekod lengkap dan audit dalaman dijalankan.",
    e:"📜",
    kw:"MS ISO 15189",
    m:[["🏥", "Piawaian makmal perubatan"], ["🧩", "Pengurusan + teknikal"], ["🏛️", "Akreditasi JSM (SAMM)"], ["🤝", "Keputusan dipercayai"], ["👀", "Penyelia: SOP & audit"]],
    j:["Piawaian antarabangsa bagi makmal perubatan: keperluan kualiti dan kecekapan (versi terkini ISO 15189:2022).",
       "Merangkumi keperluan pengurusan dan teknikal: personel, peralatan, proses pra-analitikal hingga pasca-analitikal, pengurusan risiko.",
       "Akreditasi di Malaysia diberi oleh Jabatan Standard Malaysia melalui Skim Akreditasi Makmal Malaysia (SAMM).",
       "Kepentingan: keputusan boleh dipercayai, keselamatan pesakit, keyakinan pelanggan, penambahbaikan berterusan.",
       "Peranan penyelia: pastikan SOP dipatuhi, rekod lengkap, audit dalaman dan tindakan pembetulan dilaksana."],
    t:"Nyatakan status akreditasi makmal anda dan peranan anda semasa audit." },

  { k:"Teknikal Makmal", s:"Bagaimanakah anda menguruskan reagen dan stok bahan guna habis makmal?",
    a:"Saya memastikan **rekod stok** sentiasa kemas kini, termasuk nombor lot dan tarikh luput. Saya mengamalkan **FEFO**, iaitu yang luput dahulu diguna dahulu, dan menetapkan **paras stok minimum**. Reagen disimpan mengikut syarat pengeluar dengan **pemantauan suhu** harian, dan setiap **lot baharu diverifikasi** sebelum diguna. Saya **merancang perolehan** lebih awal mengikut tatacara kerajaan dan **mengelak pembaziran** dengan mengagih reagen yang hampir luput.",
    e:"📦",
    kw:"Stok Reagen",
    m:[["📒", "Rekod kemas kini"], ["⏳", "FEFO & paras minimum"], ["🌡️", "Simpan & pantau suhu"], ["🧪", "Verifikasi lot baharu"], ["🛒", "Rancang perolehan"], ["♻️", "Elak pembaziran"]],
    j:["Rekod stok yang kemas kini: tarikh terima, nombor lot, tarikh luput, baki.",
       "Amalkan FEFO (yang luput dahulu, guna dahulu) dan tetapkan paras stok minimum.",
       "Simpan mengikut syarat pengeluar dan pantau suhu peti sejuk setiap hari.",
       "Buat verifikasi lot baharu sebelum digunakan untuk sampel pesakit.",
       "Rancang perolehan awal mengikut penggunaan dan patuhi tatacara perolehan kerajaan.",
       "Elak pembaziran: pantau reagen hampir luput dan agih ke fasiliti lain jika perlu."],
    t:"Kaitkan dengan penjimatan kos. Panel suka jawapan yang menunjukkan kesedaran bajet." },

  { k:"Teknikal Makmal", s:"Apakah langkah anda apabila menerima peralatan atau kaedah ujian baharu sebelum digunakan untuk pesakit?",
    a:"Pertama, saya memastikan **pemasangan dan pentauliahan (T&C)** oleh pembekal lengkap. Kemudian saya menjalankan **verifikasi kaedah**, iaitu kejituan, ketepatan dan perbandingan dengan kaedah sedia ada. Saya menyediakan **SOP** dan tetapan dalam **LIS**, **melatih staf** serta menilai kompetensi mereka. Alat didaftarkan sebagai **aset** dengan jadual penyelenggaraan, dan **pelanggan dimaklumkan** jika julat rujukan berubah.",
    e:"🆕",
    kw:"Alat / Kaedah Baharu",
    m:[["📦", "Pentauliahan (T&C)"], ["🔬", "Verifikasi kaedah"], ["📄", "SOP & tetapan LIS"], ["🎓", "Latih & kompetensi"], ["🗓️", "Aset & jadual selenggara"], ["📣", "Maklum pelanggan"]],
    j:["Semak pemasangan dan pentauliahan oleh pembekal (Testing & Commissioning) serta dokumen lengkap.",
       "Jalankan verifikasi kaedah: kejituan, ketepatan, julat pelaporan, perbandingan dengan kaedah sedia ada.",
       "Sediakan atau kemas kini SOP, julat rujukan dan tetapan dalam LIS.",
       "Latih staf dan nilai kompetensi sebelum dibenar mengendalikan alat.",
       "Daftar aset, sediakan jadual penyelenggaraan dan kalibrasi.",
       "Maklumkan kepada pelanggan jika ada perubahan julat rujukan atau jenis spesimen."],
    t:"Bezakan: verifikasi untuk kaedah yang sudah disahkan pengeluar, validasi untuk kaedah baharu atau diubah suai." },

  { k:"Teknikal Makmal", s:"Bagaimanakah anda memastikan peralatan makmal sentiasa berfungsi dengan baik?",
    a:"Saya memastikan **penyelenggaraan harian, mingguan dan bulanan** dibuat oleh pengguna dan direkodkan. **PPM dan kalibrasi** dijalankan mengikut jadual oleh pembekal atau syarikat konsesi. Prestasi alat dipantau melalui **IQC** dan rekod **downtime**. Saya juga menyemak **sijil kalibrasi** dan label status, serta merancang **penggantian alat usang** dan pelan sandaran.",
    e:"🔧",
    kw:"Jaga Peralatan",
    m:[["🧽", "Selenggara harian"], ["🗓️", "PPM & kalibrasi"], ["📉", "Pantau IQC & downtime"], ["🏷️", "Sijil & label status"], ["🔄", "Ganti alat usang"]],
    j:["Penyelenggaraan harian, mingguan dan bulanan oleh pengguna mengikut manual, direkod dalam log.",
       "Penyelenggaraan pencegahan berjadual (PPM) dan kalibrasi oleh pembekal atau syarikat konsesi.",
       "Pantau prestasi melalui IQC dan rekod kerosakan (downtime).",
       "Semak sijil kalibrasi dan label status pada alat.",
       "Rancang penggantian alat usang dan sediakan pelan sandaran."],
    t:"Sebut pengalaman anda berurusan dengan pembekal atau jurutera semasa alat rosak." },

  { k:"Teknikal Makmal", s:"Apakah PHLAS dan apakah bezanya dengan akreditasi MS ISO 15189?",
    a:"**PHLAS** ialah **Primary Healthcare Laboratory Accreditation Scheme**, iaitu skim akreditasi yang dikendalikan oleh **Jabatan Standard Malaysia** khusus untuk **makmal penjagaan kesihatan primer**, seperti makmal klinik kesihatan. Manualnya diterbitkan pada **Januari 2021**. **MS ISO 15189** di bawah skim SAMM pula lazimnya untuk makmal hospital dan makmal rujukan yang skop ujiannya lebih luas. Kedua-duanya mempunyai matlamat yang sama, iaitu **keputusan ujian yang boleh dipercayai** melalui sistem kualiti, kompetensi staf, kawalan kualiti dan audit. PHLAS membolehkan makmal klinik kesihatan diiktiraf mengikut **skop dan keupayaan** mereka.",
    e:"🏅",
    kw:"PHLAS",
    m:[["🏠", "Akreditasi makmal kesihatan primer"], ["🏛️", "Jabatan Standard Malaysia"], ["📅", "Manual: Januari 2021"], ["🏥", "ISO 15189: hospital & rujukan"], ["🎯", "Matlamat sama: keputusan dipercayai"], ["📐", "Ikut skop makmal klinik"]],
    j:["Akreditasi makmal kesihatan primer", "Jabatan Standard Malaysia", "Manual: Januari 2021", "ISO 15189: hospital & rujukan", "Matlamat sama: keputusan dipercayai", "Ikut skop makmal klinik"],
    t:"Penting jika anda ditempatkan di JKN. Ketahui berapa makmal klinik di negeri anda yang sudah mendapat PHLAS." },

  { k:"Teknikal Makmal", s:"Bagaimanakah rujukan spesimen antara makmal dan makmal rujukan diuruskan?",
    a:"Ujian yang tidak dapat dijalankan di sesebuah makmal dirujuk ke **makmal rujukan yang ditetapkan**, seperti hospital negeri, IMR atau MKAK. Makmal perujuk perlu memastikan **spesimen dan borang lengkap**, **pembungkusan tiga lapis** yang selamat, serta **suhu dan masa penghantaran** yang betul. Setiap spesimen **direkod dan dijejak** sehingga keputusan diterima dan disampaikan kepada peminta. Makmal rujukan pula menetapkan **kriteria penerimaan dan TAT**. Makmal rujukan juga saling membandingkan keputusan melalui **perbandingan antara makmal**. Saya biasa dengan kedua-dua pihak kerana pernah bertugas di **klinik, hospital, IMR dan MKAK**.",
    e:"🔗",
    kw:"Rujukan Antara Makmal",
    m:[["🎯", "Makmal rujukan yang ditetapkan"], ["📋", "Spesimen & borang lengkap"], ["📦", "Bungkus 3 lapis, suhu, masa"], ["🧭", "Rekod & jejak hingga keputusan"], ["⏱️", "Kriteria terima & TAT"], ["⚖️", "Perbandingan antara makmal"]],
    j:["Makmal rujukan yang ditetapkan", "Spesimen & borang lengkap", "Bungkus 3 lapis, suhu, masa", "Rekod & jejak hingga keputusan", "Kriteria terima & TAT", "Perbandingan antara makmal"],
    t:"Beri contoh dari Unit TB: jenis spesimen yang dirujuk kepada anda dan masalah lazim semasa penerimaan." },

  { k:"Teknikal Makmal", s:"Apakah perbezaan antara MS ISO 15189, ISO/IEC 17025 dan ISO 9001?",
    a:"**MS ISO 15189** ialah piawaian khusus untuk **makmal perubatan**, yang merangkumi sistem kualiti dan kecekapan teknikal serta memberi tumpuan kepada pesakit. **ISO/IEC 17025** pula untuk **makmal ujian dan kalibrasi**, contohnya makmal makanan, air dan alam sekitar. Kedua-duanya menilai **kecekapan teknikal** makmal dan diberi sebagai **akreditasi** oleh Jabatan Standard Malaysia. **ISO 9001** ialah piawaian **sistem pengurusan kualiti** yang umum untuk mana-mana organisasi; ia diberi sebagai **pensijilan** dan tidak menilai kecekapan teknikal ujian. Sebab itu makmal perubatan memilih ISO 15189, dan sebuah institusi boleh memegang lebih daripada satu piawaian mengikut jenis makmalnya.",
    e:"📐",
    kw:"Jenis ISO",
    m:[["🏥", "ISO 15189: makmal perubatan"], ["🧪", "ISO/IEC 17025: makmal ujian & kalibrasi"], ["🏢", "ISO 9001: pengurusan kualiti am"], ["🎓", "15189 & 17025: nilai kecekapan teknikal"], ["🏛️", "Akreditasi: Jabatan Standard Malaysia"], ["📜", "9001: pensijilan, bukan akreditasi"]],
    j:["ISO 15189: makmal perubatan", "ISO/IEC 17025: makmal ujian & kalibrasi", "ISO 9001: pengurusan kualiti am", "15189 & 17025: nilai kecekapan teknikal", "Akreditasi: Jabatan Standard Malaysia", "9001: pensijilan, bukan akreditasi"],
    t:"Ketahui piawaian yang dipegang oleh MKAK dan Unit TB sendiri, tarikh akreditasi dan skopnya." },

  { k:"Teknikal Makmal", s:"Bagaimanakah anda menyediakan makmal untuk audit MS ISO 15189?",
    a:"Persediaan audit ialah kerja sepanjang tahun, bukan menjelang audit sahaja. Saya memastikan **dokumen dan SOP** terkini serta dikawal, dan **rekod latihan serta kompetensi** setiap staf lengkap. Rekod teknikal seperti **IQC, EQA, kalibrasi dan penyelenggaraan** disemak supaya tiada yang tertinggal. Saya menjalankan **audit dalaman** lebih awal untuk mengesan kelemahan, dan setiap ketakakuran (**NCR**) ditutup dengan **analisis punca serta tindakan pembetulan**. Hasilnya dibincangkan dalam **mesyuarat kajian semula pengurusan**. Semasa audit, saya memastikan staf **menjawab dengan jujur berdasarkan rekod**, dan selepas audit saya memantau tindakan susulan sehingga ditutup.",
    e:"🔍",
    kw:"Persediaan Audit ISO",
    m:[["📄", "Dokumen & SOP terkini"], ["🎓", "Rekod latihan & kompetensi"], ["🎯", "IQC, EQA, kalibrasi, selenggara"], ["🔎", "Audit dalaman dahulu"], ["🛠️", "Tutup NCR dengan analisis punca"], ["👥", "Kajian semula pengurusan"]],
    j:["Dokumen & SOP terkini", "Rekod latihan & kompetensi", "IQC, EQA, kalibrasi, selenggara", "Audit dalaman dahulu", "Tutup NCR dengan analisis punca", "Kajian semula pengurusan"],
    t:"Beri contoh satu NCR sebenar di unit anda: apa puncanya dan bagaimana ia ditutup." },

  /* ---------- C. Keselamatan ---------- */
  { k:"Keselamatan & Biosafety", s:"Berlaku tumpahan spesimen darah di lantai makmal. Apakah tindakan anda?",
    a:"Saya akan **memaklumkan staf** berdekatan dan **menghadkan kawasan**. Dengan memakai **PPE**, saya menutup tumpahan dengan **bahan penyerap** dan menuang **disinfektan** dari luar ke dalam, kemudian membiarkannya mengikut **masa sentuhan** dalam SOP. Kaca pecah diambil dengan forsep. Semua bahan dibuang sebagai **sisa klinikal**, tangan dicuci, dan **insiden dilaporkan** serta direkodkan.",
    e:"🩸",
    kw:"Tumpahan Darah",
    m:[["🚧", "Maklum & hadkan"], ["🧤", "Pakai PPE"], ["🧴", "Serap + disinfektan"], ["⏲️", "Masa sentuhan, forsep"], ["🟡", "Buang: sisa klinikal"], ["📝", "Lapor insiden"]],
    j:["Maklumkan staf berdekatan dan hadkan kawasan tumpahan.",
       "Pakai PPE yang sesuai: sarung tangan, kot makmal, pelindung muka jika perlu.",
       "Tutup tumpahan dengan bahan penyerap, tuang disinfektan (contoh natrium hipoklorit) dari luar ke dalam.",
       "Biarkan mengikut masa sentuhan dalam SOP, kemudian bersihkan. Kaca pecah diambil dengan forsep, bukan tangan.",
       "Buang semua bahan sebagai sisa klinikal, cuci tangan.",
       "Lapor dan rekod insiden; semak punca untuk mengelak berulang."],
    t:"Sebut kit tumpahan (spill kit) dan latihan berkala kepada staf." },

  { k:"Keselamatan & Biosafety", s:"Seorang staf anda tercucuk jarum terpakai. Apakah yang perlu dilakukan?",
    a:"Staf perlu segera **membasuh luka** dengan sabun dan air mengalir tanpa memicitnya. Kejadian **dilaporkan segera** dan staf dirujuk ke Jabatan Kecemasan untuk penilaian risiko. **Ujian saringan** HIV, Hepatitis B dan Hepatitis C dibuat untuk staf dan sumber pesakit, dan **PEP** dimulakan jika disyorkan doktor. **Borang notifikasi** diisi, diikuti **susulan** ujian darah dan kaunseling, serta siasatan punca.",
    e:"💉",
    kw:"Tercucuk Jarum",
    m:[["🚿", "Basuh, jangan picit"], ["🏥", "Lapor & rujuk segera"], ["🔬", "Saring HIV, Hep B, Hep C"], ["💊", "PEP jika perlu"], ["📝", "Borang notifikasi"], ["🔁", "Susulan & kaunseling"]],
    j:["Pertolongan cemas segera: basuh luka dengan sabun dan air mengalir, jangan picit atau hisap luka.",
       "Lapor segera kepada penyelia dan rujuk ke Jabatan Kecemasan atau klinik yang ditetapkan untuk penilaian risiko.",
       "Kenal pasti sumber pesakit jika boleh; ujian saringan HIV, Hepatitis B dan Hepatitis C untuk staf dan sumber.",
       "Rawatan profilaksis pasca pendedahan (PEP) jika disyorkan doktor, secepat mungkin.",
       "Isi borang notifikasi kecederaan benda tajam dan lapor kepada unit keselamatan dan kesihatan pekerjaan.",
       "Susulan ujian darah dan kaunseling; siasat punca dan baiki amalan kerja."],
    t:"Tunjuk keprihatinan kepada staf, bukan hanya prosedur." },

  { k:"Keselamatan & Biosafety", s:"Bagaimanakah sisa makmal diurus dengan betul?",
    a:"Sisa makmal **diasingkan di punca** mengikut jenis. **Sisa klinikal** dimasukkan ke dalam **beg kuning**, dan **benda tajam** ke dalam bekas khas yang kalis tusukan. Sisa berisiko tinggi seperti **kultur** dinyahcemar dengan **autoklaf** dahulu. **Sisa am** dimasukkan ke dalam **beg hitam**, manakala **sisa kimia** diurus berasingan sebagai buangan terjadual. Bekas tidak diisi melebihi tiga per empat dan dikutip oleh syarikat konsesi.",
    e:"🗑️",
    kw:"Sisa Makmal",
    m:[["✂️", "Asing di punca"], ["🟡", "Klinikal: beg kuning"], ["📌", "Tajam: bekas khas"], ["♨️", "Kultur: autoklaf"], ["⚫", "Am: beg hitam"], ["⚗️", "Kimia: buangan terjadual"]],
    j:["Asingkan di punca mengikut jenis sisa.",
       "Sisa klinikal ke dalam beg kuning; benda tajam ke dalam bekas benda tajam yang kalis tusukan.",
       "Sisa berisiko tinggi seperti kultur dinyahcemar (autoklaf) dahulu mengikut SOP.",
       "Sisa am ke dalam beg hitam; sisa kimia diurus berasingan sebagai buangan terjadual.",
       "Bekas tidak diisi melebihi tiga per empat, dilabel dan dikutip oleh syarikat konsesi.",
       "Tertakluk kepada Akta Kualiti Alam Sekeliling 1974 dan peraturan buangan terjadual."],
    t:"Sebut pemantauan anda sebagai penyelia: audit pengasingan sisa dan latihan staf." },

  { k:"Keselamatan & Biosafety", s:"Apakah langkah anda untuk memastikan keselamatan staf di makmal?",
    a:"Saya memastikan **Standard Precautions** diamalkan, iaitu semua spesimen dianggap berpotensi berjangkit. **PPE** mencukupi dan kabinet biokeselamatan diselenggara; di **Unit TB**, kerja kultur dijalankan dengan **kawalan biokeselamatan yang lebih tinggi**, termasuk perlindungan pernafasan. Staf diberi **taklimat dan latihan berkala** tentang tumpahan, kebakaran dan bahan kimia, serta **imunisasi Hepatitis B**. Saya menjalankan **penilaian risiko** dan audit keselamatan serta menggalakkan **pelaporan insiden**, selaras dengan Akta Keselamatan dan Kesihatan Pekerjaan 1994.",
    e:"🦺",
    kw:"Keselamatan Staf",
    m:[["🦠", "Standard Precautions"], ["🧤", "PPE & kabinet bio"], ["🧫", "Unit TB: kawalan lebih tinggi"], ["🎓", "Latihan berkala"], ["💉", "Imunisasi Hep B"], ["🔍", "Risiko, audit, insiden"]],
    j:["Amalan Standard Precautions: semua spesimen dianggap berpotensi berjangkit.",
       "PPE mencukupi dan dipakai dengan betul; kabinet biokeselamatan diselenggara dan disahkan.",
       "Taklimat keselamatan untuk staf baharu dan latihan berkala (tumpahan, kebakaran, bahan kimia).",
       "Imunisasi Hepatitis B untuk staf dan rekod status.",

  /* ---------- D. Pengurusan & kepimpinan ---------- */
  { k:"Pengurusan & Kepimpinan", s:"Seorang staf di bawah seliaan anda kerap datang lewat dan prestasinya merosot. Bagaimana anda menanganinya?",
    a:"Saya akan **mengumpul fakta** dahulu, seperti rekod kehadiran dan kesan kepada tugas. Kemudian saya **berjumpa staf itu secara tertutup** untuk mendengar masalahnya. Saya memberi **nasihat dan teguran lisan**, menetapkan sasaran pembaikan dan **menawarkan bantuan** seperti kaunseling. Jika berterusan, saya memberi **teguran bertulis** dan melaporkannya kepada ketua jabatan untuk tindakan tatatertib. Semua perbincangan **direkodkan**.",
    e:"⏰",
    kw:"Staf Bermasalah",
    m:[["📊", "Kumpul fakta"], ["🚪", "Jumpa tertutup"], ["🎯", "Teguran & sasaran"], ["🤲", "Tawar bantuan"], ["📨", "Bertulis / tatatertib"], ["📝", "Rekod"]],
    j:["Kumpul fakta dahulu: rekod kehadiran, kesan kepada tugas.",
       "Jumpa secara tertutup, dengar masalahnya (kesihatan, keluarga, kewangan).",
       "Beri nasihat dan teguran lisan, tetapkan sasaran pembaikan dan tempoh pemantauan.",
       "Tawar bantuan: tukar syif jika munasabah, rujuk kaunseling.",
       "Jika berterusan: teguran bertulis dan lapor kepada ketua jabatan untuk tindakan mengikut peraturan tatatertib.",
       "Rekod semua perbincangan dan tindakan."],
    t:"Tunjuk turutan: siasat, bimbing, pantau, baru tindakan tegas. Jangan terus menghukum." },

  { k:"Pengurusan & Kepimpinan", s:"Makmal anda kekurangan staf tetapi beban kerja meningkat. Apakah tindakan anda?",
    a:"Saya akan **menganalisis beban kerja** dan waktu puncak, kemudian **menyusun semula jadual** serta melatih staf **pelbagai kemahiran** supaya boleh saling mengganti. Saya **mempermudah aliran kerja** melalui automasi dan mengurangkan kerja manual, serta **mengutamakan ujian segera**. Pada masa yang sama, saya mengemukakan **justifikasi berasaskan data** untuk tambahan jawatan, dan **menjaga moral** serta kebajikan staf.",
    e:"👥",
    kw:"Kurang Staf",
    m:[["📊", "Analisis beban kerja"], ["🔀", "Susun & multi-skilling"], ["⚡", "Permudah / automasi"], ["🚨", "Utamakan ujian segera"], ["📑", "Justifikasi berdata"], ["💚", "Jaga moral staf"]],
    j:["Analisis beban kerja: bilangan ujian, waktu puncak, tugas yang tidak menambah nilai.",
       "Susun semula jadual dan agihan tugas; latih staf pelbagai kemahiran (multi-skilling) supaya boleh saling ganti.",
       "Permudah aliran kerja: automasi, gabung proses, kurangkan kerja manual dan pendua.",
       "Tetapkan keutamaan ujian segera dan kritikal.",
       "Kemuka justifikasi berasaskan data kepada pengurusan untuk tambahan jawatan atau kerja lebih masa.",
       "Jaga kebajikan dan moral staf: rehat mencukupi, penghargaan."],
    t:"Panel mahu lihat penyelesaian anda sendiri dahulu, bukan sekadar 'minta tambah staf'." },

  { k:"Pengurusan & Kepimpinan", s:"Dua orang staf anda berkonflik sehingga menjejaskan kerja unit. Bagaimana anda menyelesaikannya?",
    a:"Saya akan **bertindak awal** supaya konflik tidak berlarutan. Saya **mendengar kedua-dua pihak secara berasingan** tanpa berat sebelah untuk mengenal pasti **punca sebenar**. Kemudian saya mengadakan **perbincangan bersama** yang berfokus kepada isu kerja, menetapkan peraturan yang jelas dan **memantau** selepas itu. Jika gagal, saya **merujuk** kepada ketua jabatan atau kaunselor.",
    e:"🤝",
    kw:"Konflik Staf",
    m:[["⏱️", "Bertindak awal"], ["👂", "Dengar berasingan"], ["🔎", "Cari punca"], ["🤝", "Bincang bersama"], ["👀", "Peraturan & pantau"], ["⬆️", "Rujuk jika gagal"]],
    j:["Bertindak awal, jangan biar berlarutan.",
       "Dengar kedua-dua pihak secara berasingan tanpa berat sebelah.",
       "Kenal pasti punca sebenar: agihan tugas, komunikasi atau hal peribadi.",
       "Adakan perbincangan bersama, fokus kepada isu kerja dan cari persetujuan.",
       "Tetapkan peraturan yang jelas dan pantau selepas itu.",
       "Jika gagal, rujuk kepada ketua jabatan atau kaunselor."],
    t:"Tekankan sikap adil dan profesional; keutamaan ialah perkhidmatan kepada pesakit tidak terjejas." },

  { k:"Pengurusan & Kepimpinan", s:"Seorang doktor mengadu keputusan ujian lewat dan memarahi staf anda. Apakah tindakan anda?",
    a:"Saya akan **bertenang dan mendengar** aduan itu sepenuhnya serta memohon maaf atas kesulitan. Keutamaan saya ialah **pesakit**, jadi saya menyemak status ujian dan menyegerakan keputusan. Kemudian saya **menyiasat punca** kelewatan dan memberi **maklum balas yang jujur** kepada doktor. Aduan **direkodkan** mengikut prosedur, dan saya **menyokong serta membimbing staf** jika ada kelemahan.",
    e:"👂",
    kw:"Aduan Doktor",
    m:[["😌", "Tenang & dengar"], ["🩺", "Pesakit dahulu"], ["🔎", "Siasat punca"], ["💬", "Maklum balas jujur"], ["📝", "Rekod aduan"], ["🛡️", "Sokong & bimbing staf"]],
    j:["Tenang dan dengar aduan sepenuhnya; mohon maaf atas kesulitan.",
       "Selesaikan keperluan pesakit dahulu: semak status ujian dan segerakan keputusan.",
       "Siasat punca kelewatan: spesimen lewat sampai, alat rosak, ujian diulang, kesilapan staf.",
       "Beri maklum balas jujur kepada doktor tentang punca dan tindakan pembetulan.",
       "Rekod aduan mengikut prosedur aduan pelanggan dan bincang dalam mesyuarat unit.",
       "Sokong staf anda, dan bimbing jika ada kelemahan."],
    t:"Tunjuk anda mengutamakan pesakit, menjaga hubungan dengan pelanggan dan melindungi staf secara adil." },

  { k:"Pengurusan & Kepimpinan", s:"Anda dapati satu keputusan ujian yang salah telah dikeluarkan kepada wad. Apakah tindakan anda?",
    a:"Saya akan **menghubungi doktor atau wad dengan segera** supaya rawatan pesakit tidak tersasar. Keputusan ditarik balik dan **laporan pembetulan** dikeluarkan. Saya **menyemak sampel lain** yang mungkin terjejas, **melaporkan insiden** kepada ketua unit atau pakar patologi, dan menjalankan **analisis punca (RCA)**. Pengajaran **dikongsi dengan staf** tanpa mencari salah individu.",
    e:"✏️",
    kw:"Keputusan Salah",
    m:[["📞", "Maklum doktor segera"], ["📄", "Laporan pembetulan"], ["🔍", "Semak sampel lain"], ["📝", "Lapor insiden"], ["🌳", "Analisis punca (RCA)"], ["🗣️", "Kongsi pengajaran"]],
    j:["Hubungi doktor atau wad dengan segera untuk memaklumkan kesilapan supaya rawatan tidak tersasar.",
       "Tarik balik keputusan dan keluarkan laporan pembetulan (amended report) dengan rekod yang jelas.",
       "Semak sama ada sampel pesakit lain turut terjejas.",
       "Lapor kepada ketua unit atau pakar patologi dan isi laporan insiden.",
       "Jalankan analisis punca (root cause analysis) dan tindakan pembetulan serta pencegahan.",
       "Kongsi pengajaran dengan staf tanpa mencari salah individu."],
    t:"Kata kunci: keselamatan pesakit, ketelusan, tidak menyembunyikan kesilapan." },

  { k:"Pengurusan & Kepimpinan", s:"Penganalisis utama rosak pada waktu malam dan banyak sampel segera menunggu. Apa tindakan anda?",
    a:"Saya akan cuba **troubleshoot** mengikut manual, kemudian mengaktifkan **pelan sandaran** seperti alat sandaran, kaedah manual atau makmal rujukan terdekat. **Sampel kritikal diutamakan**, dan **wad serta Jabatan Kecemasan dimaklumkan** tentang kelewatan. Saya **menghubungi jurutera** dan penyelia. Sebelum alat diguna semula, **IQC** dijalankan dan kerosakan direkodkan.",
    e:"🌙",
    kw:"Alat Rosak",
    m:[["🔧", "Troubleshoot"], ["🛟", "Pelan sandaran"], ["🚨", "Utamakan kritikal"], ["📞", "Maklum wad & Kecemasan"], ["👷", "Hubungi jurutera"], ["✅", "IQC sebelum guna semula"]],
    j:["Cuba penyelesaian asas mengikut manual (troubleshooting) dan semak mesej ralat.",
       "Aktifkan pelan sandaran: guna alat sandaran, kaedah manual atau hantar ke makmal rujukan terdekat.",
       "Utamakan sampel kecemasan dan kritikal.",
       "Maklumkan kepada wad dan Jabatan Kecemasan tentang kelewatan dan anggaran masa.",
       "Hubungi jurutera pembekal dan maklum kepada penyelia atau ketua unit.",
       "Rekod kerosakan; sebelum alat diguna semula, jalankan IQC dan kalibrasi jika perlu."],
    t:"Sebut 'pelan kesinambungan perkhidmatan' (contingency plan) yang patut wujud secara bertulis." },

  { k:"Pengurusan & Kepimpinan", s:"Bagaimanakah anda melatih dan menilai kompetensi staf baharu?",
    a:"Staf baharu melalui **orientasi** tentang organisasi, keselamatan dan SOP asas. Mereka kemudian dilatih secara **berstruktur dengan mentor** dan senarai semak. **Kompetensi dinilai** melalui pemerhatian, ujian bertulis dan sampel buta. Hanya selepas **disahkan kompeten** barulah mereka dibenarkan bekerja sendiri dan bertugas atas panggilan. **Penilaian semula** dibuat secara berkala dan **CPD** digalakkan.",
    e:"🎓",
    kw:"Latih Staf Baharu",
    m:[["🧭", "Orientasi"], ["👥", "Latihan + mentor"], ["✅", "Nilai kompetensi"], ["🔓", "Baru kerja sendiri"], ["🔁", "Nilai semula berkala"], ["📚", "CPD"]],
    j:["Program orientasi: struktur organisasi, keselamatan, kerahsiaan, SOP asas.",
       "Latihan berstruktur mengikut unit dengan mentor dan senarai semak latihan.",
       "Penilaian kompetensi: pemerhatian langsung, ujian bertulis, sampel buta (blind sample).",
       "Hanya dibenar bekerja sendiri dan bertugas atas panggilan selepas disahkan kompeten.",
       "Penilaian semula berkala dan rekod latihan disimpan.",
       "Galak pembelajaran berterusan (CPD)."],
    t:"Kaitkan dengan keperluan personel dalam MS ISO 15189." },

  { k:"Pengurusan & Kepimpinan", s:"Ceritakan satu inovasi atau projek penambahbaikan kualiti yang anda terlibat.",
    a:"Saya terlibat dalam projek KIK **[nama projek]** sebagai **[peranan]**. **Masalah asalnya** ialah [masalah], berdasarkan data [data]. Kami **menganalisis punca** dan melaksanakan [penyelesaian]. **Hasilnya**, [ukuran: masa, kos atau kadar ralat] bertambah baik daripada [sebelum] kepada [selepas]. Projek ini menang di **peringkat negeri dan kebangsaan**, dan [telah diguna pakai atau diperluas].",
    e:"💡",
    kw:"Inovasi / Projek",
    m:[["🏷️", "Nama KIK & peranan"], ["📉", "Masalah + data"], ["🛠️", "Punca & penyelesaian"], ["📈", "Hasil diukur"], ["🏆", "Menang negeri & kebangsaan"]],
    j:["Nama KIK & peranan", "Masalah + data", "Punca & penyelesaian", "Hasil diukur", "Menang negeri & kebangsaan"],
    t:"Jika belum pernah mengetuai projek, cerita projek yang anda sertai dan apa yang anda mahu buat seterusnya." },

  { k:"Pengurusan & Kepimpinan", s:"Ketua anda memberi arahan yang anda tidak persetujui. Apakah tindakan anda?",
    a:"Saya akan **memahami dahulu tujuan** arahan itu. Jika masih tidak bersetuju, saya **mengemukakan pandangan** dan cadangan alternatif **secara berhemah** melalui saluran yang betul. Jika keputusan kekal dan arahan itu **sah**, saya **melaksanakannya dengan sepenuh komitmen**. Jika arahan bercanggah dengan peraturan atau keselamatan pesakit, saya menyatakan **bantahan secara bertulis**. Saya tidak akan **memburukkan ketua** di hadapan staf.",
    e:"🗣️",
    kw:"Tidak Setuju Arahan",
    m:[["🤔", "Fahami tujuan"], ["🗣️", "Pandangan berhemah"], ["✅", "Sah: laksana penuh"], ["✍️", "Salah: bantah bertulis"], ["🤐", "Jangan burukkan ketua"]],
    j:["Fahami dahulu sebab dan tujuan arahan tersebut.",
       "Kemuka pandangan dan cadangan alternatif secara berhemah, disokong fakta, melalui saluran yang betul.",
       "Jika keputusan kekal dan arahan itu sah, laksanakan dengan sepenuh komitmen.",
       "Jika arahan bercanggah dengan undang-undang, peraturan atau keselamatan pesakit, nyatakan bantahan secara bertulis dan rujuk pihak lebih atas.",
       "Tidak memburukkan ketua di hadapan staf bawahan."],
    t:"Panel menilai kematangan: boleh berbeza pendapat tetapi tetap profesional." },

  { k:"Pengurusan & Kepimpinan", s:"Bagaimanakah pendekatan komunikasi anda dengan staf generasi Z?",
    a:"Staf generasi Z **celik digital, cepat belajar** dan mahu tahu **sebab di sebalik sesuatu arahan**. Pendekatan saya ialah, pertama, **menerangkan 'mengapa'**, bukan sekadar 'buat'. Kedua, memberi **arahan dan jangkaan yang jelas**, diikuti **maklum balas yang kerap dan ringkas**. Ketiga, menggunakan **saluran yang sesuai**: aplikasi mesej untuk makluman pantas, tetapi **bersemuka** untuk teguran dan perkara penting. Keempat, **melibatkan mereka** dalam projek inovasi dan pendigitalan, kerana di situ kekuatan mereka. Kelima, saya **mendengar dan menghargai** pandangan mereka, sambil **tegas tentang SOP, disiplin dan keselamatan pesakit**. Saya mengelak melabel; setiap staf dinilai sebagai individu.",
    e:"💬",
    kw:"Komunikasi Gen Z",
    m:[["❓", "Terangkan 'mengapa'"], ["🎯", "Jangkaan jelas, maklum balas kerap"], ["📱", "Mesej untuk makluman, bersemuka untuk teguran"], ["🚀", "Libatkan dalam inovasi & digital"], ["👂", "Dengar & hargai"], ["⚖️", "Tegas: SOP, disiplin, keselamatan"]],
    j:["Terangkan 'mengapa'", "Jangkaan jelas, maklum balas kerap", "Mesej untuk makluman, bersemuka untuk teguran", "Libatkan dalam inovasi & digital", "Dengar & hargai", "Tegas: SOP, disiplin, keselamatan"],
    t:"Beri satu contoh sebenar membimbing staf muda atau pelatih, dan apa yang anda sendiri belajar daripada mereka." },

  { k:"Pengurusan & Kepimpinan", s:"Bagaimanakah prestasi anda dinilai, dan bagaimanakah anda menilai prestasi staf dengan adil?",
    a:"Markah **LNPT saya ialah 97.4%**, hasil mencapai **sasaran kerja tahunan** dan memikul tugas tambahan seperti pengurusan aset dan projek KIK. Apabila menilai staf, saya bermula dengan **sasaran kerja yang jelas** dan dipersetujui pada awal tahun. Saya menilai berdasarkan **bukti dan rekod**, bukan tanggapan atau hubungan peribadi. Saya memberi **maklum balas sepanjang tahun**, termasuk semakan pertengahan tahun, supaya tiada kejutan pada hujung tahun. Saya memastikan penilaian **adil dan konsisten** antara staf, dan bagi yang lemah saya menyediakan **pelan pembangunan** seperti latihan dan bimbingan.",
    e:"📈",
    kw:"Penilaian Prestasi",
    m:[["📈", "LNPT saya: 97.4%"], ["🎯", "Sasaran kerja tahunan (SKT)"], ["📂", "Nilai berdasarkan bukti"], ["💬", "Maklum balas sepanjang tahun"], ["⚖️", "Adil, tanpa pilih kasih"], ["🌱", "Rancang pembangunan staf"]],
    j:["LNPT saya: 97.4%", "Sasaran kerja tahunan (SKT)", "Nilai berdasarkan bukti", "Maklum balas sepanjang tahun", "Adil, tanpa pilih kasih", "Rancang pembangunan staf"],
    t:"Nyatakan tahun bagi markah 97.4% itu, dan ketahui nama serta kaedah sistem penilaian prestasi yang terkini di bawah SSPA." },

  /* ---------- E. Perkhidmatan awam & isu semasa ---------- */
  { k:"Perkhidmatan Awam & Isu Semasa", s:"Seorang pembekal menawarkan hadiah kepada anda selepas urusan perolehan. Apakah tindakan anda?",
    a:"Saya akan **menolak dengan baik** dan menjelaskan bahawa penjawat awam tidak boleh menerima hadiah berkaitan tugas rasmi, selaras dengan **Peraturan-Peraturan Pegawai Awam (Kelakuan dan Tatatertib) 1993**. Jika hadiah sukar ditolak, saya **melaporkannya secara bertulis kepada ketua jabatan**. Jika ada unsur rasuah, saya melaporkannya kepada Unit Integriti atau **SPRM**. Saya memastikan perolehan dibuat secara **telus**.",
    e:"🎁",
    kw:"Hadiah Pembekal",
    m:[["🙅", "Tolak dengan baik"], ["📕", "Peraturan 1993"], ["✍️", "Lapor ketua jabatan"], ["🚔", "Rasuah: SPRM"], ["🔍", "Perolehan telus"]],
    j:["Tolak dengan baik dan jelaskan penjawat awam tidak boleh menerima hadiah yang berkaitan tugas rasmi.",
       "Rujuk peraturan penerimaan hadiah dalam Peraturan-Peraturan Pegawai Awam (Kelakuan dan Tatatertib) 1993.",
       "Jika hadiah sukar ditolak atau sudah diterima, lapor secara bertulis kepada ketua jabatan.",
       "Jika ada unsur rasuah, lapor kepada Unit Integriti atau SPRM (Akta SPRM 2009).",
       "Pastikan keputusan perolehan dibuat telus mengikut tatacara, tanpa konflik kepentingan."],
    t:"Semak pekeliling penerimaan hadiah yang terkini di jabatan anda." },

  { k:"Perkhidmatan Awam & Isu Semasa", s:"Apakah yang anda faham tentang peraturan tatatertib penjawat awam?",
    a:"Tatatertib penjawat awam berpandukan **Peraturan-Peraturan Pegawai Awam (Kelakuan dan Tatatertib) 1993**. Ia menetapkan tatakelakuan seperti **taat setia, jujur, amanah** dan bertanggungjawab. Contoh pelanggaran ialah **tidak hadir tanpa cuti, ingkar perintah dan cuai**. Hukumannya bermula daripada **amaran** hingga **buang kerja**. Sebagai penyelia, saya perlu menjadi contoh, **menegur awal** dan **melaporkan pelanggaran**.",
    e:"📕",
    kw:"Tatatertib",
    m:[["📕", "Peraturan 1993"], ["🤝", "Taat, jujur, amanah"], ["🚫", "Ponteng, ingkar, cuai"], ["⚖️", "Amaran hingga buang kerja"], ["👀", "Penyelia: tegur & lapor"]],
    j:["Rujukan utama: Peraturan-Peraturan Pegawai Awam (Kelakuan dan Tatatertib) 1993.",
       "Menetapkan tatakelakuan: taat setia, tidak mengutamakan kepentingan peribadi, jujur, amanah, bertanggungjawab.",
       "Contoh pelanggaran: tidak hadir bertugas tanpa cuti, ingkar perintah, cuai, menerima hadiah, pekerjaan luar tanpa kebenaran.",
       "Hukuman: amaran, denda, lucut hak emolumen, tangguh pergerakan gaji, turun gaji, turun pangkat, buang kerja.",
       "Peranan penyelia: menjadi contoh, menegur awal dan melaporkan pelanggaran."],
    t:"Sebut tanggungjawab penyelia; tidak melaporkan pelanggaran staf juga satu kesalahan." },

  { k:"Perkhidmatan Awam & Isu Semasa", s:"Apakah yang anda tahu tentang Sistem Saraan Perkhidmatan Awam (SSPA)?",
    a:"**SSPA** ialah Sistem Saraan Perkhidmatan Awam yang **menggantikan SSM** mulai **1 Disember 2024**. Pelarasan gaji dibuat dalam dua fasa: **Fasa 1 pada 1 Disember 2024** dan **Fasa 2 pada 1 Januari 2026**, iaitu **8% dan 7%** bagi Kumpulan Pelaksana serta Pengurusan dan Profesional. **Gred diseragamkan**, contohnya JTMP kini U5 hingga U8. Sebagai balasan, penjawat awam perlu meningkatkan **prestasi dan produktiviti**.",
    e:"💰",
    kw:"SSPA",
    m:[["🔄", "Ganti SSM, 1 Dis 2024"], ["📆", "Fasa 1: Dis 2024"], ["📆", "Fasa 2: Jan 2026"], ["💹", "8% + 7%"], ["🔢", "Gred baharu U5-U8"], ["📈", "Prestasi & produktiviti"]],
    j:["SSPA menggantikan Sistem Saraan Malaysia (SSM), berkuat kuasa 1 Disember 2024.",
       "Pelarasan gaji dua fasa: Fasa 1 pada 1 Disember 2024 dan Fasa 2 pada 1 Januari 2026.",
       "Kumpulan Pelaksana serta Pengurusan dan Profesional: 8% (Fasa 1) dan 7% (Fasa 2); Kumpulan Pengurusan Tertinggi: 4% dan 3%.",
       "Gred diseragamkan kepada nombor yang lebih ringkas, contohnya JTMP kini bergred U5 hingga U8 dan seterusnya.",
       "Penekanan kepada prestasi, kompetensi dan pembelajaran berterusan penjawat awam.",
       "Sebagai balasan, penjawat awam perlu meningkatkan produktiviti dan mutu perkhidmatan."],
    t:"Semak pekeliling JPA terkini sebelum temuduga kerana butiran boleh dikemas kini." },

  { k:"Perkhidmatan Awam & Isu Semasa", s:"Apakah visi, misi dan budaya korporat Kementerian Kesihatan Malaysia?",
    a:"**Visi** KKM ialah negara menggembleng tenaga ke arah **kesihatan yang lebih baik**. **Misinya** ialah menerajui dan bekerjasama membantu rakyat mencapai potensi kesihatan sepenuhnya serta memastikan sistem kesihatan yang berkualiti tinggi. Budaya korporat KKM ialah **Penyayang, Profesionalisme dan Kerja Berpasukan**. Di makmal, saya mengamalkannya melalui keputusan yang tepat dan cepat untuk pesakit.",

  { k:"Perkhidmatan Awam & Isu Semasa", s:"Apakah Akta Profesion Kesihatan Bersekutu 2016 (Akta 774) dan kesannya kepada JTMP?",
    a:"**Akta 774** ialah Akta Profesion Kesihatan Bersekutu 2016 yang **mengawal selia** profesion kesihatan bersekutu, termasuk JTMP. Pengamal **wajib berdaftar** dengan Majlis Profesion Kesihatan Bersekutu Malaysia dan memiliki **perakuan amalan** yang sah. Akta ini menetapkan **kelayakan dan tatalaku** profesional, sekali gus **melindungi orang awam**. Sebagai penyelia, saya memastikan semua staf berdaftar dan perakuan amalan **tidak luput**.",
    e:"🪪",
    kw:"Akta 774",
    m:[["⚖️", "Kawal selia profesion"], ["📝", "Wajib berdaftar (Majlis)"], ["🪪", "Perakuan amalan sah"], ["🎓", "Kelayakan & tatalaku"], ["🛡️", "Lindung orang awam"], ["👀", "Penyelia: pantau luput"]],
    j:["Akta untuk mengawal selia profesion kesihatan bersekutu, termasuk Juruteknologi Makmal Perubatan.",
       "Pengamal perlu berdaftar dengan Majlis Profesion Kesihatan Bersekutu Malaysia.",
       "Perlu memiliki perakuan amalan yang sah dan diperbaharui mengikut tempoh ditetapkan.",
       "Menetapkan kelayakan yang diiktiraf, tatalaku profesional dan tindakan tatatertib profesion.",

    t:"Pastikan anda tahu status pendaftaran dan tarikh luput perakuan amalan anda sendiri." },

  { k:"Perkhidmatan Awam & Isu Semasa", s:"Bagaimanakah pendigitalan boleh menambah baik perkhidmatan makmal?",
    a:"Pendigitalan menambah baik perkhidmatan makmal melalui **LIS**, iaitu permintaan ujian dan keputusan secara elektronik yang mengurangkan kesilapan salinan. **Kod bar** dan pengantaramukaan alat mempercepat proses, dan keputusan terus masuk ke rekod elektronik sehingga **TAT lebih pendek**. **Papan pemuka** membantu memantau prestasi. Namun, **pelan sandaran manual** tetap perlu, dan penyelia berperanan sebagai **ejen perubahan**.",
    e:"💻",
    kw:"Pendigitalan",
    m:[["💻", "LIS"], ["🏷️", "Kod bar & antara muka"], ["⚡", "Keputusan terus, TAT pendek"], ["📊", "Papan pemuka"], ["🛟", "Sandaran manual"], ["🚀", "Ejen perubahan"]],
    j:["Sistem Maklumat Makmal (LIS): permintaan ujian dan keputusan secara elektronik, kurang kesilapan salinan.",
       "Kod bar dan pengantaramukaan alat mempercepat proses dan menjejak spesimen.",
       "Keputusan terus ke rekod perubatan elektronik, TAT lebih pendek.",
       "Papan pemuka data: pantau TAT, beban kerja, kadar penolakan untuk membuat keputusan.",
       "Cabaran: gangguan sistem, keselamatan data, kemahiran staf; perlu pelan sandaran manual.",
       "Peranan penyelia: menjadi ejen perubahan dan melatih staf."],
    t:"Beri contoh sistem yang digunakan di tempat anda dan satu cadangan penambahbaikan." },

  { k:"Perkhidmatan Awam & Isu Semasa", s:"Bagaimanakah anda menjaga kerahsiaan maklumat pesakit di makmal?",
    a:"Keputusan hanya diberikan kepada **pihak yang berhak**, iaitu doktor atau wad yang merawat. Capaian LIS dikawal dengan **kata laluan sendiri** yang tidak dikongsi. Maklumat pesakit **tidak dikongsi di media sosial** atau aplikasi mesej. Rekod **disimpan dan dilupus dengan selamat**. Saya sentiasa **mengingatkan staf** tentang etika, dan sebarang **pelanggaran dilaporkan** serta disiasat.",
    e:"🔒",
    kw:"Kerahsiaan",
    m:[["👤", "Pihak berhak sahaja"], ["🔑", "Kata laluan sendiri"], ["📵", "Tiada media sosial"], ["🗄️", "Simpan & lupus selamat"], ["📢", "Ingatkan staf"], ["🚨", "Lapor pelanggaran"]],
    j:["Keputusan hanya diberi kepada pihak yang berhak (doktor atau wad yang merawat) melalui saluran rasmi.",
       "Kawalan capaian LIS: kata laluan sendiri, tidak berkongsi, log keluar selepas guna.",
       "Tidak membincang atau berkongsi maklumat pesakit di media sosial dan aplikasi mesej.",
       "Rekod dan borang disimpan dengan selamat dan dilupus mengikut prosedur.",
       "Staf diingatkan tentang etika, peraturan tatatertib dan arahan keselamatan kerajaan.",
       "Pelanggaran dilapor dan disiasat."],
    t:"Contoh isu semasa: mengambil gambar keputusan pesakit dengan telefon peribadi." },

  { k:"Perkhidmatan Awam & Isu Semasa", s:"Apakah cabaran utama perkhidmatan makmal KKM sekarang dan apakah cadangan anda?",
    a:"Cabaran utama ialah **beban kerja yang meningkat** dengan staf yang terhad, **kekangan bajet** dan peralatan usang, serta keperluan **mengekalkan akreditasi**. Makmal juga perlu bersedia menghadapi **wabak baharu**. Cadangan saya ialah menggunakan **data, automasi dan perkongsian sumber** antara fasiliti, serta bekerjasama dengan klinisian untuk **mengurangkan ujian berulang** yang tidak perlu.",
    e:"🧗",
    kw:"Cabaran Makmal",
    m:[["👥", "Beban tinggi, staf terhad"], ["💸", "Bajet & alat usang"], ["🏅", "Kekal akreditasi"], ["🦠", "Wabak baharu"], ["💡", "Data, automasi, kongsi sumber"], ["✂️", "Kurang ujian berulang"]],
    j:["Beban kerja meningkat dengan sumber manusia yang terhad.",
       "Kekangan bajet, kos reagen dan peralatan yang semakin usang.",
       "Keperluan mengekalkan akreditasi dan kualiti.",
       "Penyakit baharu dan wabak yang memerlukan kesiapsiagaan.",
       "Cadangan: guna data untuk mengurus permintaan ujian, automasi, perkongsian sumber antara fasiliti, pembangunan kompetensi staf.",
       "Kurangkan ujian berulang yang tidak perlu melalui kerjasama dengan klinisian."],
    t:"Pilih 2-3 cabaran sahaja dan beri cadangan yang praktikal di peringkat anda." },

  { k:"Perkhidmatan Awam & Isu Semasa", s:"Apakah isu semasa kesihatan di dalam dan di luar negara yang anda ikuti?",
    a:"Di dalam negara, **Belanjawan 2027** memperuntukkan **RM47.7 bilion** kepada KKM, meningkat daripada RM46.5 bilion, termasuk tawaran jawatan tetap kepada **lebih 9,000 doktor kontrak** dan **RM1.2 bilion** untuk membaik pulih kemudahan hospital. Kedua, **kes tibi meningkat**: sehingga awal Februari 2026 sebanyak 2,571 kes didaftarkan, hampir 10% lebih tinggi daripada tempoh sama tahun sebelumnya, dengan beberapa kluster aktif. Ketiga, beban **penyakit tidak berjangkit** kekal tinggi. Di luar negara, isu utama ialah **kerintangan antimikrob**, **kesiapsiagaan pandemik** selepas COVID-19, dan **[isu terkini pada minggu temuduga]**. Semua ini menuntut perkhidmatan makmal yang **cepat, tepat dan bersedia**.",
    e:"📰",
    kw:"Isu Semasa",
    m:[["💰", "Belanjawan 2027: RM47.7 bilion"], ["🩺", "9,000 doktor kontrak ke tetap"], ["🫁", "Tibi meningkat, kluster aktif"], ["🍩", "NCD kekal tinggi"], ["🌍", "AMR & kesiapsiagaan pandemik"], ["🔬", "Makmal: cepat, tepat, bersedia"]],
    j:["Belanjawan 2027: RM47.7 bilion", "9,000 doktor kontrak ke tetap", "Tibi meningkat, kluster aktif", "NCD kekal tinggi", "AMR & kesiapsiagaan pandemik", "Makmal: cepat, tepat, bersedia"],
    t:"Angka ini setakat Oktober 2026. Baca berita KKM pada minggu temuduga dan tambah satu isu terbaharu." },

  { k:"Perkhidmatan Awam & Isu Semasa", s:"Apakah yang anda tahu tentang program kawalan penyakit tidak berjangkit (NCD) KKM?",
    a:"Penyakit tidak berjangkit seperti **diabetes, darah tinggi, kolesterol tinggi dan obesiti** ialah beban kesihatan terbesar negara. **Tinjauan NHMS 2023** mendapati **15.6%** orang dewasa menghidap diabetes, **29.2%** darah tinggi, **33.3%** kolesterol tinggi, dan **54.4%** berlebihan berat badan atau obes; ramai yang **tidak sedar** mereka berpenyakit. KKM menanganinya melalui **saringan kesihatan** di klinik kesihatan, program komuniti seperti **KOSPEN**, **Agenda Nasional Malaysia Sihat**, kempen **Perang Terhadap Gula**, serta kawalan produk merokok. Peranan makmal ialah menyediakan **ujian saringan dan pemantauan** yang tepat, seperti glukosa, HbA1c, profil lipid dan fungsi buah pinggang, terutamanya di makmal klinik kesihatan.",
    e:"🍩",
    kw:"Program NCD",
    m:[["🩸", "Diabetes 15.6%, darah tinggi 29.2%"], ["⚖️", "Kolesterol 33.3%, berat berlebihan 54.4%"], ["🙈", "Ramai tidak sedar"], ["🏃", "KOSPEN, Malaysia Sihat, Perang Gula"], ["🔍", "Saringan di klinik kesihatan"], ["🔬", "Makmal: glukosa, HbA1c, lipid"]],
    j:["Diabetes 15.6%, darah tinggi 29.2%", "Kolesterol 33.3%, berat berlebihan 54.4%", "Ramai tidak sedar", "KOSPEN, Malaysia Sihat, Perang Gula", "Saringan di klinik kesihatan", "Makmal: glukosa, HbA1c, lipid"],
    t:"Hafal dua atau tiga angka NHMS 2023 sahaja; ia menunjukkan anda membaca." },

  { k:"Perkhidmatan Awam & Isu Semasa", s:"Kes tibi di Malaysia dilaporkan meningkat. Sebagai pegawai di Unit TB, apakah pandangan anda?",
    a:"Kes tibi memang meningkat: KKM melaporkan **2,571 kes** sehingga awal Februari 2026, iaitu **9.8% lebih tinggi** daripada tempoh sama tahun 2025, dengan **kluster aktif** di beberapa negeri. Antara puncanya ialah **kepadatan penduduk, warga emas dan pesakit diabetes** yang semakin ramai, serta saringan yang terganggu semasa pandemik. Kawalan bergantung pada **pengesanan awal, saringan kontak dan rawatan sehingga selesai**. Peranan makmal sangat penting: **keputusan yang cepat dan tepat**, termasuk **[ujian di unit anda, contoh: smear, kultur, ujian molekul, ujian kepekaan ubat]**, serta **data pengawasan** untuk tindakan kesihatan awam. Sasaran negara ialah **bebas tibi menjelang 2035**, selaras dengan strategi End TB WHO.",
    e:"🫁",
    kw:"Isu Tibi",
    m:[["📈", "2,571 kes, naik 9.8%"], ["🏘️", "Kluster aktif di beberapa negeri"], ["👵", "Punca: padat, warga emas, diabetes"], ["🔎", "Kesan awal, saring kontak, rawat habis"], ["🧫", "Makmal: cepat, tepat, data"], ["🎯", "Bebas tibi 2035"]],
    j:["2,571 kes, naik 9.8%", "Kluster aktif di beberapa negeri", "Punca: padat, warga emas, diabetes", "Kesan awal, saring kontak, rawat habis", "Makmal: cepat, tepat, data", "Bebas tibi 2035"],
    t:"Ini bidang anda, jadi panel menjangka jawapan yang mendalam. Tambah data unit anda sendiri: beban kerja, TAT dan kadar positif, serta angka kes yang terkini." },

  /* ---------- F. Peringkat Kementerian ---------- */
  { k:"Peringkat Kementerian", s:"Terangkan secara ringkas struktur organisasi Kementerian Kesihatan Malaysia.",

    e:"🏛️",
    kw:"Struktur KKM",
    m:[["👔", "Menteri & Timbalan"], ["🗂️", "KSU: pentadbiran"], ["🩺", "KPK: teknikal"], ["🧩", "Program-program"], ["🗺️", "JKN, hospital, PKD"], ["🏛️", "MKAK: Program Kesihatan Awam"]],
    j:["Diketuai oleh Menteri Kesihatan, dibantu Timbalan Menteri.",
       "Ketua Setiausaha (KSU) mengetuai pentadbiran, kewangan dan sumber manusia.",
       "Ketua Pengarah Kesihatan (KPK) mengetuai hal teknikal dan profesional kesihatan.",
       "Program utama: Perubatan, Kesihatan Awam, Penyelidikan dan Sokongan Teknikal, Kesihatan Pergigian, Perkhidmatan Farmasi, Keselamatan dan Kualiti Makanan, serta Pengurusan.",
       "Di peringkat negeri: Jabatan Kesihatan Negeri (JKN), kemudian hospital, Pejabat Kesihatan Daerah dan klinik kesihatan.",
       "Makmal hospital di bawah Program Perubatan; MKAK di bawah Program Kesihatan Awam."],
    t:"Tahu nama terkini Menteri, KSU, KPK dan Pengarah MKAK, serta kepada siapa MKAK melapor. Semak di laman web KKM sebelum temuduga." },

  { k:"Peringkat Kementerian", s:"Bagaimanakah perkhidmatan patologi dan makmal disusun di seluruh KKM?",
    a:"Perkhidmatan makmal KKM terdiri daripada **makmal hospital**, **makmal klinik kesihatan** untuk ujian asas, dan **Makmal Kesihatan Awam** untuk pengawasan penyakit, makanan dan air. Pusat rujukan kebangsaan ialah **IMR dan MKAK**, tempat saya bertugas. Semuanya dihubungkan melalui **sistem rujukan**, iaitu ujian khusus dihantar ke makmal rujukan supaya sumber tidak bertindih. Hal ehwal **profesion JTMP diselaraskan** di peringkat kementerian.",

    kw:"Rangkaian Makmal",

    j:["Makmal hospital: hospital negeri, hospital pakar dan hospital tanpa pakar, dengan skop ujian yang berbeza.",

       "Hal ehwal profesion JTMP diselaras di peringkat kementerian oleh bahagian yang menjaga sains kesihatan bersekutu."],
    t:"Terangkan dari fasiliti mana Unit TB MKAK menerima spesimen, dan ujian TB apa yang dirujuk kepada unit anda." },

  { k:"Peringkat Kementerian", s:"Apakah yang anda tahu tentang Kertas Putih Kesihatan?",
    a:"**Kertas Putih Kesihatan** ialah dokumen **hala tuju pembaharuan** sistem kesihatan negara untuk tempoh **15 tahun**, yang **diluluskan Parlimen pada 2023**. Ia mempunyai empat tonggak: **transformasi penyampaian perkhidmatan**, **promosi kesihatan dan pencegahan penyakit**, **pembiayaan yang mampan**, serta **pengukuhan asas dan tadbir urus**. Peranan saya ialah menyokong pelaksanaannya di peringkat fasiliti.",

       "Kaitan dengan makmal: pendigitalan dan perkongsian rekod, kerjasama awam-swasta, penggunaan sumber yang lebih cekap.",
       "Peranan anda: menyokong pelaksanaan di peringkat fasiliti dan menerangkan perubahan kepada staf."],

  { k:"Peringkat Kementerian", s:"Kementerian mengeluarkan dasar atau arahan baharu. Bagaimanakah anda melaksanakannya di tempat anda?",
    a:"Saya akan **membaca pekeliling asal** dan memahaminya, kemudian **berbincang dengan ketua jabatan** tentang kesannya kepada makmal. Saya menyediakan **pelan pelaksanaan**, memberi **taklimat kepada staf** dan **mengemas kini SOP**. Selepas itu saya **memantau pematuhan** dan melaporkan status kepada JKN atau kementerian. Sebarang kekangan dikemukakan sebagai **maklum balas melalui saluran rasmi**.",

    j:["Keputusan makmal yang tepat dan cepat menyokong diagnosis, rawatan dan keselamatan pesakit.",

    t:"Jawab dengan jelas dan yakin, bukan separuh-separuh. Jika ada kekangan sebenar, fikirkan dan putuskan sebelum temuduga, bukan di hadapan panel." },
