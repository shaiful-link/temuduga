/* =====================================================================
   APP LOGIC
   ===================================================================== */
var $ = function(id){ return document.getElementById(id); };

var state = {
  job: null,        // selected job
  company: null,    // selected company (only for jobs with a company list)
  cat: null,        // selected category (null = all)
  tab: "quiz",      // setup screen tab: "quiz" (A/B practice), "notes" (answers) or "mine" (own notes)
  queue: [], idx: 0,
  find: "",         // keyword typed in the mind-map search box
  lang: "ms",       // language for jobs that have two languages
  shown: false      // is the answer of the current question showing?
};

/* --- Current language text --- */
function curLang(){ var j = state.job; return j ? (j.langs ? state.lang : j.lang) : "en"; }
function T(){ return TEXT[curLang()]; }
/* Text of a question / job in the current language (falls back to the main text) */
function F(q, f){ var v = curLang() === "ms" ? q[f + "_ms"] : undefined; return v === undefined ? q[f] : v; }
/* Mind-map branches in the current language: icons are shared, text is translated */
function MB(q){ var t = curLang() === "ms" ? q.m_ms : null; return q.m.map(function(x, i){ return [x[0], t && t[i] ? t[i] : x[1]]; }); }
function catLabel(k){ var j = state.job; return (curLang() === "ms" && j.kat_ms && j.kat_ms[k]) || k; }
function catLine(q){ return catLabel(q.k) + (q.c ? " \u2022 " + q.c : ""); }
function setLang(l){ state.lang = l; applyText(); }

/* --- Apply UI language based on selected job --- */
function applyText(){
  var t = T();
  document.documentElement.lang = curLang();
  $("hTitle").textContent = state.job ? t.title : "Mock Interview / Latihan Temuduga";
  $("hSub").textContent = state.job ? t.sub : "Pilih jawatan / Select a role";
  $("lblPicked").textContent = t.picked;  $("lblCompany").textContent = t.company;
  $("lblCat").textContent = t.cat;        $("btnStart").textContent = t.start;
  $("btnBack").textContent = t.back;      $("lblPanel").textContent = t.panel;
  $("tabQuiz").textContent = t.tabQuiz;   $("tabNotes").textContent = t.tabNotes;
  $("tabMine").textContent = t.tabMine;   $("lblMine").textContent = t.lblMine;
  $("mineText").placeholder = t.minePh;   $("mineHint").textContent = t.mineHint;
  $("btnMineCopy").textContent = t.mineCopy; $("btnMineFile").textContent = t.mineFile;
  $("btnShow").textContent = t.showAns;   $("lblAns").textContent = t.ans;
  $("btnPrev").textContent = t.prev;      $("endTitle").textContent = t.end;
  $("btnRetry").textContent = t.retry;
  $("btnRestart").textContent = t.restart; $("footText").textContent = state.job ? ((curLang() === "ms" && state.job.foot_ms) || t.foot) : "";
}

function show(screen){
  ["scrMenu","scrSetup","scrQuiz","scrEnd"].forEach(function(s){ $(s).classList.toggle("hidden", s !== screen); });
  $("btnHome").classList.toggle("hidden", screen === "scrMenu");
  window.scrollTo(0, 0);
}

/* --- Screen 0: main menu of jobs --- */
function renderMenu(){
  var box = $("jobList"); box.innerHTML = "";
  JOBS.forEach(function(job){
    var b = document.createElement("button"); b.className = "job";
    var ico = document.createElement("span"); ico.className = "ico"; ico.textContent = job.ikon;
    var txt = document.createElement("span");
    var n = document.createElement("b"); n.textContent = job.nama;
    var d = document.createElement("span"); d.className = "d"; d.textContent = job.butiran;
    var l = document.createElement("span"); l.className = "d";
    l.textContent = (job.langs ? "Bahasa Melayu + English" : (job.lang === "ms" ? "Bahasa Melayu" : "English")) + " \u2022 " + job.soalan.length + TEXT[job.lang].questions;
    txt.appendChild(n); txt.appendChild(d); txt.appendChild(l);
    var go = document.createElement("span"); go.className = "go"; go.textContent = "\u203A";
    b.appendChild(ico); b.appendChild(txt); b.appendChild(go);
    b.onclick = function(){ selectJob(job); };
    box.appendChild(b);
  });
}

function selectJob(job){
  state.job = job;
  state.find = "";
  state.company = job.syarikat ? (job.syarikatLalai || job.syarikat[0]) : null;
  state.lang = job.langs ? job.langs[0] : job.lang;
  state.cat = null;
  state.tab = "quiz";
  applyText();
  renderSetup();
  show("scrSetup");
}

/* --- Screen 1: company and category --- */
function renderSetup(){
  var job = state.job;
  $("pickedJob").innerHTML = "";
  $("pickedJob").appendChild(document.createTextNode(F(job, "nama")));
  var sm = document.createElement("small"); sm.textContent = F(job, "butiran"); $("pickedJob").appendChild(sm);

  // Language chips (only for jobs with two languages)
  $("langCard").classList.toggle("hidden", !job.langs);
  var lbox = $("langList"); lbox.innerHTML = "";
  (job.langs || []).forEach(function(l){
    var b = document.createElement("button");
    b.className = "chip" + (l === state.lang ? " on" : "");
    b.textContent = l === "ms" ? "Bahasa Melayu" : "English";
    b.onclick = function(){ setLang(l); renderSetup(); };
    lbox.appendChild(b);
  });

  // Company chips (only if the job has a company list)
  $("companyCard").classList.toggle("hidden", !job.syarikat);
  var cbox = $("companyList"); cbox.innerHTML = "";
  (job.syarikat || []).forEach(function(c){
    var b = document.createElement("button");
    b.className = "chip" + (c === state.company ? " on" : "");
    b.textContent = c;
    b.onclick = function(){ state.company = c; renderSetup(); };
    cbox.appendChild(b);
  });

  // Category chips
  var cats = [];
  companyQuestions().forEach(function(q){ if (cats.indexOf(q.k) < 0) cats.push(q.k); });
  var box = $("catList"); box.innerHTML = "";
  [null].concat(cats).forEach(function(c){
    var b = document.createElement("button");
    b.className = "chip" + (c === state.cat ? " on" : "");
    b.textContent = c === null ? T().all : catLabel(c);
    b.onclick = function(){ state.cat = c; renderSetup(); };
    box.appendChild(b);
  });
  // Tabs: practice shows the Start button, notes shows the answer list
  var notes = state.tab === "notes", mine = state.tab === "mine";
  $("tabQuiz").classList.toggle("on", state.tab === "quiz");
  $("tabNotes").classList.toggle("on", notes);
  $("tabMine").classList.toggle("on", mine);
  $("mineBox").classList.toggle("hidden", !mine);
  $("mineList").classList.toggle("hidden", !mine);
  if (mine) { renderMineList(); loadMine(); }
  $("btnStart").classList.toggle("hidden", notes || mine);
  $("notesBox").classList.toggle("hidden", !notes);
  $("countInfo").textContent = pickQuestions().length + (notes ? T().notesInfo : mine ? T().mineInfo : T().count);
  if (notes) renderNotes();
}

/* --- My Notes tab: the user's own notes, kept in this browser (localStorage), one per job --- */
function mineKey(){ return "temuduga-nota-" + state.job.id; }
function loadMine(){
  var v = "";
  try { v = localStorage.getItem(mineKey()) || ""; } catch (e) {}
  $("mineText").value = v;
  $("mineSaved").textContent = v ? T().mineSaved : "";
}
function saveMine(){
  try { localStorage.setItem(mineKey(), $("mineText").value); $("mineSaved").textContent = T().mineSaved; }
  catch (e) { $("mineSaved").textContent = T().mineFail; }
}
/* --- Notes tied to a question: one saved object per job, keyed by a hash of the question text --- */
function qId(q){ var h = 5381, t = q.s; for (var i = 0; i < t.length; i++) { h = ((h << 5) + h + t.charCodeAt(i)) >>> 0; } return "q" + h; }
function qKey(){ return "temuduga-qnota-" + state.job.id; }
function qAll(){ try { return JSON.parse(localStorage.getItem(qKey()) || "{}") || {}; } catch (e) { return {}; } }
function qGet(q){ return qAll()[qId(q)] || ""; }
function qSet(q, text){
  var all = qAll();
  if (text.trim()) { all[qId(q)] = text; } else { delete all[qId(q)]; }
  try { localStorage.setItem(qKey(), JSON.stringify(all)); return true; } catch (e) { return false; }
}
/* Small "my note" block (used in Answer Notes and after answering A/B) */
function fillMyNote(el, q){
  var v = qGet(q); el.innerHTML = "";
  if (v) { var b = document.createElement("b"); b.textContent = "\uD83D\uDCDD " + T().myTag; el.appendChild(b); el.appendChild(document.createTextNode(v)); }
  el.classList.toggle("hidden", !v);
}
/* My Notes tab: every question with its own note box */
function renderMineList(){
  var box = $("mineList"); box.innerHTML = "";
  var lastCat = null;
  pickQuestions().forEach(function(q, i){
    var cat = catLine(q);
    if (cat !== lastCat) { var h = document.createElement("p"); h.className = "notehead"; h.textContent = cat; box.appendChild(h); lastCat = cat; }
    var n = document.createElement("div"); n.className = "note";
    var em = document.createElement("span"); em.className = "em"; em.textContent = q.e || "\u2022";
    var body = document.createElement("div"); body.className = "body";
    var nq = document.createElement("p"); nq.className = "na"; nq.textContent = (i + 1) + ". " + F(q, "s");
    var ta = document.createElement("textarea"); ta.className = "qnote"; ta.placeholder = T().qPh; ta.value = qGet(q);
    var st = document.createElement("p"); st.className = "qsaved";
    ta.oninput = function(){ st.textContent = qSet(q, ta.value) ? T().qSaved : T().mineFail; };
    body.appendChild(nq); body.appendChild(ta); body.appendChild(st);
    n.appendChild(em); n.appendChild(body); box.appendChild(n);
  });
}
/* Text for copy / backup file: every question that has a note, then the general notes */
function mineExport(){
  var out = [F(state.job, "nama"), ""], n = 0;
  state.job.soalan.forEach(function(q){ var v = qGet(q); if (v) { n++; out.push(n + ". " + F(q, "s") + (q.c ? " [" + q.c + "]" : ""), v, ""); } });
  var g = $("mineText").value;
  if (g.trim()) { out.push("--- " + T().lblMine + " ---", g); }
  return out.join("\n");
}
function copyMine(){
  var ta = $("mineText"), text = mineExport();
  function done(){ $("btnMineCopy").textContent = T().mineCopied; setTimeout(function(){ $("btnMineCopy").textContent = T().mineCopy; }, 1500); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function(){ ta.select(); document.execCommand("copy"); done(); });
  } else { ta.select(); document.execCommand("copy"); done(); }
}
function fileMine(){
  var blob = new Blob([mineExport()], { type: "text/plain;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nota-" + state.job.id + ".txt";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

/* --- Mind map colours --- */
var BR = [["#d9480f","#fff1e6"],["#1971c2","#e7f1fb"],["#2f9e44","#e9f6ec"],["#9c36b5","#f5eafa"],["#e03131","#fdecec"],["#0c8599","#e3f5f7"]]; // branch: [line, fill]
var CC = ["#0f5c63","#7a3e9d","#b4581a","#1f5fa8","#2e7d4f","#a23b3b","#5a5f73"];   // one colour per category
function catColor(q){
  var cats = [];
  state.job.soalan.forEach(function(x){ if (cats.indexOf(x.k) < 0) cats.push(x.k); });
  return CC[cats.indexOf(q.k) % CC.length];
}

/* Build one mind map: keyword in the centre, one coloured branch per key point */
function buildMM(q){
  var mm = document.createElement("div"); mm.className = "mm"; mm.style.setProperty("--cc", catColor(q));
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  var c = document.createElement("div"); c.className = "mmc";
  var ce = document.createElement("span"); ce.className = "e"; ce.textContent = q.e || "";
  c.appendChild(ce); c.appendChild(document.createTextNode(F(q, "kw")));
  var bs = document.createElement("div"); bs.className = "mmb";
  MB(q).forEach(function(it, i){
    var col = BR[i % BR.length];
    var n = document.createElement("div"); n.className = "mmn";
    n.style.setProperty("--c", col[0]); n.style.setProperty("--b", col[1]);
    var e = document.createElement("span"); e.className = "e"; e.textContent = it[0];
    var t = document.createElement("span"); t.textContent = it[1];
    n.appendChild(e); n.appendChild(t); bs.appendChild(n);
  });
  mm.appendChild(svg); mm.appendChild(c); mm.appendChild(bs);
  return mm;
}
/* Draw the curved lines from the centre to each branch (needs the map to be visible) */
function drawMM(mm){
  var svg = mm.querySelector("svg"), c = mm.querySelector(".mmc"), box = mm.getBoundingClientRect();
  if (!box.width) return;
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  var cr = c.getBoundingClientRect();
  var x1 = cr.right - box.left, y1 = cr.top + cr.height / 2 - box.top;
  Array.prototype.forEach.call(mm.querySelectorAll(".mmn"), function(n, i){
    var r = n.getBoundingClientRect();
    var x2 = r.left - box.left, y2 = r.top + r.height / 2 - box.top, dx = (x2 - x1) * 0.55;
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", "M" + x1 + " " + y1 + " C" + (x1 + dx) + " " + y1 + " " + (x2 - dx) + " " + y2 + " " + x2 + " " + y2);
    p.setAttribute("fill", "none"); p.setAttribute("stroke", BR[i % BR.length][0]);
    p.setAttribute("stroke-width", "2.5"); p.setAttribute("stroke-linecap", "round");
    svg.appendChild(p);
  });
}
function drawAllMM(){ Array.prototype.forEach.call(document.querySelectorAll(".mm"), drawMM); }
window.addEventListener("resize", drawAllMM);

/* --- Mind Maps tab: search box + one mind map per question (correct answers only) --- */
function renderNotes(){
  var box = $("notesBox"); box.innerHTML = "";
  var inp = document.createElement("input"); inp.type = "search"; inp.className = "find";
  inp.placeholder = T().findPh; inp.value = state.find || "";
  var list = document.createElement("div");
  inp.oninput = function(){ state.find = inp.value; renderNoteList(list); };
  box.appendChild(inp); box.appendChild(list);
  renderNoteList(list);
}
function renderNoteList(box){
  box.innerHTML = "";
  var f = (state.find || "").trim().toLowerCase();
  var lastCat = null, shown = 0;
  pickQuestions().forEach(function(q, i){
    if (f) {
      var hay = (F(q, "kw") + " " + F(q, "s") + " " + F(q, "a") + " " + MB(q).map(function(x){ return x[1]; }).join(" ")).toLowerCase();
      if (hay.indexOf(f) < 0) return;
    }
    shown++;
    var cat = catLine(q);
    if (cat !== lastCat) {
      var h = document.createElement("p"); h.className = "notehead"; h.style.setProperty("--cc", catColor(q));
      h.appendChild(document.createElement("i")); h.appendChild(document.createTextNode(cat));
      box.appendChild(h); lastCat = cat;
    }
    var n = document.createElement("div"); n.className = "mcard"; n.style.setProperty("--cc", catColor(q));
    var nq = document.createElement("p"); nq.className = "nq"; nq.textContent = (i + 1) + ". " + F(q, "s");
    var my = document.createElement("div"); my.className = "mynote"; fillMyNote(my, q);
    var d = document.createElement("details");
    var sm = document.createElement("summary"); sm.textContent = T().more;
    var ap = document.createElement("p"); ap.className = "ansp"; ap.style.marginTop = "8px"; rich(ap, F(q, "a"));
    d.appendChild(sm); d.appendChild(ap);
    n.appendChild(nq); n.appendChild(buildMM(q)); n.appendChild(my); n.appendChild(d);
    box.appendChild(n);
  });
  if (!shown) { var e = document.createElement("p"); e.className = "nohit"; e.textContent = T().noHit; box.appendChild(e); }
  drawAllMM();
}

/* Questions for the selected company: general ones + that company's own (kept in file order) */
function companyQuestions(){
  return state.job.soalan.filter(function(q){ return !q.c || q.c === state.company; });
}
function pickQuestions(){
  return companyQuestions().filter(function(q){ return state.cat === null || q.k === state.cat; });
}

/* Write text with **keywords** in bold (safe: builds elements, no HTML from the data) */
function rich(el, text){
  el.innerHTML = "";
  text.split("**").forEach(function(part, i){
    if (!part) return;
    if (i % 2) { var b = document.createElement("b"); b.textContent = part; el.appendChild(b); }
    else { el.appendChild(document.createTextNode(part)); }
  });
}

/* --- Screen 2: question session (questions stay in order) --- */
function startSession(list){
  if (!list.length) return;
  state.queue = list.slice();
  state.idx = 0;
  show("scrQuiz");
  renderQuestion();
}

function renderQuestion(){
  var q = state.queue[state.idx];
  $("qCat").textContent = catLine(q);
  $("qNum").textContent = T().qn + (state.idx + 1) + " / " + state.queue.length;
  $("qBar").style.width = ((state.idx + 1) / state.queue.length * 100) + "%";
  $("qText").textContent = F(q, "s");
  var kw = $("qKw"); kw.innerHTML = ""; kw.style.setProperty("--cc", catColor(q));
  kw.appendChild(document.createTextNode(T().kwLabel));
  var kb = document.createElement("b"); kb.textContent = (q.e ? q.e + " " : "") + F(q, "kw"); kw.appendChild(kb);
  $("ansBox").classList.add("hidden");
  $("rowShow").classList.remove("hidden");
  state.shown = false;
  var bl = $("btnLang");                       // switch language in the middle of a session
  bl.classList.toggle("hidden", !state.job.langs);
  bl.textContent = state.lang === "ms" ? "English" : "Bahasa Melayu";
  $("btnPrev").disabled = state.idx === 0;
  $("btnPrev").style.opacity = state.idx === 0 ? ".4" : "1";
  $("btnNext").textContent = state.idx + 1 >= state.queue.length ? T().finish : T().next;
}

/* Show the answer in full sentences (keywords bold), then the mind map below it */
function showAnswer(){
  var q = state.queue[state.idx];
  rich($("ansText"), F(q, "a"));
  var mmBox = $("ansMM"); mmBox.innerHTML = ""; mmBox.appendChild(buildMM(q));
  $("ansTip").textContent = T().tip + F(q, "t");
  state.shown = true;
  fillMyNote($("ansMine"), q);
  $("rowShow").classList.add("hidden");
  $("ansBox").classList.remove("hidden");
  drawAllMM();
}

function nextQuestion(){
  state.idx++;
  if (state.idx >= state.queue.length) { endSession(); } else { renderQuestion(); window.scrollTo(0, 0); }
}
function prevQuestion(){
  if (state.idx > 0) { state.idx--; renderQuestion(); window.scrollTo(0, 0); }
}

/* --- Screen 3: end of session --- */
function endSession(){
  $("endInfo").textContent = state.queue.length + T().endInfo;
  show("scrEnd");
}

function goMenu(){ state.job = null; applyText(); renderMenu(); show("scrMenu"); }

/* --- Buttons --- */
$("btnStart").onclick   = function(){ startSession(pickQuestions()); };
$("btnBack").onclick    = goMenu;
$("tabQuiz").onclick    = function(){ state.tab = "quiz"; renderSetup(); };
$("tabNotes").onclick   = function(){ state.tab = "notes"; renderSetup(); };
$("tabMine").onclick    = function(){ state.tab = "mine"; renderSetup(); };
$("mineText").oninput   = saveMine;
$("btnMineCopy").onclick = copyMine;
$("btnMineFile").onclick = fileMine;
$("btnShow").onclick    = showAnswer;
$("btnLang").onclick    = function(){ var was = state.shown; setLang(state.lang === "ms" ? "en" : "ms"); renderQuestion(); if (was) showAnswer(); };
$("btnNext").onclick    = nextQuestion;
$("btnPrev").onclick    = prevQuestion;
$("btnRetry").onclick   = function(){ startSession(state.queue); };
$("btnRestart").onclick = goMenu;
$("btnHome").onclick    = goMenu;

goMenu();
</script>
