<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Interview / Latihan Temuduga</title>
<style>
  :root{
    --bg:#f4f1ea; --card:#ffffff; --ink:#1d2a2e; --muted:#5d6b70;
    --main:#0f5c63; --main-dark:#0a4348; --soft:#e3efef;
    --ok:#2e7d4f; --ok-soft:#e4f3ea; --bad:#b3372b; --bad-soft:#fbe9e7; --line:#d9d4c8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  header{background:var(--main);color:#fff;padding:18px 16px}
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
  header h1{margin:0;font-size:1.15rem;letter-spacing:.2px}
  header small{opacity:.85;display:block;font-weight:400;font-size:.8rem}
  .wrap{max-width:760px;margin:0 auto}
  main{padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  h2{font-size:1.05rem;margin:0 0 10px}
  .label{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 8px}
  .jobs{display:grid;gap:10px}
  .job{border:2px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit;width:100%;display:flex;gap:14px;align-items:center}
  .job:hover{border-color:var(--main);background:var(--soft)}
  .job .ico{flex:0 0 46px;height:46px;border-radius:12px;background:var(--main);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
  .job b{display:block}
  .job span.d{font-size:.85rem;color:var(--muted);display:block}
  .job .go{margin-left:auto;color:var(--main);font-size:1.3rem}
  .picked{font-weight:600;font-size:1.05rem}
  .picked small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:.85rem;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--main);border-color:var(--main);color:#fff}
  button.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--main);color:#fff}
  button.btn:hover{background:var(--main-dark)}
  button.btn.ghost{background:#fff;color:var(--main);border:1px solid var(--main)}
  button.btn.small{padding:7px 12px;font-size:.85rem;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4)}
  .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);margin-bottom:10px}
  .badge{background:var(--soft);color:var(--main-dark);border-radius:999px;padding:4px 11px;font-weight:600;font-size:.8rem}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
  .bar i{display:block;height:100%;background:var(--main);width:0;transition:width .3s}
  .question{font-size:1.25rem;font-weight:600;margin:6px 0 14px}

  /* A / B answer options */
  .opts{display:grid;gap:10px}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
  .opt:hover:not(:disabled){border-color:var(--main);background:var(--soft)}
  .opt .let{flex:0 0 34px;height:34px;border-radius:50%;background:var(--main);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
  .opt:disabled{cursor:default}
  .opt.right{border-color:var(--ok);background:var(--ok-soft)}
  .opt.right .let{background:var(--ok)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrong .let{background:var(--bad)}
  .opt.dim{opacity:.55}

  .verdict{font-weight:700;font-size:1.1rem;margin:16px 0 0}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
  .answer{border-left:5px solid var(--main);background:var(--soft);border-radius:0 12px 12px 0;padding:14px 16px;margin-top:10px}
  .answer .short{font-weight:600;margin:0 0 8px}
  .answer ul{margin:6px 0 0;padding-left:20px}
  .answer li{margin-bottom:6px}
  .tip{margin-top:12px;background:#fff7e6;border:1px solid #f0dcae;border-radius:10px;padding:10px 12px;font-size:.9rem}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
  .stats div{background:var(--soft);border-radius:12px;padding:12px 6px}
  .stats b{display:block;font-size:1.5rem;color:var(--main-dark)}
  .stats span{font-size:.8rem;color:var(--muted)}
  ol.review{padding-left:20px;margin:8px 0 0}
  ol.review li{margin-bottom:6px}
  /* Tabs + notes */
  .tabs{display:flex;gap:6px;background:#e6e1d6;border-radius:12px;padding:5px;margin-bottom:14px}
  .tab{flex:1;border:0;background:transparent;border-radius:9px;padding:10px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
  .tab.on{background:#fff;color:var(--main-dark);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .notehead{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--main-dark);margin:18px 4px 8px}
  .note{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .note .em{flex:0 0 44px;height:44px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:1.5rem}
  .note .nq{font-size:.82rem;color:var(--muted);margin:0 0 3px}
  .note .na{font-weight:600;margin:0}
  .note details{margin-top:6px;font-size:.9rem}
  .note summary{cursor:pointer;color:var(--main);font-size:.82rem}
  .note ul{margin:6px 0 0;padding-left:18px}
  textarea.qnote{width:100%;min-height:74px;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;font-size:.92rem;resize:vertical;background:#fcfbf8;margin-top:6px}
  textarea.qnote:focus{outline:2px solid var(--main);border-color:transparent}
  .note .body{flex:1;min-width:0}
  .qsaved{font-size:.78rem;color:var(--ok);font-weight:600;min-height:1.1em;margin:2px 0 0}
  .mynote{background:#eaf1fb;border:1px solid #c5d6ee;border-radius:10px;padding:9px 11px;margin-top:8px;font-size:.9rem;white-space:pre-wrap}
  .mynote b{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.6px;color:#2f5387;margin-bottom:2px}
  textarea.mine{width:100%;min-height:160px;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;resize:vertical;background:#fcfbf8}
  textarea.mine:focus{outline:2px solid var(--main);border-color:transparent}
  .saved{font-size:.83rem;color:var(--ok);font-weight:600;margin-top:6px;min-height:1.2em}
  .hint{font-size:.83rem;color:var(--muted);margin-top:6px}
  .hidden{display:none}
  footer{text-align:center;font-size:.78rem;color:var(--muted);padding:6px 16px 26px}
  @media (max-width:480px){.question{font-size:1.1rem}.row .btn{flex:1 1 100%}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1><span id="hTitle">Mock Interview</span><small id="hSub"></small></h1>
    <button class="btn small hidden" id="btnHome">Menu</button>
  </div>
</header>

<main class="wrap">

  <!-- ========== SCREEN 0: MAIN MENU (select job) ========== -->
  <section id="scrMenu">
    <div class="card">
      <p class="label">Menu &mdash; Pilih jawatan / Select a role</p>
      <div class="jobs" id="jobList"></div>
    </div>
  </section>

  <!-- ========== SCREEN 1: SETUP (company + category) ========== -->
  <section id="scrSetup" class="hidden">
    <div class="card">
      <p class="label" id="lblPicked"></p>
      <div class="picked" id="pickedJob"></div>
    </div>
    <div class="tabs">
      <button class="tab on" id="tabQuiz"></button>
      <button class="tab" id="tabNotes"></button>
      <button class="tab" id="tabMine"></button>
    </div>
    <div class="card" id="companyCard">
      <p class="label" id="lblCompany"></p>
      <div class="chips" id="companyList"></div>
    </div>
    <div class="card" id="catCard">
      <p class="label" id="lblCat"></p>
      <div class="chips" id="catList"></div>
      <p class="hint" id="countInfo"></p>
      <div class="row">
        <button class="btn" id="btnStart"></button>
        <button class="btn ghost" id="btnBack"></button>
      </div>
    </div>
    <!-- Notes tab: correct answers only -->
    <div id="notesBox" class="hidden"></div>
    <!-- My Notes tab: user's own notes, saved on this phone/browser -->
    <div id="mineList" class="hidden"></div>
    <div class="card hidden" id="mineBox">
      <p class="label" id="lblMine"></p>
      <textarea class="mine" id="mineText"></textarea>
      <p class="saved" id="mineSaved"></p>
      <p class="hint" id="mineHint"></p>
      <div class="row">
        <button class="btn" id="btnMineCopy"></button>
        <button class="btn ghost" id="btnMineFile"></button>
      </div>
    </div>
  </section>

  <!-- ========== SCREEN 2: QUESTION (A or B) ========== -->
  <section id="scrQuiz" class="hidden">
    <div class="card">
      <div class="meta">
        <span class="badge" id="qCat"></span>
        <span id="qNum"></span>
      </div>
      <div class="bar"><i id="qBar"></i></div>
      <p class="label" id="lblPanel"></p>
      <div class="question" id="qText"></div>

      <p class="label" id="lblChoose"></p>
      <div class="opts">
        <button class="opt" id="optA"><span class="let">A</span><span id="optAText"></span></button>
        <button class="opt" id="optB"><span class="let">B</span><span id="optBText"></span></button>
      </div>

      <div id="ansBox" class="hidden">
        <p class="verdict" id="verdict"></p>
        <div class="answer">
          <p class="label" id="lblAns"></p>
          <p class="short" id="ansShort"></p>
          <ul id="ansList"></ul>
          <div class="tip" id="ansTip"></div>
          <div class="mynote hidden" id="ansMine"></div>
        </div>
        <div class="row">
          <button class="btn" id="btnNext"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== SCREEN 3: SUMMARY ========== -->
  <section id="scrEnd" class="hidden">
    <div class="card">
      <h2 id="endTitle"></h2>
      <div class="stats">
        <div><b id="sGood">0</b><span id="lblSGood"></span></div>
        <div><b id="sBad">0</b><span id="lblSBad"></span></div>
        <div><b id="sScore">0%</b><span id="lblSScore"></span></div>
      </div>
      <div id="reviewBox" class="hidden">
        <p class="label" style="margin-top:16px" id="lblReview"></p>
        <ol class="review" id="reviewList"></ol>
      </div>
      <div class="row">
        <button class="btn hidden" id="btnRetry"></button>
        <button class="btn ghost" id="btnRestart"></button>
      </div>
    </div>
  </section>

</main>

<footer id="footText"></footer>

  { k:"Teknikal Makmal", s:"Apakah tindakan anda jika keputusan IQC berada di luar had kawalan?",
    ok:"Tahan keputusan pesakit, cari punca, betulkan, ulang IQC dan nilai semula sampel yang terjejas.",
    ng:"Ulang IQC sehingga lulus, kemudian teruskan mengeluarkan keputusan pesakit.",
    e:"🛑",
    j:["Hentikan pengeluaran keputusan pesakit bagi ujian tersebut.",
       "Semak punca mudah: bahan kawalan (luput, cara simpan, cara bancuh), reagen, kalibrasi, penyelenggaraan alat.",
       "Rujuk peraturan Westgard: 1-3s dan R-4s menunjukkan ralat rawak; 2-2s, 4-1s dan 10x menunjukkan ralat sistematik.",
       "Ulang IQC selepas tindakan pembetulan; jika masih gagal, kalibrasi semula atau hubungi jurutera.",
       "Nilai semula sampel pesakit yang diuji sejak IQC terakhir yang lulus.",
       "Rekod kejadian dan tindakan pembetulan dalam log IQC."],
    t:"Tekankan: jangan ulang IQC berkali-kali sehingga lulus tanpa mencari punca." },

  { k:"Teknikal Makmal", s:"Terangkan tiga fasa dalam proses ujian makmal. Fasa manakah paling banyak berlaku kesilapan?",
    ok:"Pra-analitikal, analitikal, pasca-analitikal; kesilapan paling banyak di fasa pra-analitikal.",
    ng:"Pra-analitikal, analitikal, pasca-analitikal; kesilapan paling banyak di fasa analitikal.",
    e:"3️⃣",
    j:["Pra-analitikal: permintaan ujian, pengenalan pesakit, pengambilan, pelabelan, pengangkutan dan penerimaan spesimen.",
       "Analitikal: proses menguji termasuk IQC, kalibrasi dan prestasi alat.",
       "Pasca-analitikal: semakan dan pengesahan keputusan, pelaporan, makluman nilai kritikal, penyimpanan spesimen.",
       "Kebanyakan kesilapan berlaku pada fasa pra-analitikal kerana melibatkan ramai pihak di luar makmal.",
       "Kawalan: kriteria penolakan spesimen, latihan kepada wad, pemantauan petunjuk kualiti."],
    t:"Beri contoh kesilapan pra-analitikal di tempat anda dan cara anda mengurangkannya." },

  { k:"Teknikal Makmal", s:"Bagaimanakah anda menguruskan keputusan nilai kritikal (critical value)?",
    ok:"Sahkan keputusan, maklum segera kepada doktor, guna read-back dan rekod.",
    ng:"Masukkan keputusan dalam sistem seperti biasa; doktor akan melihatnya semasa semakan.",
    e:"📞",
    j:["Sahkan keputusan dahulu: semak IQC, keadaan spesimen (hemolisis, beku), ulang ujian jika perlu.",
       "Maklumkan segera kepada doktor atau jururawat yang merawat dalam tempoh yang ditetapkan dalam SOP.",
       "Guna kaedah baca semula (read-back) untuk memastikan maklumat diterima dengan betul.",
       "Rekod: nama pesakit, keputusan, masa, nama pemberi dan penerima maklumat.",
       "Pantau pematuhan makluman nilai kritikal sebagai petunjuk kualiti."],
    t:"Sebut contoh ujian, misalnya kalium, glukosa, hemoglobin atau platelet yang sangat rendah." },

  { k:"Teknikal Makmal", s:"Apakah kriteria penolakan spesimen dan bagaimana anda mengurangkan kadar penolakan?",
    ok:"Tolak ikut kriteria (label, bekas, isipadu, hemolisis), maklum wad, analisis data dan latih wad.",
    ng:"Terima semua spesimen supaya pesakit tidak dicucuk semula, dan catat ulasan pada keputusan.",
    e:"🧪",
    j:["Kriteria biasa: tiada label atau label tidak sepadan dengan borang, bekas salah, isipadu tidak cukup.",
       "Juga: spesimen hemolisis, beku, tumpah, lewat sampai atau suhu pengangkutan tidak betul.",
       "Tindakan: maklum kepada wad dengan segera, rekod penolakan dan minta spesimen baharu.",
       "Pencegahan: analisis data penolakan mengikut wad dan punca.",
       "Beri maklum balas dan latihan kepada wad, sediakan panduan pengambilan spesimen."],
    t:"Spesimen yang sukar diulang (contoh CSF) dikendalikan mengikut budi bicara dan SOP, bukan terus ditolak." },

  { k:"Teknikal Makmal", s:"Bagaimanakah anda memantau dan menambah baik masa pusingan ujian (TAT)?",
    ok:"Tetapkan sasaran, pantau melalui LIS, analisis punca kelewatan dan baiki aliran kerja.",
    ng:"TAT bergantung pada wad dan alat, jadi tidak perlu dipantau oleh makmal.",
    e:"⏱️",
    j:["Tetapkan sasaran TAT bagi ujian segera dan rutin, dan pantau melalui LIS setiap bulan.",
       "Analisis punca kelewatan: penghantaran spesimen, pendaftaran, kerosakan alat, kekurangan staf, pengesahan lewat.",
       "Tindakan: susun semula aliran kerja, agih staf mengikut waktu puncak, penyelenggaraan berjadual.",
       "Sediakan alat sandaran atau makmal rujukan sandaran.",
       "Bentang prestasi TAT dalam mesyuarat jabatan dan kepada pelanggan."],
    t:"Jika ada, kongsi data TAT sebenar unit anda." },

  { k:"Teknikal Makmal", s:"Apakah MS ISO 15189 dan mengapa ia penting kepada makmal perubatan?",
    ok:"Piawaian kualiti dan kecekapan makmal perubatan; akreditasi oleh Jabatan Standard Malaysia (SAMM).",
    ng:"Piawaian pengurusan alam sekitar untuk hospital; pensijilan oleh pihak pembekal alat.",
    e:"📜",
    j:["Piawaian antarabangsa bagi makmal perubatan: keperluan kualiti dan kecekapan (versi terkini ISO 15189:2022).",
       "Merangkumi keperluan pengurusan dan teknikal: personel, peralatan, proses pra-analitikal hingga pasca-analitikal, pengurusan risiko.",
       "Akreditasi di Malaysia diberi oleh Jabatan Standard Malaysia melalui Skim Akreditasi Makmal Malaysia (SAMM).",
       "Kepentingan: keputusan boleh dipercayai, keselamatan pesakit, keyakinan pelanggan, penambahbaikan berterusan.",
       "Peranan penyelia: pastikan SOP dipatuhi, rekod lengkap, audit dalaman dan tindakan pembetulan dilaksana."],
    t:"Nyatakan status akreditasi makmal anda dan peranan anda semasa audit." },

  { k:"Teknikal Makmal", s:"Bagaimanakah anda menguruskan reagen dan stok bahan guna habis makmal?",
    ok:"Rekod stok kemas kini, FEFO, paras minimum, verifikasi lot baharu dan rancang perolehan awal.",
    ng:"Pesan sebanyak mungkin sekali gus dan guna stok yang baru sampai dahulu.",
    e:"📦",
    j:["Rekod stok yang kemas kini: tarikh terima, nombor lot, tarikh luput, baki.",
       "Amalkan FEFO (yang luput dahulu, guna dahulu) dan tetapkan paras stok minimum.",
       "Simpan mengikut syarat pengeluar dan pantau suhu peti sejuk setiap hari.",
       "Buat verifikasi lot baharu sebelum digunakan untuk sampel pesakit.",
       "Rancang perolehan awal mengikut penggunaan dan patuhi tatacara perolehan kerajaan.",
       "Elak pembaziran: pantau reagen hampir luput dan agih ke fasiliti lain jika perlu."],
    t:"Kaitkan dengan penjimatan kos. Panel suka jawapan yang menunjukkan kesedaran bajet." },

  { k:"Teknikal Makmal", s:"Apakah langkah anda apabila menerima peralatan atau kaedah ujian baharu sebelum digunakan untuk pesakit?",
    ok:"Pentauliahan, verifikasi kaedah, SOP, latihan dan kompetensi staf sebelum diguna untuk pesakit.",
    ng:"Terus guna untuk sampel pesakit kerana pembekal sudah menguji alat itu di kilang.",
    e:"🆕",
    j:["Semak pemasangan dan pentauliahan oleh pembekal (Testing & Commissioning) serta dokumen lengkap.",
       "Jalankan verifikasi kaedah: kejituan, ketepatan, julat pelaporan, perbandingan dengan kaedah sedia ada.",
       "Sediakan atau kemas kini SOP, julat rujukan dan tetapan dalam LIS.",
       "Latih staf dan nilai kompetensi sebelum dibenar mengendalikan alat.",
       "Daftar aset, sediakan jadual penyelenggaraan dan kalibrasi.",
       "Maklumkan kepada pelanggan jika ada perubahan julat rujukan atau jenis spesimen."],
    t:"Bezakan: verifikasi untuk kaedah yang sudah disahkan pengeluar, validasi untuk kaedah baharu atau diubah suai." },

  { k:"Teknikal Makmal", s:"Bagaimanakah anda memastikan peralatan makmal sentiasa berfungsi dengan baik?",
    ok:"Penyelenggaraan pengguna berjadual, PPM dan kalibrasi, pantau IQC dan rekod kerosakan.",
    ng:"Panggil jurutera hanya apabila alat rosak; penyelenggaraan berjadual tidak perlu.",
    e:"🔧",
    j:["Penyelenggaraan harian, mingguan dan bulanan oleh pengguna mengikut manual, direkod dalam log.",
       "Penyelenggaraan pencegahan berjadual (PPM) dan kalibrasi oleh pembekal atau syarikat konsesi.",
       "Pantau prestasi melalui IQC dan rekod kerosakan (downtime).",
       "Semak sijil kalibrasi dan label status pada alat.",
       "Rancang penggantian alat usang dan sediakan pelan sandaran."],
    t:"Sebut pengalaman anda berurusan dengan pembekal atau jurutera semasa alat rosak." },

  /* ---------- C. Keselamatan ---------- */
  { k:"Keselamatan & Biosafety", s:"Berlaku tumpahan spesimen darah di lantai makmal. Apakah tindakan anda?",
    ok:"Hadkan kawasan, pakai PPE, tutup dengan bahan penyerap, disinfektan, buang sebagai sisa klinikal dan lapor.",
    ng:"Lap segera dengan tisu dan air, kemudian buang ke dalam tong sampah biasa.",
    e:"🩸",
    j:["Maklumkan staf berdekatan dan hadkan kawasan tumpahan.",
       "Pakai PPE yang sesuai: sarung tangan, kot makmal, pelindung muka jika perlu.",
       "Tutup tumpahan dengan bahan penyerap, tuang disinfektan (contoh natrium hipoklorit) dari luar ke dalam.",
       "Biarkan mengikut masa sentuhan dalam SOP, kemudian bersihkan. Kaca pecah diambil dengan forsep, bukan tangan.",
       "Buang semua bahan sebagai sisa klinikal, cuci tangan.",
       "Lapor dan rekod insiden; semak punca untuk mengelak berulang."],
    t:"Sebut kit tumpahan (spill kit) dan latihan berkala kepada staf." },

  { k:"Keselamatan & Biosafety", s:"Seorang staf anda tercucuk jarum terpakai. Apakah yang perlu dilakukan?",
    ok:"Basuh dengan sabun dan air mengalir, lapor segera, penilaian risiko, PEP jika perlu, notifikasi dan susulan.",
    ng:"Picit luka sehingga berdarah, sapu antiseptik dan lapor pada hari bekerja berikutnya.",
    e:"💉",
    j:["Pertolongan cemas segera: basuh luka dengan sabun dan air mengalir, jangan picit atau hisap luka.",
       "Lapor segera kepada penyelia dan rujuk ke Jabatan Kecemasan atau klinik yang ditetapkan untuk penilaian risiko.",
       "Kenal pasti sumber pesakit jika boleh; ujian saringan HIV, Hepatitis B dan Hepatitis C untuk staf dan sumber.",
       "Rawatan profilaksis pasca pendedahan (PEP) jika disyorkan doktor, secepat mungkin.",
       "Isi borang notifikasi kecederaan benda tajam dan lapor kepada unit keselamatan dan kesihatan pekerjaan.",
       "Susulan ujian darah dan kaunseling; siasat punca dan baiki amalan kerja."],
    t:"Tunjuk keprihatinan kepada staf, bukan hanya prosedur." },

  { k:"Keselamatan & Biosafety", s:"Bagaimanakah sisa makmal diurus dengan betul?",
    ok:"Asing di punca: sisa klinikal beg kuning, benda tajam bekas khas, sisa am beg hitam.",
    ng:"Kumpul semua sisa dalam satu beg hitam; syarikat konsesi akan mengasingkannya.",
    e:"🗑️",
    j:["Asingkan di punca mengikut jenis sisa.",
       "Sisa klinikal ke dalam beg kuning; benda tajam ke dalam bekas benda tajam yang kalis tusukan.",
       "Sisa berisiko tinggi seperti kultur dinyahcemar (autoklaf) dahulu mengikut SOP.",
       "Sisa am ke dalam beg hitam; sisa kimia diurus berasingan sebagai buangan terjadual.",
       "Bekas tidak diisi melebihi tiga per empat, dilabel dan dikutip oleh syarikat konsesi.",
       "Tertakluk kepada Akta Kualiti Alam Sekeliling 1974 dan peraturan buangan terjadual."],
    t:"Sebut pemantauan anda sebagai penyelia: audit pengasingan sisa dan latihan staf." },

  { k:"Keselamatan & Biosafety", s:"Apakah langkah anda untuk memastikan keselamatan staf di makmal?",
    ok:"Standard Precautions, PPE, latihan berkala, imunisasi Hepatitis B, penilaian risiko dan lapor insiden.",
    ng:"Sediakan PPE dan serahkan kepada setiap staf untuk menjaga keselamatan masing-masing.",
    e:"🦺",
    j:["Amalan Standard Precautions: semua spesimen dianggap berpotensi berjangkit.",
       "PPE mencukupi dan dipakai dengan betul; kabinet biokeselamatan diselenggara dan disahkan.",
       "Taklimat keselamatan untuk staf baharu dan latihan berkala (tumpahan, kebakaran, bahan kimia).",
       "Imunisasi Hepatitis B untuk staf dan rekod status.",
       "Penilaian risiko, audit keselamatan dan pelaporan insiden atau kejadian nyaris.",
       "Lembaran data keselamatan (SDS) bahan kimia mudah dicapai; patuh Akta Keselamatan dan Kesihatan Pekerjaan 1994."],
    t:"Kebanyakan makmal diagnostik ialah Tahap Biokeselamatan 2 (BSL-2); kultur TB memerlukan kawalan lebih tinggi." },

  /* ---------- D. Pengurusan & kepimpinan ---------- */
  { k:"Pengurusan & Kepimpinan", s:"Seorang staf di bawah seliaan anda kerap datang lewat dan prestasinya merosot. Bagaimana anda menanganinya?",
    ok:"Kumpul fakta, jumpa secara tertutup, bimbing dan pantau; tindakan tatatertib jika berterusan.",
    ng:"Tegur di hadapan staf lain sebagai pengajaran dan terus lapor untuk tindakan tatatertib.",
    e:"⏰",
    j:["Kumpul fakta dahulu: rekod kehadiran, kesan kepada tugas.",
       "Jumpa secara tertutup, dengar masalahnya (kesihatan, keluarga, kewangan).",
       "Beri nasihat dan teguran lisan, tetapkan sasaran pembaikan dan tempoh pemantauan.",
       "Tawar bantuan: tukar syif jika munasabah, rujuk kaunseling.",
       "Jika berterusan: teguran bertulis dan lapor kepada ketua jabatan untuk tindakan mengikut peraturan tatatertib.",
       "Rekod semua perbincangan dan tindakan."],
    t:"Tunjuk turutan: siasat, bimbing, pantau, baru tindakan tegas. Jangan terus menghukum." },

  { k:"Pengurusan & Kepimpinan", s:"Makmal anda kekurangan staf tetapi beban kerja meningkat. Apakah tindakan anda?",
    ok:"Analisis beban kerja, susun semula tugas, multi-skilling, permudah proses dan kemuka justifikasi berdata.",
    ng:"Mohon tambahan staf dan tunggu kelulusan sebelum mengubah apa-apa.",
    e:"👥",
    j:["Analisis beban kerja: bilangan ujian, waktu puncak, tugas yang tidak menambah nilai.",
       "Susun semula jadual dan agihan tugas; latih staf pelbagai kemahiran (multi-skilling) supaya boleh saling ganti.",
       "Permudah aliran kerja: automasi, gabung proses, kurangkan kerja manual dan pendua.",
       "Tetapkan keutamaan ujian segera dan kritikal.",
       "Kemuka justifikasi berasaskan data kepada pengurusan untuk tambahan jawatan atau kerja lebih masa.",
       "Jaga kebajikan dan moral staf: rehat mencukupi, penghargaan."],
    t:"Panel mahu lihat penyelesaian anda sendiri dahulu, bukan sekadar 'minta tambah staf'." },

  { k:"Pengurusan & Kepimpinan", s:"Dua orang staf anda berkonflik sehingga menjejaskan kerja unit. Bagaimana anda menyelesaikannya?",
    ok:"Bertindak awal, dengar kedua-dua pihak berasingan, cari punca, bincang bersama dan pantau.",
    ng:"Biarkan mereka selesaikan sendiri kerana ia urusan peribadi orang dewasa.",
    e:"🤝",
    j:["Bertindak awal, jangan biar berlarutan.",
       "Dengar kedua-dua pihak secara berasingan tanpa berat sebelah.",
       "Kenal pasti punca sebenar: agihan tugas, komunikasi atau hal peribadi.",
       "Adakan perbincangan bersama, fokus kepada isu kerja dan cari persetujuan.",
       "Tetapkan peraturan yang jelas dan pantau selepas itu.",
       "Jika gagal, rujuk kepada ketua jabatan atau kaunselor."],
    t:"Tekankan sikap adil dan profesional; keutamaan ialah perkhidmatan kepada pesakit tidak terjejas." },

  { k:"Pengurusan & Kepimpinan", s:"Seorang doktor mengadu keputusan ujian lewat dan memarahi staf anda. Apakah tindakan anda?",
    ok:"Dengar dengan tenang, selesaikan keperluan pesakit, siasat punca dan beri maklum balas jujur.",
    ng:"Pertahankan staf dan jelaskan bahawa kelewatan berpunca daripada wad.",
    e:"👂",
    j:["Tenang dan dengar aduan sepenuhnya; mohon maaf atas kesulitan.",
       "Selesaikan keperluan pesakit dahulu: semak status ujian dan segerakan keputusan.",
       "Siasat punca kelewatan: spesimen lewat sampai, alat rosak, ujian diulang, kesilapan staf.",
       "Beri maklum balas jujur kepada doktor tentang punca dan tindakan pembetulan.",
       "Rekod aduan mengikut prosedur aduan pelanggan dan bincang dalam mesyuarat unit.",
       "Sokong staf anda, dan bimbing jika ada kelemahan."],
    t:"Tunjuk anda mengutamakan pesakit, menjaga hubungan dengan pelanggan dan melindungi staf secara adil." },

  { k:"Pengurusan & Kepimpinan", s:"Anda dapati satu keputusan ujian yang salah telah dikeluarkan kepada wad. Apakah tindakan anda?",
    ok:"Maklum doktor segera, keluarkan laporan pembetulan, lapor insiden dan buat analisis punca.",
    ng:"Betulkan dalam sistem secara senyap supaya tidak menimbulkan kekecohan.",
    e:"✏️",
    j:["Hubungi doktor atau wad dengan segera untuk memaklumkan kesilapan supaya rawatan tidak tersasar.",
       "Tarik balik keputusan dan keluarkan laporan pembetulan (amended report) dengan rekod yang jelas.",
       "Semak sama ada sampel pesakit lain turut terjejas.",
       "Lapor kepada ketua unit atau pakar patologi dan isi laporan insiden.",
       "Jalankan analisis punca (root cause analysis) dan tindakan pembetulan serta pencegahan.",
       "Kongsi pengajaran dengan staf tanpa mencari salah individu."],
    t:"Kata kunci: keselamatan pesakit, ketelusan, tidak menyembunyikan kesilapan." },

  { k:"Pengurusan & Kepimpinan", s:"Penganalisis utama rosak pada waktu malam dan banyak sampel segera menunggu. Apa tindakan anda?",
    ok:"Troubleshoot, aktifkan pelan sandaran, utamakan sampel kritikal, maklum wad dan hubungi jurutera.",
    ng:"Simpan semua sampel dan tunggu jurutera datang pada waktu pejabat.",
    e:"🌙",
    j:["Cuba penyelesaian asas mengikut manual (troubleshooting) dan semak mesej ralat.",
       "Aktifkan pelan sandaran: guna alat sandaran, kaedah manual atau hantar ke makmal rujukan terdekat.",
       "Utamakan sampel kecemasan dan kritikal.",
       "Maklumkan kepada wad dan Jabatan Kecemasan tentang kelewatan dan anggaran masa.",
       "Hubungi jurutera pembekal dan maklum kepada penyelia atau ketua unit.",
       "Rekod kerosakan; sebelum alat diguna semula, jalankan IQC dan kalibrasi jika perlu."],
    t:"Sebut 'pelan kesinambungan perkhidmatan' (contingency plan) yang patut wujud secara bertulis." },

  { k:"Pengurusan & Kepimpinan", s:"Bagaimanakah anda melatih dan menilai kompetensi staf baharu?",
    ok:"Orientasi, latihan berstruktur dengan mentor, penilaian kompetensi, baru dibenar bekerja sendiri.",
    ng:"Beri SOP untuk dibaca dan terus masukkan dalam jadual atas panggilan.",
    e:"🎓",
    j:["Program orientasi: struktur organisasi, keselamatan, kerahsiaan, SOP asas.",
       "Latihan berstruktur mengikut unit dengan mentor dan senarai semak latihan.",
       "Penilaian kompetensi: pemerhatian langsung, ujian bertulis, sampel buta (blind sample).",
       "Hanya dibenar bekerja sendiri dan bertugas atas panggilan selepas disahkan kompeten.",
       "Penilaian semula berkala dan rekod latihan disimpan.",
       "Galak pembelajaran berterusan (CPD)."],
    t:"Kaitkan dengan keperluan personel dalam MS ISO 15189." },

  { k:"Pengurusan & Kepimpinan", s:"Ceritakan satu inovasi atau projek penambahbaikan kualiti yang anda terlibat.",
    ok:"Nyatakan masalah, peranan anda, penyelesaian dan hasil yang diukur.",
    ng:"Terangkan teori KIK dan Lean secara umum tanpa contoh projek sendiri.",
    e:"💡",
    j:["Nama projek dan peranan anda (ketua, ahli, fasilitator).",
       "Masalah asal dan data yang menyokong.",
       "Analisis punca dan penyelesaian yang dilaksana.",
       "Hasil yang diukur: masa, kos, kadar ralat, kepuasan pelanggan.",
       "Pengiktirafan atau perluasan ke tempat lain (konvensyen KIK, QA, Lean)."],
    t:"Jika belum pernah mengetuai projek, cerita projek yang anda sertai dan apa yang anda mahu buat seterusnya." },

  { k:"Pengurusan & Kepimpinan", s:"Ketua anda memberi arahan yang anda tidak persetujui. Apakah tindakan anda?",
    ok:"Fahami tujuan, kemuka pandangan secara berhemah; laksana jika arahan sah, bantah bertulis jika menyalahi peraturan.",
    ng:"Laksana separuh hati dan luahkan rasa tidak puas hati kepada staf bawahan.",
    e:"🗣️",
    j:["Fahami dahulu sebab dan tujuan arahan tersebut.",
       "Kemuka pandangan dan cadangan alternatif secara berhemah, disokong fakta, melalui saluran yang betul.",
       "Jika keputusan kekal dan arahan itu sah, laksanakan dengan sepenuh komitmen.",
       "Jika arahan bercanggah dengan undang-undang, peraturan atau keselamatan pesakit, nyatakan bantahan secara bertulis dan rujuk pihak lebih atas.",
       "Tidak memburukkan ketua di hadapan staf bawahan."],

  $("lblPicked").textContent = t.picked;  $("lblCompany").textContent = t.company;
  $("lblCat").textContent = t.cat;        $("btnStart").textContent = t.start;
  $("btnBack").textContent = t.back;      $("lblPanel").textContent = t.panel;
  $("tabQuiz").textContent = t.tabQuiz;   $("tabNotes").textContent = t.tabNotes;
  $("tabMine").textContent = t.tabMine;   $("lblMine").textContent = t.lblMine;
  $("mineText").placeholder = t.minePh;   $("mineHint").textContent = t.mineHint;
  $("btnMineCopy").textContent = t.mineCopy; $("btnMineFile").textContent = t.mineFile;
  $("lblChoose").textContent = t.choose;  $("lblAns").textContent = t.ans;
  $("endTitle").textContent = t.end;      $("lblSGood").textContent = t.sGood;
  $("lblSBad").textContent = t.sBad;      $("lblSScore").textContent = t.sScore;
  $("lblReview").textContent = t.review;  $("btnRetry").textContent = t.retry;
  $("btnRestart").textContent = t.restart; $("footText").textContent = state.job ? t.foot : "";
}

function show(screen){
  ["scrMenu","scrSetup","scrQuiz","scrEnd"].forEach(function(s){ $(s).classList.toggle("hidden", s !== screen); });
  $("btnHome").classList.toggle("hidden", screen === "scrMenu");
  window.scrollTo(0, 0);
}

/* --- Screen 0: main menu of jobs --- */
function renderMenu(){
  var box = $("jobList"); box.innerHTML = "";
  JOBS.forEach(function(job){
    var b = document.createElement("button"); b.className = "job";
    var ico = document.createElement("span"); ico.className = "ico"; ico.textContent = job.ikon;
    var txt = document.createElement("span");
    var n = document.createElement("b"); n.textContent = job.nama;
    var d = document.createElement("span"); d.className = "d"; d.textContent = job.butiran;
    var l = document.createElement("span"); l.className = "d";
    l.textContent = (job.lang === "ms" ? "Bahasa Melayu" : "English") + " \u2022 " + job.soalan.length + TEXT[job.lang].questions;
    txt.appendChild(n); txt.appendChild(d); txt.appendChild(l);
    var go = document.createElement("span"); go.className = "go"; go.textContent = "\u203A";
    b.appendChild(ico); b.appendChild(txt); b.appendChild(go);
    b.onclick = function(){ selectJob(job); };
    box.appendChild(b);
  });
}

function selectJob(job){
  state.job = job;
  state.company = job.syarikat ? job.syarikat[0] : null;
  state.cat = null;
  state.tab = "quiz";
  applyText();
  renderSetup();
  show("scrSetup");
}

/* --- Screen 1: company and category --- */
function renderSetup(){
  var job = state.job;
  $("pickedJob").innerHTML = "";
  $("pickedJob").appendChild(document.createTextNode(job.nama));
  var sm = document.createElement("small"); sm.textContent = job.butiran; $("pickedJob").appendChild(sm);

  // Company chips (only if the job has a company list)
  $("companyCard").classList.toggle("hidden", !job.syarikat);
  var cbox = $("companyList"); cbox.innerHTML = "";
  (job.syarikat || []).forEach(function(c){
    var b = document.createElement("button");
    b.className = "chip" + (c === state.company ? " on" : "");
    b.textContent = c;
    b.onclick = function(){ state.company = c; renderSetup(); };
    cbox.appendChild(b);
  });

  // Category chips
  var cats = [];
  companyQuestions().forEach(function(q){ if (cats.indexOf(q.k) < 0) cats.push(q.k); });
  var box = $("catList"); box.innerHTML = "";
  [null].concat(cats).forEach(function(c){
    var b = document.createElement("button");
    b.className = "chip" + (c === state.cat ? " on" : "");
    b.textContent = c === null ? T().all : c;
    b.onclick = function(){ state.cat = c; renderSetup(); };
    box.appendChild(b);
  });
  // Tabs: practice shows the Start button, notes shows the answer list
  var notes = state.tab === "notes", mine = state.tab === "mine";
  $("tabQuiz").classList.toggle("on", state.tab === "quiz");
  $("tabNotes").classList.toggle("on", notes);
  $("tabMine").classList.toggle("on", mine);
  $("mineBox").classList.toggle("hidden", !mine);
  $("mineList").classList.toggle("hidden", !mine);
  if (mine) { renderMineList(); loadMine(); }
  $("btnStart").classList.toggle("hidden", notes || mine);
  $("notesBox").classList.toggle("hidden", !notes);
  $("countInfo").textContent = pickQuestions().length + (notes ? T().notesInfo : mine ? T().mineInfo : T().count);
  if (notes) renderNotes();
}

/* --- My Notes tab: the user's own notes, kept in this browser (localStorage), one per job --- */
function mineKey(){ return "temuduga-nota-" + state.job.id; }
function loadMine(){
  var v = "";
  try { v = localStorage.getItem(mineKey()) || ""; } catch (e) {}
  $("mineText").value = v;
  $("mineSaved").textContent = v ? T().mineSaved : "";
}
function saveMine(){
  try { localStorage.setItem(mineKey(), $("mineText").value); $("mineSaved").textContent = T().mineSaved; }
  catch (e) { $("mineSaved").textContent = T().mineFail; }
}
/* --- Notes tied to a question: one saved object per job, keyed by a hash of the question text --- */
function qId(q){ var h = 5381, t = q.s; for (var i = 0; i < t.length; i++) { h = ((h << 5) + h + t.charCodeAt(i)) >>> 0; } return "q" + h; }
function qKey(){ return "temuduga-qnota-" + state.job.id; }
function qAll(){ try { return JSON.parse(localStorage.getItem(qKey()) || "{}") || {}; } catch (e) { return {}; } }
function qGet(q){ return qAll()[qId(q)] || ""; }
function qSet(q, text){
  var all = qAll();
  if (text.trim()) { all[qId(q)] = text; } else { delete all[qId(q)]; }
  try { localStorage.setItem(qKey(), JSON.stringify(all)); return true; } catch (e) { return false; }
}
/* Small "my note" block (used in Answer Notes and after answering A/B) */
function fillMyNote(el, q){
  var v = qGet(q); el.innerHTML = "";
  if (v) { var b = document.createElement("b"); b.textContent = "\uD83D\uDCDD " + T().myTag; el.appendChild(b); el.appendChild(document.createTextNode(v)); }
  el.classList.toggle("hidden", !v);
}
/* My Notes tab: every question with its own note box */
function renderMineList(){
  var box = $("mineList"); box.innerHTML = "";
  var lastCat = null;
  pickQuestions().forEach(function(q, i){
    var cat = q.c ? q.k + " \u2022 " + q.c : q.k;
    if (cat !== lastCat) { var h = document.createElement("p"); h.className = "notehead"; h.textContent = cat; box.appendChild(h); lastCat = cat; }
    var n = document.createElement("div"); n.className = "note";
    var em = document.createElement("span"); em.className = "em"; em.textContent = q.e || "\u2022";
    var body = document.createElement("div"); body.className = "body";
    var nq = document.createElement("p"); nq.className = "na"; nq.textContent = (i + 1) + ". " + q.s;
    var ta = document.createElement("textarea"); ta.className = "qnote"; ta.placeholder = T().qPh; ta.value = qGet(q);
    var st = document.createElement("p"); st.className = "qsaved";
    ta.oninput = function(){ st.textContent = qSet(q, ta.value) ? T().qSaved : T().mineFail; };
    body.appendChild(nq); body.appendChild(ta); body.appendChild(st);
    n.appendChild(em); n.appendChild(body); box.appendChild(n);
  });
}
/* Text for copy / backup file: every question that has a note, then the general notes */
function mineExport(){
  var out = [state.job.nama, ""], n = 0;
  state.job.soalan.forEach(function(q){ var v = qGet(q); if (v) { n++; out.push(n + ". " + q.s + (q.c ? " [" + q.c + "]" : ""), v, ""); } });
  var g = $("mineText").value;
  if (g.trim()) { out.push("--- " + T().lblMine + " ---", g); }
  return out.join("\n");
}
function copyMine(){
  var ta = $("mineText"), text = mineExport();
  function done(){ $("btnMineCopy").textContent = T().mineCopied; setTimeout(function(){ $("btnMineCopy").textContent = T().mineCopy; }, 1500); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function(){ ta.select(); document.execCommand("copy"); done(); });
  } else { ta.select(); document.execCommand("copy"); done(); }
}
function fileMine(){
  var blob = new Blob([mineExport()], { type: "text/plain;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nota-" + state.job.id + ".txt";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

/* --- Notes tab: icon + question + correct answer only, grouped by category --- */
function renderNotes(){
  var box = $("notesBox"); box.innerHTML = "";
  var lastCat = null;
  pickQuestions().forEach(function(q, i){
    var cat = q.c ? q.k + " \u2022 " + q.c : q.k;
    if (cat !== lastCat) {
      var h = document.createElement("p"); h.className = "notehead"; h.textContent = cat;
      box.appendChild(h); lastCat = cat;
    }
    var n = document.createElement("div"); n.className = "note";
    var em = document.createElement("span"); em.className = "em"; em.textContent = q.e || "\u2022";
    var body = document.createElement("div");
    var nq = document.createElement("p"); nq.className = "nq"; nq.textContent = (i + 1) + ". " + q.s;
    var na = document.createElement("p"); na.className = "na"; na.textContent = q.ok;
    var d = document.createElement("details");
    var sm = document.createElement("summary"); sm.textContent = T().more;
    var ul = document.createElement("ul");
    q.j.forEach(function(p){ var li = document.createElement("li"); li.textContent = p; ul.appendChild(li); });
    d.appendChild(sm); d.appendChild(ul);
    var my = document.createElement("div"); my.className = "mynote"; fillMyNote(my, q);
    body.className = "body";
    body.appendChild(nq); body.appendChild(na); body.appendChild(my); body.appendChild(d);
    n.appendChild(em); n.appendChild(body);
    box.appendChild(n);
  });
}

/* Questions for the selected company: general ones + that company's own (kept in file order) */
function companyQuestions(){
  return state.job.soalan.filter(function(q){ return !q.c || q.c === state.company; });
}
function pickQuestions(){
  return companyQuestions().filter(function(q){ return state.cat === null || q.k === state.cat; });
}

/* --- Screen 2: question session (questions stay in order) --- */
function startSession(list){
  if (!list.length) return;
  state.queue = list.slice();
  state.idx = 0; state.right = 0; state.wrong = [];
  show("scrQuiz");
  renderQuestion();
}

function renderQuestion(){
  var q = state.queue[state.idx];
  $("qCat").textContent = q.c ? q.k + " \u2022 " + q.c : q.k;
  $("qNum").textContent = T().qn + (state.idx + 1) + " / " + state.queue.length;
  $("qBar").style.width = (state.idx / state.queue.length * 100) + "%";
  $("qText").textContent = q.s;

  // Only the position of the correct answer (A or B) is random; question order is fixed
  state.okSide = Math.random() < 0.5 ? "A" : "B";
  $("optAText").textContent = state.okSide === "A" ? q.ok : q.ng;
  $("optBText").textContent = state.okSide === "B" ? q.ok : q.ng;
  ["optA","optB"].forEach(function(id){ $(id).disabled = false; $(id).className = "opt"; });
  $("ansBox").classList.add("hidden");
}

/* User picks A or B */
function choose(side){
  var q = state.queue[state.idx];
  var correct = side === state.okSide;
  if (correct) { state.right++; } else { state.wrong.push(q); }

  // Colour the two options
  $("optA").disabled = true; $("optB").disabled = true;
  $("opt" + state.okSide).classList.add("right");
  if (!correct) { $("opt" + side).classList.add("wrong"); }
  else { $("opt" + (side === "A" ? "B" : "A")).classList.add("dim"); }

  // Verdict + the correct answer in full
  var v = $("verdict");
  v.className = "verdict " + (correct ? "ok" : "bad");
  v.textContent = correct ? T().right : T().wrong + state.okSide + ".";
  $("ansShort").textContent = q.ok;
  var ul = $("ansList"); ul.innerHTML = "";
  q.j.forEach(function(p){ var li = document.createElement("li"); li.textContent = p; ul.appendChild(li); });
  $("ansTip").textContent = T().tip + q.t;
  fillMyNote($("ansMine"), q);
  $("btnNext").textContent = state.idx + 1 >= state.queue.length ? T().finish : T().next;
  $("ansBox").classList.remove("hidden");
}

function nextQuestion(){
  state.idx++;
  if (state.idx >= state.queue.length) { endSession(); } else { renderQuestion(); window.scrollTo(0, 0); }
}

/* --- Screen 3: summary --- */
function endSession(){
  var total = state.queue.length;
  $("sGood").textContent = state.right;
  $("sBad").textContent = state.wrong.length;
  $("sScore").textContent = Math.round(state.right / total * 100) + "%";
  var ol = $("reviewList"); ol.innerHTML = "";
  state.wrong.forEach(function(q){ var li = document.createElement("li"); li.textContent = q.s; ol.appendChild(li); });
  var has = state.wrong.length > 0;
  $("reviewBox").classList.toggle("hidden", !has);
  $("btnRetry").classList.toggle("hidden", !has);
  show("scrEnd");
}

function goMenu(){ state.job = null; applyText(); renderMenu(); show("scrMenu"); }

/* --- Buttons --- */
$("btnStart").onclick   = function(){ startSession(pickQuestions()); };
$("btnBack").onclick    = goMenu;
$("tabQuiz").onclick    = function(){ state.tab = "quiz"; renderSetup(); };
$("tabNotes").onclick   = function(){ state.tab = "notes"; renderSetup(); };
$("tabMine").onclick    = function(){ state.tab = "mine"; renderSetup(); };
$("mineText").oninput   = saveMine;
$("btnMineCopy").onclick = copyMine;
$("btnMineFile").onclick = fileMine;
$("optA").onclick       = function(){ choose("A"); };
$("optB").onclick       = function(){ choose("B"); };
$("btnNext").onclick    = nextQuestion;
$("btnRetry").onclick   = function(){ startSession(state.wrong); };
$("btnRestart").onclick = goMenu;
$("btnHome").onclick    = goMenu;

goMenu();
</script>
</body>
</html>
