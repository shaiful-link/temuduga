    j:["Menteri: Dr. Dzulkefly Ahmad", "Timbalan: Hanifah Hajar Taib", "KSU: Hasnol Zam Zam", "KPK: Dr. Mahathar Abd Wahab", "Pengarah MKAK", "Ketua Profesion JTMP"],
    t:"Nama ini disemak pada Oktober 2026. Semak semula nama dan gelaran penuh di laman web KKM pada minggu temuduga." },

  { k:"Pentadbiran & Kewangan", s:"Apakah Perintah Am dan apakah kandungannya?",
    a:"**Perintah Am** ialah peraturan yang mengawal **syarat dan urusan perkhidmatan** penjawat awam. Ia dibahagikan kepada beberapa bab: **Bab A** tentang lantikan dan kenaikan pangkat, **Bab B** tentang elaun dan kemudahan, **Bab C** tentang cuti, **Bab D** tentang kelakuan dan tatatertib, **Bab E** tentang rumah dan bangunan pejabat kerajaan, **Bab F** tentang perubatan, dan **Bab G** tentang waktu bekerja dan lebih masa. Bab D kini digantikan oleh **Peraturan-Peraturan Pegawai Awam (Kelakuan dan Tatatertib) 1993**. Sebagai penyelia, saya merujuk Perintah Am dan pekeliling terkini apabila mengurus cuti, elaun dan disiplin staf.",
    e:"📚",
    kw:"Perintah Am",
    m:[["🅰️", "A: Lantikan & kenaikan pangkat"], ["🅱️", "B: Elaun & kemudahan"], ["🏖️", "C: Cuti"], ["⚖️", "D: Tatatertib (Peraturan 1993)"], ["🏠", "E & F: Rumah, perubatan"], ["⏰", "G: Waktu kerja & lebih masa"]],
    j:["A: Lantikan & kenaikan pangkat", "B: Elaun & kemudahan", "C: Cuti", "D: Tatatertib (Peraturan 1993)", "E & F: Rumah, perubatan", "G: Waktu kerja & lebih masa"],
    t:"Panel selalu menyoal Bab C (cuti) dan tatatertib. Semak juga pekeliling perkhidmatan terkini kerana banyak perkara telah dikemas kini." },

  { k:"Pentadbiran & Kewangan", s:"Terangkan jenis-jenis cuti penjawat awam yang perlu diketahui oleh seorang penyelia.",
    a:"Cuti penjawat awam terkandung dalam **Perintah Am Bab C**. **Cuti rehat** ialah kelayakan tahunan mengikut gred dan tempoh perkhidmatan. **Cuti sakit** boleh diberi sehingga **180 hari setahun**: 90 hari diluluskan oleh Ketua Jabatan dan 90 hari lagi oleh KSU, dengan sijil sakit. Selepas itu ada **cuti sakit lanjutan** atas perakuan Lembaga Perubatan. **Cuti bersalin** ialah **60 hingga 90 hari** bagi setiap kelahiran, dengan jumlah 360 hari sepanjang perkhidmatan. Ada juga **cuti kuarantin, cuti tibi, kusta dan barah, cuti kecederaan** dan cuti tanpa gaji. Sebagai penyelia, saya memastikan cuti **dirancang supaya perkhidmatan tidak terjejas** dan direkod dengan betul.",
    e:"🏖️",
    kw:"Jenis Cuti",
    m:[["🏖️", "Cuti rehat: ikut gred & tempoh"], ["🤒", "Cuti sakit: hingga 180 hari"], ["🩺", "Cuti sakit lanjutan"], ["🤱", "Bersalin: 60-90 hari, jumlah 360"], ["😷", "Kuarantin, tibi, kecederaan"], ["🗓️", "Rancang supaya khidmat tidak terjejas"]],
    j:["Cuti rehat: ikut gred & tempoh", "Cuti sakit: hingga 180 hari", "Cuti sakit lanjutan", "Bersalin: 60-90 hari, jumlah 360", "Kuarantin, tibi, kecederaan", "Rancang supaya khidmat tidak terjejas"],
    t:"Angka ini daripada dokumen JPA; semak pekeliling terkini kerana kelayakan cuti pernah dipinda." },

  { k:"Pentadbiran & Kewangan", s:"Apakah cuti kuarantin dan cuti tibi? Bagaimanakah ia diurus, termasuk semasa COVID-19?",
    a:"**Cuti kuarantin** diberi dengan **gaji penuh** sepanjang tempoh pegawai diarahkan berkuarantin kerana penyakit berjangkit, di bawah **Perintah Am 24 Bab C**. Arahan kuarantin dikeluarkan oleh pegawai kesihatan di bawah **Akta Pencegahan dan Pengawalan Penyakit Berjangkit 1988 (Akta 342)**. Semasa **COVID-19**, pegawai yang menerima perintah pengawasan dan pemerhatian diberi cuti kuarantin; jika disahkan sakit, tempoh itu dikira sebagai **cuti sakit**. **Cuti tibi, kusta dan barah** di bawah **Perintah Am 31** pula ialah cuti **bergaji penuh jangka panjang** atas perakuan perubatan, selepas cuti rehat digunakan. Bagi staf makmal tibi, ini penting kerana risiko pendedahan di tempat kerja.",
    e:"😷",
    kw:"Cuti Kuarantin & Tibi",
    m:[["😷", "Kuarantin: gaji penuh (PA 24)"], ["📜", "Arahan di bawah Akta 342"], ["🦠", "COVID-19: perintah pengawasan"], ["🤒", "Jika sakit: jadi cuti sakit"], ["🫁", "Cuti tibi, kusta, barah (PA 31)"], ["🧫", "Penting untuk staf makmal tibi"]],
    j:["Kuarantin: gaji penuh (PA 24)", "Arahan di bawah Akta 342", "COVID-19: perintah pengawasan", "Jika sakit: jadi cuti sakit", "Cuti tibi, kusta, barah (PA 31)", "Penting untuk staf makmal tibi"],
    t:"Semak tempoh maksimum cuti tibi dalam Perintah Am 31 dan pekeliling terkini; anda di Unit TB, jadi panel mungkin bertanya lebih mendalam." },

  { k:"Pentadbiran & Kewangan", s:"Terangkan tatacara perolehan kerajaan: pembelian terus, sebut harga dan tender.",
    a:"Kaedah perolehan bekalan dan perkhidmatan ditentukan oleh **nilai tahunan**. **Pembelian terus** digunakan bagi nilai **sehingga RM50,000**. **Sebut harga** bagi nilai **melebihi RM50,000 hingga RM500,000**, dan **tender** bagi nilai **melebihi RM500,000**. Jika item itu ada dalam **kontrak pusat atau kontrak panel**, ia mesti dibeli melalui kontrak tersebut. Perolehan dibuat melalui sistem **ePerolehan**, dengan pesanan kerajaan dikeluarkan sebelum bekalan diterima. Prinsipnya ialah **akauntabiliti, ketelusan dan nilai terbaik**; perolehan **tidak boleh dipecah kecil** untuk mengelak had nilai, dan pegawai mesti mengisytiharkan **konflik kepentingan**.",
    e:"🛒",
    kw:"Tatacara Perolehan",
    m:[["🛍️", "Pembelian terus: hingga RM50,000"], ["📝", "Sebut harga: RM50,000 - RM500,000"], ["📑", "Tender: lebih RM500,000"], ["📋", "Kontrak pusat / panel didahulukan"], ["💻", "ePerolehan, pesanan dahulu"], ["🚫", "Tiada pecah kecil"]],
    j:["Pembelian terus: hingga RM50,000", "Sebut harga: RM50,000 - RM500,000", "Tender: lebih RM500,000", "Kontrak pusat / panel didahulukan", "ePerolehan, pesanan dahulu", "Tiada pecah kecil"],
    t:"Had nilai ini daripada Pekeliling Perbendaharaan PK 2.1. Sebut pengalaman sebenar anda menyediakan spesifikasi atau menjadi ahli jawatankuasa sebut harga, jika ada." },

  { k:"Pentadbiran & Kewangan", s:"Bagaimanakah aset kerajaan diurus di makmal anda?",
    a:"Aset diurus mengikut **Tatacara Pengurusan Aset Alih Kerajaan (TPA)**. Ia bermula dengan **penerimaan** dan pengesahan aset, kemudian **pendaftaran** serta pelabelan dalam tempoh yang ditetapkan. Seterusnya **penggunaan, penyimpanan dan pemeriksaan** aset, yang dibuat sekurang-kurangnya sekali setahun. Aset perlu **diselenggara** mengikut jadual dan direkodkan. Aset yang rosak atau usang melalui proses **pelupusan**, manakala kehilangan mesti dilaporkan untuk proses **hapus kira**. Di MKAK, saya terlibat secara langsung dalam tugas ini, contohnya **[pendaftaran, pemeriksaan tahunan atau pelupusan]**.",
    e:"🏷️",
    kw:"Pengurusan Aset",
    m:[["📥", "Penerimaan"], ["🏷️", "Pendaftaran & label"], ["🔍", "Guna, simpan, periksa tahunan"], ["🔧", "Penyelenggaraan"], ["🗑️", "Pelupusan"], ["🚨", "Kehilangan & hapus kira"]],
    j:["Penerimaan", "Pendaftaran & label", "Guna, simpan, periksa tahunan", "Penyelenggaraan", "Pelupusan", "Kehilangan & hapus kira"],
    t:"Ini kekuatan anda. Sebut borang KEW.PA dan sistem yang anda guna, serta satu contoh, misalnya bilangan aset yang anda periksa atau lupuskan." },

  { k:"Pentadbiran & Kewangan", s:"Apakah tindakan anda jika sesuatu aset didapati hilang semasa pemeriksaan?",
    a:"Saya akan **melaporkan kepada Ketua Jabatan dengan segera** sebaik sahaja kehilangan dikesan, dan **laporan polis** dibuat dalam tempoh yang ditetapkan. Ketua Jabatan kemudian menyediakan **laporan awal kehilangan** kepada pihak berkuasa yang berkenaan. Sebuah **jawatankuasa penyiasat** dilantik untuk menentukan punca dan pihak yang bertanggungjawab, dan hasilnya dibawa untuk keputusan **hapus kira**, serta **surcaj atau tindakan tatatertib** jika ada kecuaian. Pada masa yang sama, saya **menyemak semula kawalan**: rekod pergerakan aset, kunci dan capaian, serta pemeriksaan berkala, supaya kejadian tidak berulang.",
    e:"🚨",
    kw:"Aset Hilang",
    m:[["📣", "Lapor Ketua Jabatan segera"], ["🚔", "Laporan polis"], ["📝", "Laporan awal kehilangan"], ["🕵️", "Jawatankuasa penyiasat"], ["⚖️", "Hapus kira / surcaj"], ["🔒", "Baiki kawalan"]],
    j:["Lapor Ketua Jabatan segera", "Laporan polis", "Laporan awal kehilangan", "Jawatankuasa penyiasat", "Hapus kira / surcaj", "Baiki kawalan"],
    t:"Semak tempoh laporan dan nombor borang KEW.PA yang berkaitan dalam Tatacara Pengurusan Aset Alih Kerajaan; anda mengurus aset, jadi panel menjangka butiran yang tepat." },

  { k:"Pentadbiran & Kewangan", s:"Bagaimanakah stor reagen dan bahan guna habis diurus mengikut peraturan kerajaan?",
    a:"Stor diurus mengikut **Tatacara Pengurusan Stor (TPS)**. Barang yang sampai **diterima dan disemak** dengan pesanan, kemudian **direkodkan** dalam kad atau sistem stok. Barang **disimpan** dengan teratur mengikut syarat pengeluar, termasuk suhu, dan dikeluarkan mengikut kaedah **masuk dahulu keluar dahulu** atau luput dahulu keluar dahulu. **Pengeluaran** dibuat atas permohonan yang diluluskan. **Verifikasi stok** dijalankan secara berkala untuk memadankan baki fizikal dengan rekod. Stok yang rosak atau luput **dilupuskan** mengikut prosedur, dan paras stok dipantau supaya bekalan tidak putus.",
    e:"📦",
    kw:"Pengurusan Stor",
    m:[["📥", "Terima & semak"], ["📒", "Rekod stok"], ["🌡️", "Simpan ikut syarat"], ["🔄", "FIFO / FEFO"], ["📤", "Keluar atas kelulusan"], ["🔍", "Verifikasi & pelupusan"]],
    j:["Terima & semak", "Rekod stok", "Simpan ikut syarat", "FIFO / FEFO", "Keluar atas kelulusan", "Verifikasi & pelupusan"],
    t:"Sebut borang KEW.PS yang anda biasa guna, dan cara anda mengelak reagen luput." },

  { k:"Pentadbiran & Kewangan", s:"Apakah elaun dan kemudahan yang berkaitan dengan JTMP?",
    a:"Selain gaji pokok, penjawat awam menerima **imbuhan tetap khidmat awam**, **imbuhan tetap perumahan** dan **bantuan sara hidup**. Bagi tugas di luar waktu biasa, ada **elaun lebih masa** atau cuti gantian, serta **[elaun khusus JTMP, contoh: insentif pos basik, elaun atas panggilan]**. Untuk tugas rasmi di luar pejabat, ada **tuntutan perjalanan** seperti elaun makan, hotel dan perbatuan. Kemudahan lain termasuk **rawatan perubatan**, pinjaman, cuti dan pakaian seragam. Sebagai penyelia, saya memastikan tuntutan staf **disemak, sah dan dihantar dalam tempoh** yang ditetapkan.",
    e:"💵",
    kw:"Elaun & Kemudahan",
    m:[["🏦", "Imbuhan tetap, perumahan, sara hidup"], ["⏰", "Lebih masa / cuti gantian"], ["➕", "Elaun khusus JTMP"], ["🚗", "Tuntutan perjalanan"], ["🏥", "Perubatan & kemudahan lain"], ["✅", "Semak tuntutan staf"]],
    j:["Imbuhan tetap, perumahan, sara hidup", "Lebih masa / cuti gantian", "Elaun khusus JTMP", "Tuntutan perjalanan", "Perubatan & kemudahan lain", "Semak tuntutan staf"],
    t:"Rujuk slip gaji anda sendiri untuk nama dan kadar elaun yang tepat sebelum temuduga." },

  { k:"Profesion JTMP", s:"Apakah visi, misi dan pelan strategik profesion JTMP?",
    a:"Profesion JTMP di KKM diselaraskan oleh **Bahagian Sains Kesihatan Bersekutu** dan diketuai oleh **Ketua Profesion JTMP**, iaitu **[nama semasa]**. Visi profesion ialah **[petik visi rasmi]**, dan misinya ialah **[petik misi rasmi]**. Pelan strategik profesion memberi tumpuan kepada **[teras rasmi, contoh: kompetensi dan kepakaran, kualiti perkhidmatan, tadbir urus profesion, penyelidikan dan inovasi]**. Pada pandangan saya, hala tuju ini selari dengan **Akta 774**, yang menuntut pengamal yang berdaftar, kompeten dan sentiasa meningkatkan diri.",
    e:"🧭",
    kw:"Visi Profesion JTMP",
    m:[["🏢", "Bahagian Sains Kesihatan Bersekutu"], ["👤", "Ketua Profesion JTMP"], ["🌟", "Visi rasmi profesion"], ["🧭", "Misi rasmi profesion"], ["🧱", "Teras pelan strategik"], ["⚖️", "Selari dengan Akta 774"]],
    j:["Bahagian Sains Kesihatan Bersekutu", "Ketua Profesion JTMP", "Visi rasmi profesion", "Misi rasmi profesion", "Teras pelan strategik", "Selari dengan Akta 774"],
    t:"Teks rasmi visi, misi dan pelan strategik belum diisi di sini. Dapatkan daripada portal BSKB atau Ketua Profesion dan hafal ayat yang tepat." },

  { k:"Profesion JTMP", s:"Apakah MyCPD dan mengapa CPD penting kepada JTMP?",
    a:"**MyCPD** ialah sistem dalam talian KKM untuk **merekod aktiviti pembangunan profesional berterusan (CPD)** dan mata yang dikumpul oleh setiap anggota. Aktiviti CPD termasuk **kursus, seminar, pembentangan, penerbitan, pengajaran dan pembelajaran kendiri**. Ia penting kerana ilmu dan teknologi makmal sentiasa berubah, dan mata CPD diambil kira dalam **penilaian prestasi** serta **pembaharuan perakuan amalan di bawah Akta 774**. Sebagai penyelia, saya **merancang latihan** supaya setiap staf mencapai mata minimum, dan **memantau rekod** MyCPD mereka sepanjang tahun, bukan pada hujung tahun sahaja.",
    e:"📈",
    kw:"MyCPD",
    m:[["💻", "Sistem rekod CPD KKM"], ["📚", "Kursus, seminar, pembentangan, kendiri"], ["📊", "Kaitan penilaian prestasi"], ["🪪", "Pembaharuan perakuan amalan"], ["🗓️", "Penyelia: rancang latihan"], ["👀", "Pantau sepanjang tahun"]],
    j:["Sistem rekod CPD KKM", "Kursus, seminar, pembentangan, kendiri", "Kaitan penilaian prestasi", "Pembaharuan perakuan amalan", "Penyelia: rancang latihan", "Pantau sepanjang tahun"],
    t:"Ketahui mata CPD minimum setahun bagi gred anda dan mata anda sendiri tahun ini." },

  { k:"Profesion JTMP", s:"Kini semakin ramai JTMP memiliki ijazah tetapi berada dalam skim peringkat diploma. Apakah pandangan anda dan apakah hala tujunya?",
    a:"Syarat lantikan JTMP ialah **diploma**, tetapi semakin ramai JTMP memiliki **ijazah**, termasuk saya sendiri. Saya melihatnya sebagai **aset kepada perkhidmatan**, bukan masalah, asalkan kepakaran itu **dimanfaatkan**. Cabarannya ialah **peluang kenaikan pangkat yang terhad** dan jawatan peringkat ijazah yang sedikit, sehingga boleh menjejaskan motivasi. Hala tuju yang saya cadangkan ialah, pertama, **laluan kerjaya untuk yang berijazah**, seperti yang wujud bagi beberapa skim kesihatan lain. Kedua, **laluan kepakaran**: JTMP berijazah dijadikan pakar rujuk dalam bidang khusus, kualiti, penyelidikan dan latihan. Ketiga, **peluang mengetuai projek** inovasi dan pendigitalan. Sementara dasar diputuskan di peringkat kementerian, tugas saya sebagai penyelia ialah **memberi mereka peranan yang mencabar dan mengekalkan motivasi**.",
    e:"🎓",
    kw:"JTMP Berijazah",
    m:[["📜", "Lantikan: diploma, ramai berijazah"], ["💎", "Aset, jika dimanfaatkan"], ["🚧", "Cabaran: kenaikan pangkat terhad"], ["🪜", "Laluan kerjaya berijazah"], ["🔬", "Laluan kepakaran & pakar rujuk"], ["🚀", "Ketuai inovasi, kekal motivasi"]],
    j:["Lantikan: diploma, ramai berijazah", "Aset, jika dimanfaatkan", "Cabaran: kenaikan pangkat terhad", "Laluan kerjaya berijazah", "Laluan kepakaran & pakar rujuk", "Ketuai inovasi, kekal motivasi"],
    t:"Ini pandangan, bukan dasar rasmi. Semak pendirian terkini Ketua Profesion dan BSKB. Jangan mengkritik dasar di hadapan panel; beri cadangan yang membina." },

  { k:"Profesion JTMP", s:"Apakah cadangan anda untuk pembangunan profesion JTMP?",
    a:"Saya mencadangkan lima perkara. Pertama, **pembangunan kompetensi berstruktur**: laluan latihan yang jelas dari gred permulaan hingga penyelia, termasuk kemahiran pengurusan. Kedua, **bidang kepakaran** yang diiktiraf, supaya JTMP boleh menjadi pakar rujuk dalam disiplin tertentu. Ketiga, **budaya kualiti dan inovasi**, dengan menggalakkan penyertaan KIK, penyelidikan dan pembentangan. Keempat, **pendigitalan**: kemahiran data dan sistem maklumat makmal untuk semua peringkat. Kelima, **perancangan pelapis dan bimbingan**, supaya pengalaman pegawai kanan dipindahkan kepada generasi baharu sebelum mereka bersara.",
    e:"🚀",
    kw:"Bangun Profesion",
    m:[["🪜", "Kompetensi berstruktur"], ["🔬", "Bidang kepakaran diiktiraf"], ["💡", "Budaya kualiti & inovasi"], ["💻", "Pendigitalan & kemahiran data"], ["🌱", "Pelapis & bimbingan"]],
    j:["Kompetensi berstruktur", "Bidang kepakaran diiktiraf", "Budaya kualiti & inovasi", "Pendigitalan & kemahiran data", "Pelapis & bimbingan"],
    t:"Pilih dua atau tiga cadangan yang anda sendiri boleh mulakan di tempat kerja, dan beri contoh." },

  { k:"Profesion JTMP", s:"Apakah sumbangan anda kepada jabatan dan profesion?",
    a:"Kepada **jabatan**, sumbangan saya ialah **[contoh: memastikan perkhidmatan makmal tibi berjalan lancar dan berkualiti]**, serta **pengurusan aset** yang teratur. Melalui **projek KIK**, saya membantu menyelesaikan **[masalah]**, dan projek itu menang di **peringkat negeri dan kebangsaan**. Kepada **profesion**, saya menyumbang dengan **membimbing JTMP muda dan pelatih**, berkongsi pengalaman daripada lima jenis fasiliti, serta **[contoh: menjadi penceramah, fasilitator, auditor atau ahli jawatankuasa]**. Sepanjang hampir tiga dekad, saya menjaga **nama baik profesion** melalui kerja yang berintegriti.",
    e:"🤲",
    kw:"Sumbangan Saya",
    m:[["🧫", "Jabatan: khidmat makmal tibi"], ["🏷️", "Pengurusan aset teratur"], ["🏆", "KIK negeri & kebangsaan"], ["🎓", "Bimbing JTMP muda & pelatih"], ["🗣️", "Penceramah / auditor / AJK"], ["🤝", "Integriti hampir 3 dekad"]],
    j:["Jabatan: khidmat makmal tibi", "Pengurusan aset teratur", "KIK negeri & kebangsaan", "Bimbing JTMP muda & pelatih", "Penceramah / auditor / AJK", "Integriti hampir 3 dekad"],
    t:"Bezakan sumbangan kepada jabatan (tempat kerja) dengan sumbangan kepada profesion (melangkaui tempat kerja)." },

  { k:"Tip Hari Temuduga", s:"Tip: Bagaimanakah format temuduga dan cara mengurus masa?",
    a:"Temuduga dijalankan secara **bersemuka, seorang calon dengan tiga ahli panel**: wakil **JTMP Gred U8**, seorang **Pakar Patologi**, dan **Pegawai Tadbir dan Diplomatik dari Bahagian Sumber Manusia**. Setiap calon diberi kira-kira **30 minit**. Peruntukkan **5 hingga 8 minit** untuk pengenalan diri dan pengalaman kerja, dan susun dengan teliti kerana di situlah panel menilai cara anda menyampaikan diri. **Akhiri pengenalan** dengan keyakinan bahawa anda mampu menggalas tugas U8, sama ada dalam perkhidmatan patologi atau di JKN, dan **sanggup berpindah ke mana-mana**. Baki masa biasanya untuk soalan **pengurusan dan pentadbiran**.",
    e:"⏳",
    kw:"Format Temuduga",
    m:[["👥", "1 calon, 3 ahli panel"], ["🔬", "JTMP U8, Pakar Patologi, PTD"], ["⏳", "Kira-kira 30 minit"], ["🗣️", "Pengenalan: 5-8 minit"], ["✅", "Tutup: yakin & sanggup berpindah"], ["🗂️", "Selebihnya: pengurusan"]],
    j:["1 calon, 3 ahli panel", "JTMP U8, Pakar Patologi, PTD", "Kira-kira 30 minit", "Pengenalan: 5-8 minit", "Tutup: yakin & sanggup berpindah", "Selebihnya: pengurusan"],
    t:"Format boleh berubah; sahkan dengan surat panggilan temuduga." },

  { k:"Tip Hari Temuduga", s:"Tip: Bagaimanakah penampilan dan cara menjawab yang baik semasa temuduga?",
    a:"**Berpakaian kemas**, dengan **tanda nama** di tempat yang betul bersama **pas kerja**. **Duduk dengan sopan** dan gunakan **nada suara yang sederhana**. Jawab dengan **tenang**, tidak berlebih-lebihan, dan **jangan berhujah dengan panel**; jika tidak tahu, akui dengan jujur dan nyatakan cara anda akan mendapatkan jawapannya. Bawa **fail sijil** yang tersusun, kerana panel kadangkala menyoal terus daripadanya. Paling penting, **jangan gelabah**: tarik nafas, dengar soalan sehingga habis, dan jawab mengikut isi penting.",
    e:"🪪",
    kw:"Penampilan & Adab",

    a_ms:"Projek saya ialah **Electronic Quiz Challenge**, permainan kuiz pada **STM32 Nucleo-F401RE**, ditulis dalam **C++ dengan Mbed OS**. **LCD 20x4** yang disambung melalui **I2C** memaparkan soalan dan empat pilihan jawapan. Pemain menjawab dengan **empat butang tekan (A hingga D)**, sementara **paparan seven-segment dua digit** mengira detik masa. **LED hijau atau merah** menunjukkan sama ada jawapan betul, dan LCD memaparkan **markah daripada 20** pada akhir pusingan. 20 soalan disimpan dalam array dan **dirawak susunannya** setiap pusingan. Saya **ketua projek**, dan saya sendiri membuat **[bahagian saya]**.",

    a:"My project was the **Electronic Quiz Challenge**, a quiz game on the **STM32 Nucleo-F401RE**, written in **C++ on Mbed OS**. A **20x4 LCD**, connected by **I2C**, shows the question and four choices. The player answers with **four push buttons (A to D)**, while a **two-digit seven-segment display** counts down the time. A **green or red LED** shows whether the answer is correct, and the LCD shows the **score out of 20** at the end. The 20 questions are stored in an array and **shuffled** every round. I was the **project leader**, and I personally worked on **[my own part]**.",
